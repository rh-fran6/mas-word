---
- name: Run readiness checks for {{ cluster.id }}
  ansible.builtin.include_role:
    name: event_readiness
  vars:
    masworld_cluster_id: "{{ cluster.id }}"

- name: Record validation result for {{ cluster.id }}
  ansible.builtin.set_fact:
    masworld_validation_results: >-
      {{ masworld_validation_results | default([]) + [{'cluster_id': cluster.id, 'readiness': readiness_result | default('UNKNOWN')}] }}
