---
- name: Repair a cluster for MAS World 2026
  hosts: "{{ target_cluster | default('localhost') }}"
  gather_facts: false
  vars:
    masworld_cluster_id: "{{ cluster_id | mandatory }}"
    masworld_repair_components: "{{ repair_components | default('all') }}"

  pre_tasks:
    - name: Display repair target
      ansible.builtin.debug:
        msg: "Repairing cluster {{ masworld_cluster_id }}, components: {{ masworld_repair_components }}"

    - name: Run preflight before repair
      ansible.builtin.include_role:
        name: cluster_preflight

  tasks:
    - name: Repair MAS prerequisites
      ansible.builtin.include_role:
        name: mas_prerequisites
      when: masworld_repair_components == 'all' or 'mas_prerequisites' in masworld_repair_components

    - name: Repair MAS Core
      ansible.builtin.include_role:
        name: mas_core
      when: masworld_repair_components == 'all' or 'mas_core' in masworld_repair_components

    - name: Repair Maximo Manage
      ansible.builtin.include_role:
        name: maximo_manage
      when: masworld_repair_components == 'all' or 'manage' in masworld_repair_components

    - name: Repair logging stack
      ansible.builtin.include_role:
        name: "{{ item }}"
      loop:
        - logging_operator
        - loki_stack
        - log_forwarding
      when: masworld_repair_components == 'all' or 'logging' in masworld_repair_components

    - name: Repair identity
      ansible.builtin.include_role:
        name: identity_demo
      when: masworld_repair_components == 'all' or 'identity' in masworld_repair_components

    - name: Repair student accounts
      ansible.builtin.include_role:
        name: student_accounts
      when: masworld_repair_components == 'all' or 'students' in masworld_repair_components

    - name: Repair Showroom
      ansible.builtin.include_role:
        name: showroom
      when: masworld_repair_components == 'all' or 'showroom' in masworld_repair_components

  post_tasks:
    - name: Re-validate after repair
      ansible.builtin.include_role:
        name: event_readiness

    - name: Display repair result
      ansible.builtin.debug:
        msg: "Cluster {{ masworld_cluster_id }} repair complete. Readiness: {{ readiness_result | default('UNKNOWN') }}"
