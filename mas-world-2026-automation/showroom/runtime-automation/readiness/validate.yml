---
# Readiness validation — checks 14 infrastructure categories
# Run by Showroom zt-runner when the attendee clicks "Validate"
- name: Validate workshop readiness
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    seat: "{{ '%02d' | format(seat_number | int) }}"
    student_ns: "student-{{ seat }}"
    student_user: "user{{ seat }}"
    mas_core_ns: mas-inst1-core
    mas_manage_ns: mas-inst1-manage
    results: []

  tasks:
    # ------------------------------------------------------------------
    # 1. OpenShift API
    # ------------------------------------------------------------------
    - name: "Check 1 — OpenShift API reachable"
      kubernetes.core.k8s_cluster_info:
      register: api_result
      failed_when: false

    - name: Record API result
      ansible.builtin.set_fact:
        results: "{{ results + [{'category': 'OpenShift API', 'status': (api_result is succeeded) | ternary('PASS', 'FAIL')}] }}"

    # ------------------------------------------------------------------
    # 2. OpenShift Console route
    # ------------------------------------------------------------------
    - name: "Check 2 — OpenShift Console route"
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        name: console
        namespace: openshift-console
      register: console_route
      failed_when: false

    - name: Record Console result
      ansible.builtin.set_fact:
        results: "{{ results + [{'category': 'OpenShift Console', 'status': ((console_route.resources | default([])) | length > 0) | ternary('PASS', 'FAIL')}] }}"

    # ------------------------------------------------------------------
    # 3. MAS Core — Suite CR Ready
    # ------------------------------------------------------------------
    - name: "Check 3 — MAS Core Suite CR"
      kubernetes.core.k8s_info:
        api_version: core.mas.ibm.com/v1
        kind: Suite
        namespace: "{{ mas_core_ns }}"
      register: suite_cr
      failed_when: false

    - name: Evaluate Suite readiness
      ansible.builtin.set_fact:
        suite_ready: >-
          {{
            (suite_cr.resources | default([]) | length > 0) and
            (suite_cr.resources[0].status.conditions | default([])
              | selectattr('type', 'equalto', 'Ready')
              | selectattr('status', 'equalto', 'True')
              | list | length > 0)
          }}

    - name: Record MAS Core result
      ansible.builtin.set_fact:
        results: "{{ results + [{'category': 'MAS Core', 'status': suite_ready | bool | ternary('PASS', 'FAIL')}] }}"

    # ------------------------------------------------------------------
    # 4. Maximo Manage — ManageWorkspace CR Ready
    # ------------------------------------------------------------------
    - name: "Check 4 — ManageWorkspace CR"
      kubernetes.core.k8s_info:
        api_version: apps.mas.ibm.com/v1
        kind: ManageWorkspace
        namespace: "{{ mas_manage_ns }}"
      register: manage_ws
      failed_when: false

    - name: Evaluate ManageWorkspace readiness
      ansible.builtin.set_fact:
        manage_ready: >-
          {{
            (manage_ws.resources | default([]) | length > 0) and
            (manage_ws.resources[0].status.conditions | default([])
              | selectattr('type', 'equalto', 'Ready')
              | selectattr('status', 'equalto', 'True')
              | list | length > 0)
          }}

    - name: Record Manage result
      ansible.builtin.set_fact:
        results: "{{ results + [{'category': 'Maximo Manage', 'status': manage_ready | bool | ternary('PASS', 'FAIL')}] }}"

    # ------------------------------------------------------------------
    # 5. Database — Db2 pod running
    # ------------------------------------------------------------------
    - name: "Check 5 — Db2 pod running"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ mas_manage_ns }}"
        label_selectors:
          - app=db2
      register: db2_pods
      failed_when: false

    - name: Fallback — check db2 namespace
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: db2
        label_selectors:
          - app=db2
      register: db2_pods_alt
      failed_when: false
      when: (db2_pods.resources | default([]) | length) == 0

    - name: Evaluate Db2 status
      ansible.builtin.set_fact:
        db2_running: >-
          {{
            ((db2_pods.resources | default([])
              | selectattr('status.phase', 'equalto', 'Running')
              | list | length) > 0)
            or
            ((db2_pods_alt.resources | default([])
              | selectattr('status.phase', 'equalto', 'Running')
              | list | length) > 0)
          }}

    - name: Record Database result
      ansible.builtin.set_fact:
        results: "{{ results + [{'category': 'Database (Db2)', 'status': db2_running | bool | ternary('PASS', 'FAIL')}] }}"

    # ------------------------------------------------------------------
    # 6. Logging Operator — CSV Succeeded
    # ------------------------------------------------------------------
    - name: "Check 6 — Logging Operator CSV"
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: openshift-logging
      register: logging_csvs
      failed_when: false

    - name: Evaluate Logging CSV
      ansible.builtin.set_fact:
        logging_csv_ok: >-
          {{
            (logging_csvs.resources | default([])
              | selectattr('status.phase', 'defined')
              | selectattr('status.phase', 'equalto', 'Succeeded')
              | list | length) > 0
          }}

    - name: Record Logging Operator result
      ansible.builtin.set_fact:
        results: "{{ results + [{'category': 'Logging Operator', 'status': logging_csv_ok | bool | ternary('PASS', 'FAIL')}] }}"

    # ------------------------------------------------------------------
    # 7. LokiStack CR Ready
    # ------------------------------------------------------------------
    - name: "Check 7 — LokiStack CR"
      kubernetes.core.k8s_info:
        api_version: loki.grafana.com/v1
        kind: LokiStack
        namespace: openshift-logging
      register: lokistack
      failed_when: false

    - name: Evaluate LokiStack readiness
      ansible.builtin.set_fact:
        lokistack_ready: >-
          {{
            (lokistack.resources | default([]) | length > 0) and
            (lokistack.resources[0].status.conditions | default([])
              | selectattr('type', 'equalto', 'Ready')
              | selectattr('status', 'equalto', 'True')
              | list | length > 0)
          }}

    - name: Record LokiStack result
      ansible.builtin.set_fact:
        results: "{{ results + [{'category': 'LokiStack', 'status': lokistack_ready | bool | ternary('PASS', 'FAIL')}] }}"

    # ------------------------------------------------------------------
    # 8. S3 Object Storage — labelled secret
    # ------------------------------------------------------------------
    - name: "Check 8 — S3 storage secret"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: openshift-logging
        label_selectors:
          - masworld.io/component=loki-s3
      register: s3_secret
      failed_when: false

    - name: Record S3 result
      ansible.builtin.set_fact:
        results: "{{ results + [{'category': 'S3 Object Storage', 'status': ((s3_secret.resources | default([])) | length > 0) | ternary('PASS', 'FAIL')}] }}"

    # ------------------------------------------------------------------
    # 9. ClusterLogForwarder CR Ready
    # ------------------------------------------------------------------
    - name: "Check 9 — ClusterLogForwarder CR"
      kubernetes.core.k8s_info:
        api_version: observability.openshift.io/v1
        kind: ClusterLogForwarder
        namespace: openshift-logging
      register: clf
      failed_when: false

    - name: Evaluate ClusterLogForwarder readiness
      ansible.builtin.set_fact:
        clf_ready: >-
          {{
            (clf.resources | default([]) | length > 0) and
            (clf.resources[0].status.conditions | default([])
              | selectattr('type', 'equalto', 'Ready')
              | selectattr('status', 'equalto', 'True')
              | list | length > 0)
          }}

    - name: Record ClusterLogForwarder result
      ansible.builtin.set_fact:
        results: "{{ results + [{'category': 'ClusterLogForwarder', 'status': clf_ready | bool | ternary('PASS', 'FAIL')}] }}"

    # ------------------------------------------------------------------
    # 10. Identity Integration — Keycloak CR Ready
    # ------------------------------------------------------------------
    - name: "Check 10 — Keycloak CR"
      kubernetes.core.k8s_info:
        api_version: k8s.keycloak.org/v2alpha1
        kind: Keycloak
        namespace: masworld-keycloak
      register: keycloak
      failed_when: false

    - name: Evaluate Keycloak readiness
      ansible.builtin.set_fact:
        keycloak_ready: >-
          {{
            (keycloak.resources | default([]) | length > 0) and
            (keycloak.resources[0].status.conditions | default([])
              | selectattr('type', 'equalto', 'Ready')
              | selectattr('status', 'equalto', 'True')
              | list | length > 0)
          }}

    - name: Record Identity result
      ansible.builtin.set_fact:
        results: "{{ results + [{'category': 'Identity Integration', 'status': keycloak_ready | bool | ternary('PASS', 'FAIL')}] }}"

    # ------------------------------------------------------------------
    # 11. MAS Edge — not applicable
    # ------------------------------------------------------------------
    - name: "Check 11 — MAS Edge (disabled by design)"
      ansible.builtin.set_fact:
        results: "{{ results + [{'category': 'MAS Edge', 'status': 'NOT_APPLICABLE'}] }}"

    # ------------------------------------------------------------------
    # 12. Showroom Runtime — pod Running
    # ------------------------------------------------------------------
    - name: "Check 12 — Showroom Runtime pod"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: showroom
        label_selectors:
          - app.kubernetes.io/name=showroom
      register: showroom_pods
      failed_when: false

    - name: Record Showroom result
      ansible.builtin.set_fact:
        results: "{{ results + [{'category': 'Showroom Runtime', 'status': ((showroom_pods.resources | default([]) | selectattr('status.phase', 'equalto', 'Running') | list | length) > 0) | ternary('PASS', 'FAIL')}] }}"

    # ------------------------------------------------------------------
    # 13. Student Authentication — htpasswd secret
    # ------------------------------------------------------------------
    - name: "Check 13 — htpasswd secret"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: htpasswd-secret
        namespace: openshift-config
      register: htpasswd_secret
      failed_when: false

    - name: Record Student Auth result
      ansible.builtin.set_fact:
        results: "{{ results + [{'category': 'Student Authentication', 'status': ((htpasswd_secret.resources | default([])) | length > 0) | ternary('PASS', 'FAIL')}] }}"

    # ------------------------------------------------------------------
    # 14. Student RBAC — RoleBinding in student namespace
    # ------------------------------------------------------------------
    - name: "Check 14 — Student RoleBinding"
      kubernetes.core.k8s_info:
        api_version: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        namespace: "{{ student_ns }}"
      register: student_rb
      failed_when: false

    - name: Evaluate student RBAC
      ansible.builtin.set_fact:
        student_rb_found: >-
          {{
            (student_rb.resources | default([])
              | selectattr('subjects', 'defined')
              | list | length) > 0
          }}

    - name: Record Student RBAC result
      ansible.builtin.set_fact:
        results: "{{ results + [{'category': 'Student RBAC', 'status': student_rb_found | bool | ternary('PASS', 'FAIL')}] }}"

    # ------------------------------------------------------------------
    # Summary
    # ------------------------------------------------------------------
    - name: Count pass and fail
      ansible.builtin.set_fact:
        pass_count: "{{ results | selectattr('status', 'equalto', 'PASS') | list | length }}"
        fail_count: "{{ results | selectattr('status', 'equalto', 'FAIL') | list | length }}"
        na_count: "{{ results | selectattr('status', 'equalto', 'NOT_APPLICABLE') | list | length }}"

    - name: Display readiness summary
      ansible.builtin.debug:
        msg: |
          ============================================================
           MAS World 2026 — Workshop Readiness Report
           Seat: {{ seat }}  ({{ student_user }})
          ============================================================
          {% for r in results %}
           {{ '%-30s' | format(r.category) }}  {{ r.status }}
          {% endfor %}
          ------------------------------------------------------------
           PASS: {{ pass_count }}   FAIL: {{ fail_count }}   N/A: {{ na_count }}
          ============================================================
