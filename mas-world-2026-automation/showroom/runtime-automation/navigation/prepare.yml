---
# Navigation exercise pre-check — verifies MAS namespaces and Suite CR exist
- name: Prepare navigation exercise
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    seat: "{{ '%02d' | format(seat_number | int) }}"
    mas_core_ns: mas-inst1-core
    mas_manage_ns: mas-inst1-manage
    ready: true

  tasks:
    # ------------------------------------------------------------------
    # Verify MAS namespaces exist
    # ------------------------------------------------------------------
    - name: Check MAS core namespace
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: "{{ mas_core_ns }}"
      register: core_ns
      failed_when: false

    - name: Mark not ready — core namespace missing
      ansible.builtin.set_fact:
        ready: false
      when: (core_ns.resources | default([]) | length) == 0

    - name: Check MAS manage namespace
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: "{{ mas_manage_ns }}"
      register: manage_ns
      failed_when: false

    - name: Mark not ready — manage namespace missing
      ansible.builtin.set_fact:
        ready: false
      when: (manage_ns.resources | default([]) | length) == 0

    # ------------------------------------------------------------------
    # Verify Suite CR exists
    # ------------------------------------------------------------------
    - name: Check Suite CR in core namespace
      kubernetes.core.k8s_info:
        api_version: core.mas.ibm.com/v1
        kind: Suite
        namespace: "{{ mas_core_ns }}"
      register: suite_cr
      failed_when: false

    - name: Mark not ready — Suite CR missing
      ansible.builtin.set_fact:
        ready: false
      when: (suite_cr.resources | default([]) | length) == 0

    # ------------------------------------------------------------------
    # Result
    # ------------------------------------------------------------------
    - name: Report readiness
      ansible.builtin.debug:
        msg: >-
          {% if ready | bool %}
          Navigation exercise is ready.
          MAS core namespace ({{ mas_core_ns }}), manage namespace ({{ mas_manage_ns }}),
          and Suite CR are all present.
          {% else %}
          Navigation exercise is NOT ready. Missing prerequisites:
          {% if (core_ns.resources | default([]) | length) == 0 %} - Namespace {{ mas_core_ns }}{% endif %}
          {% if (manage_ns.resources | default([]) | length) == 0 %} - Namespace {{ mas_manage_ns }}{% endif %}
          {% if (suite_cr.resources | default([]) | length) == 0 %} - Suite CR in {{ mas_core_ns }}{% endif %}
          {% endif %}
