---
# Converge: run the config_validation role with valid configuration.
#
# This playbook exercises the happy path — all required keys present,
# credential references in secret:// format, component flags as booleans.
- name: Converge — config_validation with valid configuration
  hosts: instance
  gather_facts: false
  vars:
    # Required top-level keys
    masworld_event_id: "mas-world-2026"
    masworld_cluster_name: "test-cluster-01"
    masworld_base_domain: "example.com"

    # Cluster connection data
    masworld_cluster_api_url: "https://api.test-cluster-01.example.com:6443"
    masworld_kubeconfig: "/tmp/fake-kubeconfig"

    # Credential references in secret:// format
    masworld_ibm_entitlement_ref: "secret://mas-world/ibm/entitlement"
    masworld_mas_license_file: "secret://mas-world/ibm/license"

    # Component flags (boolean)
    masworld_mas_core_enabled: true
    masworld_manage_enabled: true

    # Role control
    masworld_config_validation_strict: true
    masworld_config_validation_fail_on_warning: false

  roles:
    - role: config_validation
