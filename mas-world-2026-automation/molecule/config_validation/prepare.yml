---
# Prepare: create temporary config fixtures for config_validation tests.
- name: Prepare config_validation test fixtures
  hosts: instance
  gather_facts: false
  tasks:
    - name: Create temporary test config directory
      ansible.builtin.file:
        path: /tmp/masworld-molecule-config-validation
        state: directory
        mode: "0755"

    - name: Write a valid test configuration fixture
      ansible.builtin.copy:
        content: |
          ---
          masworld_event_id: "mas-world-2026"
          masworld_cluster_name: "test-cluster-01"
          masworld_base_domain: "example.com"
          masworld_cluster_api_url: "https://api.test-cluster-01.example.com:6443"
          masworld_kubeconfig: "/tmp/fake-kubeconfig"
          masworld_ibm_entitlement_ref: "secret://mas-world/ibm/entitlement"
          masworld_mas_license_file: "secret://mas-world/ibm/license"
          masworld_mas_core_enabled: true
          masworld_manage_enabled: true
        dest: /tmp/masworld-molecule-config-validation/valid-config.yml
        mode: "0644"

    - name: Write an invalid test configuration fixture (missing keys)
      ansible.builtin.copy:
        content: |
          ---
          # Deliberately missing masworld_event_id and masworld_cluster_name
          masworld_base_domain: "example.com"
          masworld_cluster_api_url: "https://api.test.example.com:6443"
          masworld_kubeconfig: "/tmp/fake-kubeconfig"
          masworld_ibm_entitlement_ref: "not-a-secret-reference"
          masworld_mas_license_file: ""
          masworld_mas_core_enabled: "yes-string-not-boolean"
          masworld_manage_enabled: true
        dest: /tmp/masworld-molecule-config-validation/invalid-config.yml
        mode: "0644"
