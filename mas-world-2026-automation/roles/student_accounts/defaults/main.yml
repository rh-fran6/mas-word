---
# Student Accounts role defaults
masworld_student_accounts_enabled: true

# Username and namespace templates — uses masworld.automation.pad filter
masworld_student_username_template: "user{{ seat_number | masworld.automation.pad(2) }}"
masworld_student_namespace_template: "student-{{ seat_number | masworld.automation.pad(2) }}"

# Cluster role for student access
masworld_student_cluster_role: "basic-user"

# Credential profile to use
masworld_student_credential_profile: "attendee-default"

# Whether to allow shared passwords across students
masworld_student_allow_shared_password: false

# Generated password length
masworld_student_password_length: 18

# Seat number — set by playbook loop
masworld_seat_number: "{{ seat_number | default(1) }}"

# OAuth CR name
masworld_oauth_cr_name: "cluster"

# Identity provider name in OAuth
masworld_htpasswd_idp_name: "masworld-htpasswd"

# Secret name for htpasswd data
masworld_htpasswd_secret_name: "masworld-htpasswd-secret"
masworld_htpasswd_secret_namespace: "openshift-config"
