---
# config_validation/tasks/main.yml
# Validates the merged configuration before any cluster modification.
# Sets fact: config_validation_result (pass/fail)

- name: Initialize validation results
  ansible.builtin.set_fact:
    _config_errors: []
    _config_warnings: []

# --- Validate required config keys ---
- name: Check required configuration keys are defined
  ansible.builtin.set_fact:
    _config_errors: >-
      {{ _config_errors + ['Required key "' + item + '" is not defined'] }}
  loop: "{{ masworld_config_required_keys }}"
  when: lookup('ansible.builtin.vars', item, default='__UNDEFINED__') == '__UNDEFINED__'

# --- Validate cluster connection data ---
- name: Check cluster API URL is defined
  ansible.builtin.set_fact:
    _config_errors: >-
      {{ _config_errors + ['Cluster API URL (masworld_cluster_api_url) is not defined'] }}
  when: masworld_cluster_api_url is not defined or masworld_cluster_api_url | length == 0

- name: Check cluster kubeconfig or token is available
  ansible.builtin.set_fact:
    _config_errors: >-
      {{ _config_errors + ['Neither masworld_kubeconfig nor masworld_api_token is defined — cluster authentication not configured'] }}
  when:
    - masworld_kubeconfig is not defined or masworld_kubeconfig | length == 0
    - masworld_api_token is not defined or masworld_api_token | length == 0

# --- Validate component flags ---
- name: Check component flags are defined and boolean
  block:
    - name: Verify component flag exists
      ansible.builtin.set_fact:
        _config_errors: >-
          {{ _config_errors + ['Component flag "' + item + '" is not defined'] }}
      loop: "{{ masworld_config_component_flags }}"
      when: lookup('ansible.builtin.vars', item, default='__UNDEFINED__') == '__UNDEFINED__'

    - name: Verify component flags are boolean type
      ansible.builtin.set_fact:
        _config_warnings: >-
          {{ _config_warnings + ['Component flag "' + item + '" is not a boolean value'] }}
      loop: "{{ masworld_config_component_flags }}"
      when:
        - lookup('ansible.builtin.vars', item, default='__UNDEFINED__') != '__UNDEFINED__'
        - lookup('ansible.builtin.vars', item) | type_debug != 'bool'

# --- Validate credential references are in secret:// format ---
- name: Check credential references use secret:// format
  ansible.builtin.set_fact:
    _config_errors: >-
      {{ _config_errors + ['Credential "' + item + '" must use secret:// reference format but has value that does not start with "secret://"'] }}
  loop: "{{ masworld_config_credential_keys }}"
  when:
    - masworld_config_validation_strict | bool
    - lookup('ansible.builtin.vars', item, default='') | string | length > 0
    - not (lookup('ansible.builtin.vars', item, default='') | string).startswith('secret://')

- name: Check credential references are not empty
  ansible.builtin.set_fact:
    _config_errors: >-
      {{ _config_errors + ['Credential "' + item + '" is not defined or empty'] }}
  loop: "{{ masworld_config_credential_keys }}"
  when:
    - masworld_config_validation_strict | bool
    - lookup('ansible.builtin.vars', item, default='') | string | length == 0

# --- Determine validation result ---
- name: Promote warnings to errors if fail_on_warning is set
  ansible.builtin.set_fact:
    _config_errors: "{{ _config_errors + _config_warnings }}"
  when: masworld_config_validation_fail_on_warning | bool

- name: Display validation warnings
  ansible.builtin.debug:
    msg: "CONFIG WARNING: {{ item }}"
  loop: "{{ _config_warnings }}"
  when: _config_warnings | length > 0

- name: Display validation errors
  ansible.builtin.debug:
    msg: "CONFIG ERROR: {{ item }}"
  loop: "{{ _config_errors }}"
  when: _config_errors | length > 0

- name: Set config_validation_result fact
  ansible.builtin.set_fact:
    config_validation_result: "{{ 'pass' if (_config_errors | length == 0) else 'fail' }}"
    config_validation_errors: "{{ _config_errors }}"
    config_validation_warnings: "{{ _config_warnings }}"

- name: Fail if validation errors found in strict mode
  ansible.builtin.fail:
    msg: >-
      Configuration validation failed with {{ _config_errors | length }} error(s):
      {{ _config_errors | join('; ') }}
  when:
    - masworld_config_validation_strict | bool
    - _config_errors | length > 0

- name: Report validation passed
  ansible.builtin.debug:
    msg: "Configuration validation passed ({{ _config_warnings | length }} warning(s))"
  when: _config_errors | length == 0
