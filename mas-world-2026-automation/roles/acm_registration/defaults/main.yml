---
# acm_registration defaults
# Configuration for registering clusters with ACM hub.

# Whether ACM registration is enabled
masworld_acm_enabled: true

# Path to the ACM hub cluster kubeconfig
masworld_acm_hub_kubeconfig: ""

# ManagedClusterSet to assign this cluster to
masworld_acm_cluster_set: "mas-world-2026"

# Labels applied to the ManagedCluster resource
masworld_acm_labels:
  event: "mas-world-2026"
  workload: "maximo"
  environment: "workshop"
  purpose: "attendee"

# Timeout in seconds for waiting on ManagedCluster availability
masworld_acm_availability_timeout: 600

# Retry interval in seconds for availability checks
masworld_acm_availability_retries: 30

# Retry delay in seconds
masworld_acm_availability_delay: 20
