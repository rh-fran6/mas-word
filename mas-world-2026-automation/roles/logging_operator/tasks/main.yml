---
# logging_operator/tasks/main.yml
# Installs OpenShift Logging, Cluster Observability, and Loki operators.
# Sets fact: logging_operators_ready (true/false)

- name: Skip logging operator installation if not enabled
  when: not (masworld_logging_enabled | bool)
  block:
    - name: Set logging operators skipped
      ansible.builtin.set_fact:
        logging_operators_ready: false
        logging_operators_status: "skipped"

    - name: Report logging operators skipped
      ansible.builtin.debug:
        msg: "Logging operator installation is disabled — skipping"

    - name: End role early
      ansible.builtin.meta: end_role

- name: Install logging operators
  block:
    # --- Create Namespaces ---
    - name: Create openshift-logging namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: openshift-logging
            labels:
              openshift.io/cluster-monitoring: "true"
              app.kubernetes.io/managed-by: "ansible"
            annotations:
              openshift.io/node-selector: ""

    - name: Create openshift-operators-redhat namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: openshift-operators-redhat
            labels:
              openshift.io/cluster-monitoring: "true"
              app.kubernetes.io/managed-by: "ansible"

    - name: Create openshift-loki namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: openshift-loki
            labels:
              openshift.io/cluster-monitoring: "true"
              app.kubernetes.io/managed-by: "ansible"

    # --- Create OperatorGroups ---
    - name: Create OperatorGroup for openshift-logging
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: openshift-logging-operatorgroup
            namespace: openshift-logging
          spec:
            targetNamespaces:
              - openshift-logging

    - name: Create OperatorGroup for openshift-loki
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: openshift-loki-operatorgroup
            namespace: openshift-loki
          spec:
            targetNamespaces:
              - openshift-loki

    # --- Create Subscriptions ---
    - name: Create Cluster Logging Operator Subscription
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: cluster-logging
            namespace: openshift-logging
          spec:
            channel: "{{ masworld_logging_operator_channel }}"
            name: cluster-logging
            source: "{{ masworld_logging_operator_source }}"
            sourceNamespace: "{{ masworld_logging_catalog_source_namespace }}"
            installPlanApproval: "{{ masworld_logging_install_plan_approval }}"

    - name: Create Cluster Observability Operator Subscription
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: cluster-observability-operator
            namespace: openshift-operators-redhat
          spec:
            channel: "{{ masworld_coo_operator_channel }}"
            name: cluster-observability-operator
            source: "{{ masworld_logging_operator_source }}"
            sourceNamespace: "{{ masworld_logging_catalog_source_namespace }}"
            installPlanApproval: "{{ masworld_logging_install_plan_approval }}"

    - name: Create Loki Operator Subscription
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: loki-operator
            namespace: openshift-loki
          spec:
            channel: "{{ masworld_loki_operator_channel }}"
            name: loki-operator
            source: "{{ masworld_logging_operator_source }}"
            sourceNamespace: "{{ masworld_logging_catalog_source_namespace }}"
            installPlanApproval: "{{ masworld_logging_install_plan_approval }}"

    # --- Wait for Cluster Logging Operator CSV ---
    - name: Wait for Cluster Logging Operator CSV to succeed
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: openshift-logging
        label_selectors:
          - "operators.coreos.com/cluster-logging.openshift-logging"
      register: _logging_csv
      until: >-
        _logging_csv.resources | length > 0 and
        _logging_csv.resources[0].status is defined and
        _logging_csv.resources[0].status.phase is defined and
        _logging_csv.resources[0].status.phase == 'Succeeded'
      retries: "{{ masworld_logging_csv_retries }}"
      delay: "{{ masworld_logging_csv_delay }}"

    - name: Record Logging Operator version
      ansible.builtin.set_fact:
        _logging_operator_version: "{{ _logging_csv.resources[0].spec.version | default('unknown') }}"

    # --- Wait for Cluster Observability Operator CSV ---
    - name: Wait for Cluster Observability Operator CSV to succeed
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: openshift-operators-redhat
        label_selectors:
          - "operators.coreos.com/cluster-observability-operator.openshift-operators-redhat"
      register: _coo_csv
      until: >-
        _coo_csv.resources | length > 0 and
        _coo_csv.resources[0].status is defined and
        _coo_csv.resources[0].status.phase is defined and
        _coo_csv.resources[0].status.phase == 'Succeeded'
      retries: "{{ masworld_logging_csv_retries }}"
      delay: "{{ masworld_logging_csv_delay }}"

    - name: Record COO version
      ansible.builtin.set_fact:
        _coo_operator_version: "{{ _coo_csv.resources[0].spec.version | default('unknown') }}"

    # --- Wait for Loki Operator CSV ---
    - name: Wait for Loki Operator CSV to succeed
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: openshift-loki
        label_selectors:
          - "operators.coreos.com/loki-operator.openshift-loki"
      register: _loki_csv
      until: >-
        _loki_csv.resources | length > 0 and
        _loki_csv.resources[0].status is defined and
        _loki_csv.resources[0].status.phase is defined and
        _loki_csv.resources[0].status.phase == 'Succeeded'
      retries: "{{ masworld_logging_csv_retries }}"
      delay: "{{ masworld_logging_csv_delay }}"

    - name: Record Loki Operator version
      ansible.builtin.set_fact:
        _loki_operator_version: "{{ _loki_csv.resources[0].spec.version | default('unknown') }}"

    # --- Set Success Facts ---
    - name: Set logging_operators_ready fact
      ansible.builtin.set_fact:
        logging_operators_ready: true
        logging_operators_status: "ready"
        logging_operator_versions:
          cluster_logging: "{{ _logging_operator_version }}"
          cluster_observability: "{{ _coo_operator_version }}"
          loki: "{{ _loki_operator_version }}"

    - name: Report logging operators ready
      ansible.builtin.debug:
        msg: >-
          All logging operators ready —
          Logging: {{ _logging_operator_version }},
          COO: {{ _coo_operator_version }},
          Loki: {{ _loki_operator_version }}

  rescue:
    - name: Set logging operators failed
      ansible.builtin.set_fact:
        logging_operators_ready: false
        logging_operators_status: "failed"
        logging_operators_error: "{{ ansible_failed_result.msg | default('Unknown logging operator error') }}"

    - name: Report logging operator failure
      ansible.builtin.fail:
        msg: >-
          Logging operator installation failed:
          {{ logging_operators_error }}
