---
# ACM exercise validation — checks the event marker ConfigMap
- name: Validate ACM exercise
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    seat: "{{ '%02d' | format(seat_number | int) }}"
    marker_ns: masworld-system
    marker_name: masworld-event-marker
    expected_event: mas-world-2026

  tasks:
    # ------------------------------------------------------------------
    # Check ConfigMap exists with correct data
    # ------------------------------------------------------------------
    - name: Get event marker ConfigMap
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        name: "{{ marker_name }}"
        namespace: "{{ marker_ns }}"
      register: marker_cm
      failed_when: false

    - name: Evaluate ConfigMap presence
      ansible.builtin.set_fact:
        cm_exists: "{{ (marker_cm.resources | default([]) | length) > 0 }}"

    - name: Evaluate event key value
      ansible.builtin.set_fact:
        event_correct: >-
          {{
            cm_exists | bool and
            (marker_cm.resources[0].data.event | default('') == expected_event)
          }}

    # ------------------------------------------------------------------
    # Result
    # ------------------------------------------------------------------
    - name: Display validation result
      ansible.builtin.debug:
        msg: |
          ============================================================
           ACM Exercise — Validation Results
           Seat: {{ seat }}
          ============================================================
           ConfigMap '{{ marker_name }}' exists in {{ marker_ns }}:
             {{ cm_exists | bool | ternary('PASS', 'FAIL') }}
           Key 'event' equals '{{ expected_event }}':
             {{ event_correct | bool | ternary('PASS', 'FAIL') }}
          ============================================================
          {% if event_correct | bool %}
           Overall: PASS
          {% else %}
           Overall: FAIL
          {% if not cm_exists | bool %}
           Hint: ConfigMap '{{ marker_name }}' was not found in namespace '{{ marker_ns }}'.
          {% elif not event_correct | bool %}
           Hint: The 'event' key exists but its value is
           '{{ marker_cm.resources[0].data.event | default("(missing)") }}'
           instead of '{{ expected_event }}'.
          {% endif %}
          {% endif %}
