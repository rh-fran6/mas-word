---
# Updates exercise reset — no-op (all exercises are read-only queries)
- name: Reset updates exercise
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    seat: "{{ '%02d' | format(seat_number | int) }}"

  tasks:
    - name: Confirm no reset needed
      ansible.builtin.debug:
        msg: >-
          Updates exercises are read-only. No reset required.
          All queries in the updates module only read cluster state
          and do not modify any resources. Seat {{ seat }} is ready
          to repeat the exercise at any time.
