---
# Navigation exercise validation — checks the student can see MAS resources
- name: Validate navigation exercise
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    seat: "{{ '%02d' | format(seat_number | int) }}"
    student_ns: "student-{{ seat }}"
    mas_core_ns: mas-inst1-core
    mas_manage_ns: mas-inst1-manage
    results: []

  tasks:
    # ------------------------------------------------------------------
    # 1. MAS core namespace exists
    # ------------------------------------------------------------------
    - name: Check MAS core namespace
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: "{{ mas_core_ns }}"
      register: core_ns
      failed_when: false

    - name: Record core namespace result
      ansible.builtin.set_fact:
        results: "{{ results + [{'check': 'MAS core namespace (' + mas_core_ns + ')', 'status': ((core_ns.resources | default([])) | length > 0) | ternary('PASS', 'FAIL')}] }}"

    # ------------------------------------------------------------------
    # 2. MAS manage namespace exists
    # ------------------------------------------------------------------
    - name: Check MAS manage namespace
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: "{{ mas_manage_ns }}"
      register: manage_ns
      failed_when: false

    - name: Record manage namespace result
      ansible.builtin.set_fact:
        results: "{{ results + [{'check': 'MAS manage namespace (' + mas_manage_ns + ')', 'status': ((manage_ns.resources | default([])) | length > 0) | ternary('PASS', 'FAIL')}] }}"

    # ------------------------------------------------------------------
    # 3. Suite CR exists and is Ready
    # ------------------------------------------------------------------
    - name: Check Suite CR
      kubernetes.core.k8s_info:
        api_version: core.mas.ibm.com/v1
        kind: Suite
        namespace: "{{ mas_core_ns }}"
      register: suite_cr
      failed_when: false

    - name: Evaluate Suite readiness
      ansible.builtin.set_fact:
        suite_ready: >-
          {{
            (suite_cr.resources | default([]) | length > 0) and
            (suite_cr.resources[0].status.conditions | default([])
              | selectattr('type', 'equalto', 'Ready')
              | selectattr('status', 'equalto', 'True')
              | list | length > 0)
          }}

    - name: Record Suite CR result
      ansible.builtin.set_fact:
        results: "{{ results + [{'check': 'Suite CR exists and Ready', 'status': suite_ready | bool | ternary('PASS', 'FAIL')}] }}"

    # ------------------------------------------------------------------
    # 4. At least one CSV (operator) in mas-inst1-core
    # ------------------------------------------------------------------
    - name: Check CSVs in MAS core namespace
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: "{{ mas_core_ns }}"
      register: core_csvs
      failed_when: false

    - name: Record CSV result
      ansible.builtin.set_fact:
        results: "{{ results + [{'check': 'Operator CSV(s) in ' + mas_core_ns, 'status': ((core_csvs.resources | default([])) | length > 0) | ternary('PASS', 'FAIL')}] }}"

    # ------------------------------------------------------------------
    # 5. Student namespace exists
    # ------------------------------------------------------------------
    - name: Check student namespace
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: "{{ student_ns }}"
      register: stu_ns
      failed_when: false

    - name: Record student namespace result
      ansible.builtin.set_fact:
        results: "{{ results + [{'check': 'Student namespace (' + student_ns + ')', 'status': ((stu_ns.resources | default([])) | length > 0) | ternary('PASS', 'FAIL')}] }}"

    # ------------------------------------------------------------------
    # Summary
    # ------------------------------------------------------------------
    - name: Display validation results
      ansible.builtin.debug:
        msg: |
          ============================================================
           Navigation Exercise — Validation Results
           Seat: {{ seat }}
          ============================================================
          {% for r in results %}
           {{ '%-45s' | format(r.check) }}  {{ r.status }}
          {% endfor %}
          ============================================================
