---
# Observability exercise – reset
# Cleans up the exercise so the student can start over.
- name: Reset observability exercise
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    seat_padded: "{{ '%02d' | format(seat_number | int) }}"
    student_ns: "student-{{ seat_padded }}"
    pod_name: "log-test-{{ seat_padded }}"

  tasks:
    # ------------------------------------------------------------------
    # 1. Delete log-test pod if it exists
    # ------------------------------------------------------------------
    - name: Delete log-test pod from student namespace
      kubernetes.core.k8s:
        api_version: v1
        kind: Pod
        name: "{{ pod_name }}"
        namespace: "{{ student_ns }}"
        state: absent
      register: pod_delete
      failed_when: false

    - name: Report cleanup result
      ansible.builtin.debug:
        msg: >-
          {{ 'Deleted pod ' + pod_name + ' from ' + student_ns
             if pod_delete.changed | default(false)
             else 'No log-test pod found in ' + student_ns + ' (already clean)' }}

    # ------------------------------------------------------------------
    # 2. Confirmation
    # ------------------------------------------------------------------
    - name: Reset confirmation
      ansible.builtin.debug:
        msg: |
          ============================================================
          Observability exercise reset. You can re-run the exercise
          from the beginning.
          ============================================================
