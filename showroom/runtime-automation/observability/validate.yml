---
# Observability exercise – validate
# Checks that the student has completed all operator installations.
- name: Validate observability exercise
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    seat_padded: "{{ '%02d' | format(seat_number | int) }}"
    student_ns: "student-{{ seat_padded }}"
    logging_ns: openshift-logging

  tasks:
    # ------------------------------------------------------------------
    # 1. Logging Operator CSV
    # ------------------------------------------------------------------
    - name: Check Logging Operator CSV
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: "{{ logging_ns }}"
      register: logging_csvs
      failed_when: false

    - name: Evaluate Logging Operator
      ansible.builtin.set_fact:
        logging_pass: >-
          {{ logging_csvs.resources | default([])
             | selectattr('metadata.name', 'search', 'cluster-logging')
             | selectattr('status.phase', 'defined')
             | selectattr('status.phase', 'equalto', 'Succeeded')
             | list | length > 0 }}

    # ------------------------------------------------------------------
    # 2. Loki Operator CSV
    # ------------------------------------------------------------------
    - name: Evaluate Loki Operator
      ansible.builtin.set_fact:
        loki_op_pass: >-
          {{ logging_csvs.resources | default([])
             | selectattr('metadata.name', 'search', 'loki-operator')
             | selectattr('status.phase', 'defined')
             | selectattr('status.phase', 'equalto', 'Succeeded')
             | list | length > 0 }}

    # ------------------------------------------------------------------
    # 3. Cluster Observability Operator CSV
    # ------------------------------------------------------------------
    - name: Check COO CSV in openshift-operators
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: openshift-operators
      register: coo_csvs
      failed_when: false

    - name: Evaluate COO
      ansible.builtin.set_fact:
        coo_pass: >-
          {{ coo_csvs.resources | default([])
             | selectattr('metadata.name', 'search', 'cluster-observability-operator')
             | selectattr('status.phase', 'defined')
             | selectattr('status.phase', 'equalto', 'Succeeded')
             | list | length > 0 }}

    # ------------------------------------------------------------------
    # 4. LokiStack readiness
    # ------------------------------------------------------------------
    - name: Check LokiStack CR
      kubernetes.core.k8s_info:
        api_version: loki.grafana.com/v1
        kind: LokiStack
        name: logging-loki
        namespace: "{{ logging_ns }}"
      register: lokistack_result
      failed_when: false

    - name: Evaluate LokiStack
      ansible.builtin.set_fact:
        lokistack_pass: >-
          {{ lokistack_result.resources | default([])
             | selectattr('status.conditions', 'defined')
             | map(attribute='status.conditions') | flatten
             | selectattr('type', 'equalto', 'Ready')
             | selectattr('status', 'equalto', 'True')
             | list | length > 0 }}

    # ------------------------------------------------------------------
    # 5. S3 storage secret
    # ------------------------------------------------------------------
    - name: Check S3 secret in logging namespace
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: logging-loki-s3
        namespace: "{{ logging_ns }}"
      register: s3_secret
      failed_when: false

    - name: Evaluate S3 secret
      ansible.builtin.set_fact:
        s3_pass: "{{ s3_secret.resources | default([]) | length > 0 }}"

    # ------------------------------------------------------------------
    # 6. ClusterLogForwarder readiness
    # ------------------------------------------------------------------
    - name: Check ClusterLogForwarder CR
      kubernetes.core.k8s_info:
        api_version: observability.openshift.io/v1
        kind: ClusterLogForwarder
        namespace: "{{ logging_ns }}"
      register: clf_result
      failed_when: false

    - name: Evaluate ClusterLogForwarder
      ansible.builtin.set_fact:
        clf_pass: >-
          {{ clf_result.resources | default([])
             | selectattr('status.conditions', 'defined')
             | map(attribute='status.conditions') | flatten
             | selectattr('type', 'equalto', 'Ready')
             | selectattr('status', 'equalto', 'True')
             | list | length > 0 }}

    # ------------------------------------------------------------------
    # 7. UIPlugin
    # ------------------------------------------------------------------
    - name: Check UIPlugin
      kubernetes.core.k8s_info:
        api_version: observability.openshift.io/v1alpha1
        kind: UIPlugin
        name: logging
      register: uiplugin_result
      failed_when: false

    - name: Evaluate UIPlugin
      ansible.builtin.set_fact:
        uiplugin_pass: "{{ uiplugin_result.resources | default([]) | length > 0 }}"

    # ------------------------------------------------------------------
    # 8. Collector pods running
    # ------------------------------------------------------------------
    - name: Check collector pods
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ logging_ns }}"
        label_selectors:
          - app.kubernetes.io/component=collector
      register: collector_pods
      failed_when: false

    - name: Evaluate collector pods
      ansible.builtin.set_fact:
        collector_pass: >-
          {{ collector_pods.resources | default([])
             | selectattr('status.phase', 'defined')
             | selectattr('status.phase', 'equalto', 'Running')
             | list | length > 0 }}

    # ------------------------------------------------------------------
    # 9. Student namespace exists
    # ------------------------------------------------------------------
    - name: Check student namespace
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: "{{ student_ns }}"
      register: ns_result
      failed_when: false

    - name: Evaluate namespace
      ansible.builtin.set_fact:
        ns_pass: "{{ ns_result.resources | default([]) | length > 0 }}"

    # ------------------------------------------------------------------
    # 10. Log-test pod (clean or completed)
    # ------------------------------------------------------------------
    - name: Check for leftover log-test pod
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        name: "log-test-{{ seat_padded }}"
        namespace: "{{ student_ns }}"
      register: test_pod_result
      failed_when: false

    - name: Evaluate test pod
      ansible.builtin.set_fact:
        test_pod_pass: >-
          {{ (test_pod_result.resources | default([]) | length == 0) or
             (test_pod_result.resources | default([])
              | selectattr('status.phase', 'defined')
              | selectattr('status.phase', 'equalto', 'Succeeded')
              | list | length > 0) }}

    # ------------------------------------------------------------------
    # Summary
    # ------------------------------------------------------------------
    - name: Validation summary
      ansible.builtin.debug:
        msg: |
          ============================================================
          OBSERVABILITY EXERCISE – VALIDATION RESULTS (seat {{ seat_padded }})
          ============================================================
          Logging Operator CSV (Succeeded)    : {{ 'PASS' if logging_pass | bool else 'FAIL' }}
          Loki Operator CSV (Succeeded)       : {{ 'PASS' if loki_op_pass | bool else 'FAIL' }}
          Cluster Observability Operator CSV  : {{ 'PASS' if coo_pass | bool else 'FAIL' }}
          S3 storage secret                   : {{ 'PASS' if s3_pass | bool else 'FAIL' }}
          LokiStack CR (Ready)                : {{ 'PASS' if lokistack_pass | bool else 'FAIL' }}
          ClusterLogForwarder CR (Ready)       : {{ 'PASS' if clf_pass | bool else 'FAIL' }}
          UIPlugin (logging)                  : {{ 'PASS' if uiplugin_pass | bool else 'FAIL' }}
          Collector pods (Running)            : {{ 'PASS' if collector_pass | bool else 'FAIL' }}
          Student namespace ({{ student_ns }})      : {{ 'PASS' if ns_pass | bool else 'FAIL' }}
          Log-test pod (clean/completed)      : {{ 'PASS' if test_pod_pass | bool else 'FAIL' }}
          ============================================================
