---
# Observability exercise – prepare
# Verifies prerequisites are in place BEFORE the student starts.
# Does NOT check for installed operators (student installs them).
- name: Prepare observability exercise
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    seat_padded: "{{ '%02d' | format(seat_number | int) }}"
    student_ns: "student-{{ seat_padded }}"
    lab_username: "lab-seat-{{ seat_padded }}"

  tasks:
    # ------------------------------------------------------------------
    # 1. Ensure student namespace exists
    # ------------------------------------------------------------------
    - name: Ensure student namespace exists
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ student_ns }}"
        state: present
      register: ns_result
      failed_when: false

    - name: Report namespace status
      ansible.builtin.debug:
        msg: >-
          Student namespace {{ student_ns }}:
          {{ 'EXISTS' if ns_result is not failed else 'FAILED TO CREATE' }}

    # ------------------------------------------------------------------
    # 2. Verify S3 credentials ConfigMap is present
    # ------------------------------------------------------------------
    - name: Check S3 credentials ConfigMap
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        name: masworld-lab-s3-credentials
        namespace: showroom
      register: s3_cm
      failed_when: false

    - name: Evaluate S3 credentials
      ansible.builtin.set_fact:
        s3_ready: "{{ s3_cm.resources | default([]) | length > 0 }}"

    - name: Report S3 credentials status
      ansible.builtin.debug:
        msg: >-
          S3 credentials ConfigMap: {{ 'READY' if s3_ready | bool else 'NOT FOUND – contact facilitator' }}

    # ------------------------------------------------------------------
    # 3. Verify operator catalog sources are available
    # ------------------------------------------------------------------
    - name: Check redhat-operators CatalogSource
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: CatalogSource
        name: redhat-operators
        namespace: openshift-marketplace
      register: catalog_result
      failed_when: false

    - name: Evaluate catalog availability
      ansible.builtin.set_fact:
        catalog_ready: "{{ catalog_result.resources | default([]) | length > 0 }}"

    - name: Report catalog status
      ansible.builtin.debug:
        msg: >-
          Operator catalog (redhat-operators): {{ 'AVAILABLE' if catalog_ready | bool else 'NOT FOUND – operator installs may fail' }}

    # ------------------------------------------------------------------
    # 4. Verify lab user has permissions for operator namespaces
    # ------------------------------------------------------------------
    - name: Check lab user ClusterRoleBinding
      kubernetes.core.k8s_info:
        api_version: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        name: "{{ lab_username }}-masworld-lab-operator"
      register: lab_crb
      failed_when: false

    - name: Evaluate lab user RBAC
      ansible.builtin.set_fact:
        rbac_ready: "{{ lab_crb.resources | default([]) | length > 0 }}"

    - name: Report RBAC status
      ansible.builtin.debug:
        msg: >-
          Lab user RBAC ({{ lab_username }}): {{ 'CONFIGURED' if rbac_ready | bool else 'NOT FOUND – contact facilitator' }}

    # ------------------------------------------------------------------
    # 5. Summary
    # ------------------------------------------------------------------
    - name: Readiness summary
      ansible.builtin.debug:
        msg: |
          ============================================================
          OPERATOR INSTALLATION – PREREQUISITES (seat {{ seat_padded }})
          ============================================================
          Student namespace     : {{ 'READY' if ns_result is not failed else 'FAILED' }}
          S3 credentials        : {{ 'READY' if s3_ready | bool else 'NOT FOUND' }}
          Operator catalog      : {{ 'AVAILABLE' if catalog_ready | bool else 'NOT FOUND' }}
          Lab user RBAC         : {{ 'CONFIGURED' if rbac_ready | bool else 'NOT FOUND' }}
          ============================================================
          Operators are NOT pre-installed. You will install them
          during this exercise.
