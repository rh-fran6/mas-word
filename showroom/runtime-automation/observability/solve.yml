---
# Observability exercise – solve
# Installs the full logging stack for the student (what Exercise 5 walks through).
- name: Solve observability exercise
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    seat_padded: "{{ '%02d' | format(seat_number | int) }}"
    student_ns: "student-{{ seat_padded }}"
    logging_ns: openshift-logging

  tasks:
    # ------------------------------------------------------------------
    # 1. Read S3 credentials from ConfigMap
    # ------------------------------------------------------------------
    - name: Read S3 credentials ConfigMap
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        name: masworld-lab-s3-credentials
        namespace: showroom
      register: s3_cm

    - name: Set S3 credential facts
      ansible.builtin.set_fact:
        s3_bucket: "{{ s3_cm.resources[0].data.bucket_name }}"
        s3_key: "{{ s3_cm.resources[0].data.aws_access_key_id }}"
        s3_secret: "{{ s3_cm.resources[0].data.aws_secret_access_key }}"
        s3_region: "{{ s3_cm.resources[0].data.aws_region }}"
      no_log: true

    # ------------------------------------------------------------------
    # 2. Create openshift-logging namespace + OperatorGroup
    # ------------------------------------------------------------------
    - name: Create openshift-logging namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ logging_ns }}"
            labels:
              openshift.io/cluster-monitoring: "true"

    - name: Create OperatorGroup
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: openshift-logging
            namespace: "{{ logging_ns }}"
          spec:
            targetNamespaces:
              - "{{ logging_ns }}"

    # ------------------------------------------------------------------
    # 3. Install Logging Operator
    # ------------------------------------------------------------------
    - name: Create Logging Operator Subscription
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: cluster-logging
            namespace: "{{ logging_ns }}"
          spec:
            channel: stable-6.6
            name: cluster-logging
            source: redhat-operators
            sourceNamespace: openshift-marketplace
            installPlanApproval: Automatic

    # ------------------------------------------------------------------
    # 4. Install Loki Operator
    # ------------------------------------------------------------------
    - name: Create Loki Operator Subscription
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: loki-operator
            namespace: "{{ logging_ns }}"
          spec:
            channel: stable-6.6
            name: loki-operator
            source: redhat-operators
            sourceNamespace: openshift-marketplace
            installPlanApproval: Automatic

    # ------------------------------------------------------------------
    # 5. Install Cluster Observability Operator
    # ------------------------------------------------------------------
    - name: Create COO Subscription
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: cluster-observability-operator
            namespace: openshift-operators
          spec:
            channel: stable
            name: cluster-observability-operator
            source: redhat-operators
            sourceNamespace: openshift-marketplace
            installPlanApproval: Automatic

    - name: Wait for operator CSVs to install
      ansible.builtin.pause:
        seconds: 90

    # ------------------------------------------------------------------
    # 6. Create S3 storage secret
    # ------------------------------------------------------------------
    - name: Create S3 storage secret for LokiStack
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: logging-loki-s3
            namespace: "{{ logging_ns }}"
          type: Opaque
          stringData:
            bucketnames: "{{ s3_bucket }}"
            region: "{{ s3_region }}"
            access_key_id: "{{ s3_key }}"
            access_key_secret: "{{ s3_secret }}"
            endpoint: "https://s3.{{ s3_region }}.amazonaws.com"
      no_log: true

    # ------------------------------------------------------------------
    # 7. Deploy LokiStack
    # ------------------------------------------------------------------
    - name: Create LokiStack CR
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: loki.grafana.com/v1
          kind: LokiStack
          metadata:
            name: logging-loki
            namespace: "{{ logging_ns }}"
          spec:
            size: 1x.demo
            storage:
              schemas:
                - version: v13
                  effectiveDate: "2024-10-01"
              secret:
                name: logging-loki-s3
                type: s3
            storageClassName: gp3-csi
            tenants:
              mode: openshift-logging
            limits:
              global:
                retention:
                  days: 3

    - name: Wait for LokiStack to become ready
      kubernetes.core.k8s_info:
        api_version: loki.grafana.com/v1
        kind: LokiStack
        name: logging-loki
        namespace: "{{ logging_ns }}"
      register: lokistack_status
      until: >-
        lokistack_status.resources | default([]) | length > 0 and
        (lokistack_status.resources[0].status.conditions | default([])
          | selectattr('type', 'equalto', 'Ready')
          | selectattr('status', 'equalto', 'True')
          | list | length > 0)
      retries: 30
      delay: 10

    # ------------------------------------------------------------------
    # 8. Create collector ServiceAccount and grant permissions
    # ------------------------------------------------------------------
    - name: Create collector ServiceAccount
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: collector
            namespace: "{{ logging_ns }}"

    - name: Grant collector ClusterRoleBindings
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: "collector-{{ item }}"
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: "{{ item }}"
          subjects:
            - kind: ServiceAccount
              name: collector
              namespace: "{{ logging_ns }}"
      loop:
        - collect-application-logs
        - collect-infrastructure-logs
        - collect-audit-logs

    # ------------------------------------------------------------------
    # 9. Deploy ClusterLogForwarder
    # ------------------------------------------------------------------
    - name: Create ClusterLogForwarder
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: observability.openshift.io/v1
          kind: ClusterLogForwarder
          metadata:
            name: collector
            namespace: "{{ logging_ns }}"
          spec:
            serviceAccount:
              name: collector
            outputs:
              - name: default-lokistack
                type: lokiStack
                lokiStack:
                  target:
                    name: logging-loki
                    namespace: "{{ logging_ns }}"
                  authentication:
                    token:
                      from: serviceAccount
            pipelines:
              - name: application-logs
                inputRefs: [application]
                outputRefs: [default-lokistack]
              - name: infrastructure-logs
                inputRefs: [infrastructure]
                outputRefs: [default-lokistack]
              - name: audit-logs
                inputRefs: [audit]
                outputRefs: [default-lokistack]

    # ------------------------------------------------------------------
    # 10. Create UIPlugin
    # ------------------------------------------------------------------
    - name: Create UIPlugin for console log viewing
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: observability.openshift.io/v1alpha1
          kind: UIPlugin
          metadata:
            name: logging
          spec:
            type: Logging
            logging:
              lokiStack:
                name: logging-loki
              logsLimit: 50

    # ------------------------------------------------------------------
    # 11. Summary
    # ------------------------------------------------------------------
    - name: Show completion summary
      ansible.builtin.debug:
        msg: |
          ============================================================
          OPERATOR INSTALLATION – SOLVE COMPLETE (seat {{ seat_padded }})
          ============================================================
          All operators installed, LokiStack deployed, CLF configured,
          UIPlugin created.

          LogQL queries for the Console (Observe > Logs):
            {kubernetes_namespace_name="mas-inst1-manage"}
            {log_type="infrastructure"}
            {log_type="audit"}
          ============================================================
