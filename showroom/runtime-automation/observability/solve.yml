---
# Observability exercise – solve
# Executes the full observability exercise for the student.
- name: Solve observability exercise
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    seat_padded: "{{ '%02d' | format(seat_number | int) }}"
    student_ns: "student-{{ seat_padded }}"
    pod_name: "log-test-{{ seat_padded }}"
    logging_ns: openshift-logging

  tasks:
    # ------------------------------------------------------------------
    # 1. Cleanup any existing test pod
    # ------------------------------------------------------------------
    - name: Delete existing log-test pod if present
      kubernetes.core.k8s:
        api_version: v1
        kind: Pod
        name: "{{ pod_name }}"
        namespace: "{{ student_ns }}"
        state: absent
      failed_when: false

    - name: Wait for old pod to be fully removed
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        name: "{{ pod_name }}"
        namespace: "{{ student_ns }}"
      register: old_pod
      until: old_pod.resources | default([]) | length == 0
      retries: 12
      delay: 5
      failed_when: false

    # ------------------------------------------------------------------
    # 2. Create the log-test pod
    # ------------------------------------------------------------------
    - name: Create log-test pod with structured JSON log entries
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: "{{ pod_name }}"
            namespace: "{{ student_ns }}"
            labels:
              app: log-test
              seat: "{{ seat_padded }}"
          spec:
            restartPolicy: Never
            containers:
              - name: log-generator
                image: registry.access.redhat.com/ubi9/ubi-minimal:9.4
                command:
                  - /bin/sh
                  - -c
                  - |
                    for i in $(seq 1 10); do
                      TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                      echo "{\"timestamp\":\"${TS}\",\"level\":\"info\",\"message\":\"MAS World log test\",\"seat\":\"{{ seat_padded }}\",\"iteration\":${i}}"
                      sleep 1
                    done
                    TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                    echo "{\"timestamp\":\"${TS}\",\"level\":\"info\",\"message\":\"Log generation complete\",\"seat\":\"{{ seat_padded }}\",\"total_entries\":10}"

    - name: Report pod creation
      ansible.builtin.debug:
        msg: "Log-test pod {{ pod_name }} created in namespace {{ student_ns }}. Generating 10 structured log entries..."

    # ------------------------------------------------------------------
    # 3. Wait for pod to complete
    # ------------------------------------------------------------------
    - name: Wait for log-test pod to complete
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        name: "{{ pod_name }}"
        namespace: "{{ student_ns }}"
      register: pod_status
      until: >-
        pod_status.resources | default([]) | length > 0 and
        pod_status.resources[0].status.phase | default('') in ['Succeeded', 'Failed']
      retries: 12
      delay: 5

    - name: Report pod completion
      ansible.builtin.debug:
        msg: >-
          Pod {{ pod_name }} finished with status:
          {{ pod_status.resources[0].status.phase | default('Unknown') }}

    # ------------------------------------------------------------------
    # 4. Display pod logs
    # ------------------------------------------------------------------
    - name: Retrieve pod logs
      ansible.builtin.command:
        cmd: oc logs {{ pod_name }} -n {{ student_ns }}
      register: pod_logs
      failed_when: false

    - name: Display pod logs
      ansible.builtin.debug:
        msg: "{{ pod_logs.stdout_lines | default(['(no logs available)']) }}"

    # ------------------------------------------------------------------
    # 5. Show LogQL queries for Grafana
    # ------------------------------------------------------------------
    - name: Show LogQL queries for Grafana
      ansible.builtin.debug:
        msg: |
          ============================================================
          LogQL QUERIES FOR GRAFANA
          ============================================================
          Use these queries in the Grafana Explore view to find your logs:

          1. Filter by namespace and message:
             {kubernetes_namespace_name="{{ student_ns }}"} |= "MAS World log test"

          2. Filter by namespace with JSON parsing and seat filter:
             {kubernetes_namespace_name="{{ student_ns }}"} | json | seat="{{ seat_padded }}"

          ============================================================

    # ------------------------------------------------------------------
    # 6. Delete the test pod (cleanup)
    # ------------------------------------------------------------------
    - name: Delete log-test pod after exercise
      kubernetes.core.k8s:
        api_version: v1
        kind: Pod
        name: "{{ pod_name }}"
        namespace: "{{ student_ns }}"
        state: absent
      failed_when: false

    # ------------------------------------------------------------------
    # 7. Final output
    # ------------------------------------------------------------------
    - name: Exercise complete
      ansible.builtin.debug:
        msg: |
          ============================================================
          Exercise complete. Check Grafana to verify historical logs
          persist after pod deletion.
          ============================================================
