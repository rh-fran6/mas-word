---
# Identity exercise – validate
# Checks all identity exercise requirements and reports PASS/FAIL.
- name: Validate identity exercise
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    seat_padded: "{{ '%02d' | format(seat_number | int) }}"
    student_ns: "student-{{ seat_padded }}"
    student_user: "user{{ seat_padded }}"
    keycloak_ns: masworld-keycloak

  tasks:
    # ------------------------------------------------------------------
    # 1. OAuth has masworld-keycloak identity provider (OpenID type)
    # ------------------------------------------------------------------
    - name: Check OAuth CR
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: OAuth
        name: cluster
      register: oauth_result
      failed_when: false

    - name: Evaluate OAuth – masworld-keycloak provider
      ansible.builtin.set_fact:
        oauth_keycloak_pass: >-
          {{ oauth_result.resources | default([])
             | map(attribute='spec.identityProviders', default=[]) | flatten
             | selectattr('name', 'equalto', 'masworld-keycloak')
             | selectattr('type', 'equalto', 'OpenID')
             | list | length > 0 }}

    # ------------------------------------------------------------------
    # 2. OAuth still has HTPasswd provider
    # ------------------------------------------------------------------
    - name: Evaluate OAuth – HTPasswd provider
      ansible.builtin.set_fact:
        oauth_htpasswd_pass: >-
          {{ oauth_result.resources | default([])
             | map(attribute='spec.identityProviders', default=[]) | flatten
             | selectattr('type', 'equalto', 'HTPasswd')
             | list | length > 0 }}

    # ------------------------------------------------------------------
    # 3. Keycloak CR is Ready
    # ------------------------------------------------------------------
    - name: Check Keycloak CR
      kubernetes.core.k8s_info:
        api_version: k8s.keycloak.org/v2alpha1
        kind: Keycloak
        namespace: "{{ keycloak_ns }}"
      register: keycloak_result
      failed_when: false

    - name: Evaluate Keycloak readiness
      ansible.builtin.set_fact:
        keycloak_pass: >-
          {{ keycloak_result.resources | default([])
             | selectattr('status.conditions', 'defined')
             | map(attribute='status.conditions') | flatten
             | selectattr('type', 'equalto', 'Ready')
             | selectattr('status', 'equalto', 'True')
             | list | length > 0 }}

    # ------------------------------------------------------------------
    # 4. OpenLDAP pod is Running
    # ------------------------------------------------------------------
    - name: Check OpenLDAP pod
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ keycloak_ns }}"
        label_selectors:
          - app=openldap
      register: ldap_pod_result
      failed_when: false

    - name: Evaluate OpenLDAP status
      ansible.builtin.set_fact:
        ldap_pass: >-
          {{ ldap_pod_result.resources | default([])
             | selectattr('status.phase', 'defined')
             | selectattr('status.phase', 'equalto', 'Running')
             | list | length > 0 }}

    # ------------------------------------------------------------------
    # 5. KeycloakRealmImport with LDAP federation
    # ------------------------------------------------------------------
    - name: Check KeycloakRealmImport
      kubernetes.core.k8s_info:
        api_version: k8s.keycloak.org/v2alpha1
        kind: KeycloakRealmImport
        name: masworld-realm
        namespace: "{{ keycloak_ns }}"
      register: realm_result
      failed_when: false

    - name: Evaluate KeycloakRealmImport – exists with LDAP federation
      ansible.builtin.set_fact:
        realm_pass: >-
          {{ realm_result.resources | default([]) | length > 0 and
             realm_result.resources[0].spec.realm.components
             | default({}) | dict2items
             | selectattr('key', 'search', 'ldap')
             | list | length > 0 }}
      failed_when: false
      ignore_errors: true

    - name: Fallback realm evaluation
      ansible.builtin.set_fact:
        realm_pass: "{{ realm_result.resources | default([]) | length > 0 }}"
      when: realm_pass is not defined

    # ------------------------------------------------------------------
    # 6. OIDC client secret exists
    # ------------------------------------------------------------------
    - name: Check OIDC client secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: keycloak-oidc-client-secret
        namespace: openshift-config
      register: oidc_secret_result
      failed_when: false

    - name: Evaluate OIDC secret
      ansible.builtin.set_fact:
        oidc_secret_pass: "{{ oidc_secret_result.resources | default([]) | length > 0 }}"

    # ------------------------------------------------------------------
    # 7. Student RoleBinding exists (admin on namespace)
    # ------------------------------------------------------------------
    - name: Check student RoleBinding
      kubernetes.core.k8s_info:
        api_version: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        namespace: "{{ student_ns }}"
      register: rb_result
      failed_when: false

    - name: Evaluate student RoleBinding
      ansible.builtin.set_fact:
        rb_pass: >-
          {{ rb_result.resources | default([])
             | selectattr('subjects', 'defined')
             | map(attribute='subjects') | flatten
             | selectattr('name', 'equalto', student_user)
             | list | length > 0 }}

    # ------------------------------------------------------------------
    # 8. Student does NOT have cluster-admin
    # ------------------------------------------------------------------
    - name: Check ClusterRoleBindings for cluster-admin
      kubernetes.core.k8s_info:
        api_version: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
      register: crb_result
      failed_when: false

    - name: Evaluate cluster-admin exclusion
      ansible.builtin.set_fact:
        no_cluster_admin_pass: >-
          {{ crb_result.resources | default([])
             | selectattr('roleRef.name', 'equalto', 'cluster-admin')
             | selectattr('subjects', 'defined')
             | map(attribute='subjects') | flatten
             | selectattr('name', 'equalto', student_user)
             | list | length == 0 }}

    # ------------------------------------------------------------------
    # 9. Summary table
    # ------------------------------------------------------------------
    - name: Validation summary
      ansible.builtin.debug:
        msg: |
          ============================================================
          IDENTITY EXERCISE – VALIDATION RESULTS (seat {{ seat_padded }})
          ============================================================
          OAuth: masworld-keycloak (OpenID)   : {{ 'PASS' if oauth_keycloak_pass | bool else 'FAIL' }}
          OAuth: HTPasswd still present       : {{ 'PASS' if oauth_htpasswd_pass | bool else 'FAIL' }}
          Keycloak CR (Ready)                 : {{ 'PASS' if keycloak_pass | bool else 'FAIL' }}
          OpenLDAP pod (Running)              : {{ 'PASS' if ldap_pass | bool else 'FAIL' }}
          KeycloakRealmImport (LDAP fed.)     : {{ 'PASS' if realm_pass | bool else 'FAIL' }}
          OIDC client secret                  : {{ 'PASS' if oidc_secret_pass | bool else 'FAIL' }}
          Student RoleBinding (ns admin)      : {{ 'PASS' if rb_pass | bool else 'FAIL' }}
          Student NOT cluster-admin           : {{ 'PASS' if no_cluster_admin_pass | bool else 'FAIL' }}
          ============================================================
