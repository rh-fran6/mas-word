---
# Identity exercise – reset
# Verifies identity components are in their expected state.
# Since identity is infrastructure-level, this playbook verifies rather
# than modifies, and reports which components need manual attention.
- name: Reset identity exercise
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    seat_padded: "{{ '%02d' | format(seat_number | int) }}"
    student_ns: "student-{{ seat_padded }}"
    student_user: "user{{ seat_padded }}"
    keycloak_ns: masworld-keycloak
    issues: []

  tasks:
    # ------------------------------------------------------------------
    # 1. Verify Keycloak CR exists and is Ready
    # ------------------------------------------------------------------
    - name: Check Keycloak CR
      kubernetes.core.k8s_info:
        api_version: k8s.keycloak.org/v2alpha1
        kind: Keycloak
        namespace: "{{ keycloak_ns }}"
      register: keycloak_result
      failed_when: false

    - name: Evaluate Keycloak
      ansible.builtin.set_fact:
        keycloak_ready: >-
          {{ keycloak_result.resources | default([])
             | selectattr('status.conditions', 'defined')
             | map(attribute='status.conditions') | flatten
             | selectattr('type', 'equalto', 'Ready')
             | selectattr('status', 'equalto', 'True')
             | list | length > 0 }}

    - name: Report Keycloak
      ansible.builtin.debug:
        msg: >-
          Keycloak CR: {{ 'READY' if keycloak_ready | bool else 'NOT READY – needs manual attention' }}

    - name: Track Keycloak issue
      ansible.builtin.set_fact:
        issues: "{{ issues + ['Keycloak CR is not Ready in ' + keycloak_ns] }}"
      when: not keycloak_ready | bool

    # ------------------------------------------------------------------
    # 2. Verify OpenLDAP pod is Running
    # ------------------------------------------------------------------
    - name: Check OpenLDAP pod
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ keycloak_ns }}"
        label_selectors:
          - app=openldap
      register: ldap_pod_result
      failed_when: false

    - name: Evaluate OpenLDAP
      ansible.builtin.set_fact:
        ldap_running: >-
          {{ ldap_pod_result.resources | default([])
             | selectattr('status.phase', 'defined')
             | selectattr('status.phase', 'equalto', 'Running')
             | list | length > 0 }}

    - name: Report OpenLDAP
      ansible.builtin.debug:
        msg: >-
          OpenLDAP pod: {{ 'RUNNING' if ldap_running | bool else 'NOT RUNNING – needs manual attention' }}

    - name: Track OpenLDAP issue
      ansible.builtin.set_fact:
        issues: "{{ issues + ['OpenLDAP pod is not Running in ' + keycloak_ns] }}"
      when: not ldap_running | bool

    # ------------------------------------------------------------------
    # 3. Verify OAuth CR has masworld-keycloak provider
    # ------------------------------------------------------------------
    - name: Check OAuth CR
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: OAuth
        name: cluster
      register: oauth_result
      failed_when: false

    - name: Evaluate OAuth provider
      ansible.builtin.set_fact:
        oauth_has_keycloak: >-
          {{ oauth_result.resources | default([])
             | map(attribute='spec.identityProviders', default=[]) | flatten
             | selectattr('name', 'equalto', 'masworld-keycloak')
             | list | length > 0 }}

    - name: Report OAuth
      ansible.builtin.debug:
        msg: >-
          OAuth masworld-keycloak provider:
          {{ 'CONFIGURED' if oauth_has_keycloak | bool else 'NOT FOUND – needs manual attention' }}

    - name: Track OAuth issue
      ansible.builtin.set_fact:
        issues: "{{ issues + ['OAuth CR missing masworld-keycloak identity provider'] }}"
      when: not oauth_has_keycloak | bool

    # ------------------------------------------------------------------
    # 4. Verify OIDC client secret exists
    # ------------------------------------------------------------------
    - name: Check OIDC client secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: keycloak-oidc-client-secret
        namespace: openshift-config
      register: oidc_secret_result
      failed_when: false

    - name: Evaluate OIDC secret
      ansible.builtin.set_fact:
        oidc_secret_exists: "{{ oidc_secret_result.resources | default([]) | length > 0 }}"

    - name: Report OIDC secret
      ansible.builtin.debug:
        msg: >-
          OIDC client secret:
          {{ 'EXISTS' if oidc_secret_exists | bool else 'NOT FOUND – needs manual attention' }}

    - name: Track OIDC secret issue
      ansible.builtin.set_fact:
        issues: "{{ issues + ['OIDC client secret keycloak-oidc-client-secret missing from openshift-config'] }}"
      when: not oidc_secret_exists | bool

    # ------------------------------------------------------------------
    # 5. Verify KeycloakRealmImport exists with LDAP federation
    # ------------------------------------------------------------------
    - name: Check KeycloakRealmImport
      kubernetes.core.k8s_info:
        api_version: k8s.keycloak.org/v2alpha1
        kind: KeycloakRealmImport
        name: masworld-realm
        namespace: "{{ keycloak_ns }}"
      register: realm_result
      failed_when: false

    - name: Evaluate realm import
      ansible.builtin.set_fact:
        realm_exists: "{{ realm_result.resources | default([]) | length > 0 }}"

    - name: Report realm import
      ansible.builtin.debug:
        msg: >-
          KeycloakRealmImport masworld-realm:
          {{ 'EXISTS' if realm_exists | bool else 'NOT FOUND – needs manual attention' }}

    - name: Track realm import issue
      ansible.builtin.set_fact:
        issues: "{{ issues + ['KeycloakRealmImport masworld-realm missing from ' + keycloak_ns] }}"
      when: not realm_exists | bool

    # ------------------------------------------------------------------
    # 6. Final output
    # ------------------------------------------------------------------
    - name: Reset complete – all OK
      ansible.builtin.debug:
        msg: |
          ============================================================
          Identity exercise reset complete. All components verified.
          ============================================================
      when: issues | length == 0

    - name: Reset complete – issues found
      ansible.builtin.debug:
        msg: |
          ============================================================
          Identity exercise reset complete with issues.
          The following components need manual attention:
          {% for issue in issues %}
            - {{ issue }}
          {% endfor %}
          ============================================================
      when: issues | length > 0
