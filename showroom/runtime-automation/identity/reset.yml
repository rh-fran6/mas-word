---
# Identity exercise – reset
# Cleans up student-created resources (groups) and verifies infrastructure.
# NEVER touches Keycloak, OpenLDAP, OAuth, or MAS.
- name: Reset identity exercise
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    seat_padded: "{{ '%02d' | format(seat_number | int) }}"
    student_ns: "student-{{ seat_padded }}"
    lab_username: "lab-seat-{{ seat_padded }}"
    keycloak_ns: masworld-keycloak
    issues: []

  tasks:
    # ------------------------------------------------------------------
    # 1. Delete OpenShift Groups created by group sync
    # ------------------------------------------------------------------
    - name: Delete mas-admins group
      kubernetes.core.k8s:
        api_version: user.openshift.io/v1
        kind: Group
        name: mas-admins
        state: absent
      register: del_admins
      failed_when: false

    - name: Delete mas-users group
      kubernetes.core.k8s:
        api_version: user.openshift.io/v1
        kind: Group
        name: mas-users
        state: absent
      register: del_users
      failed_when: false

    - name: Report group cleanup
      ansible.builtin.debug:
        msg: |
          Groups cleaned up:
            mas-admins: {{ 'deleted' if del_admins.changed | default(false) else 'not found (already clean)' }}
            mas-users: {{ 'deleted' if del_users.changed | default(false) else 'not found (already clean)' }}

    # ------------------------------------------------------------------
    # 2. Delete GroupSync CR
    # ------------------------------------------------------------------
    - name: Delete GroupSync CR
      kubernetes.core.k8s:
        api_version: redhatcop.redhat.io/v1alpha1
        kind: GroupSync
        name: ldap-groupsync
        namespace: group-sync-operator
        state: absent
      register: del_groupsync
      failed_when: false

    - name: Delete LDAP bind password secret
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        name: ldap-bind-password
        namespace: group-sync-operator
        state: absent
      failed_when: false

    # ------------------------------------------------------------------
    # 2b. Delete Group Sync Operator
    # ------------------------------------------------------------------
    - name: Delete Group Sync Operator Subscription
      kubernetes.core.k8s:
        api_version: operators.coreos.com/v1alpha1
        kind: Subscription
        name: group-sync-operator
        namespace: group-sync-operator
        state: absent
      failed_when: false

    - name: Find Group Sync Operator CSVs
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: group-sync-operator
      register: gso_csvs
      failed_when: false

    - name: Delete Group Sync Operator CSVs
      kubernetes.core.k8s:
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        name: "{{ item.metadata.name }}"
        namespace: group-sync-operator
        state: absent
      loop: "{{ gso_csvs.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      failed_when: false

    - name: Delete Group Sync Operator OperatorGroup
      kubernetes.core.k8s:
        api_version: operators.coreos.com/v1
        kind: OperatorGroup
        name: group-sync-operator
        namespace: group-sync-operator
        state: absent
      failed_when: false

    # ------------------------------------------------------------------
    # 3. Verify Keycloak CR exists and is Ready (infrastructure check)
    # ------------------------------------------------------------------
    - name: Check Keycloak CR
      kubernetes.core.k8s_info:
        api_version: k8s.keycloak.org/v2alpha1
        kind: Keycloak
        namespace: "{{ keycloak_ns }}"
      register: keycloak_result
      failed_when: false

    - name: Evaluate Keycloak
      ansible.builtin.set_fact:
        keycloak_ready: >-
          {{ keycloak_result.resources | default([])
             | selectattr('status.conditions', 'defined')
             | map(attribute='status.conditions') | flatten
             | selectattr('type', 'equalto', 'Ready')
             | selectattr('status', 'equalto', 'True')
             | list | length > 0 }}

    - name: Report Keycloak
      ansible.builtin.debug:
        msg: >-
          Keycloak CR: {{ 'READY' if keycloak_ready | bool else 'NOT READY – needs manual attention' }}

    - name: Track Keycloak issue
      ansible.builtin.set_fact:
        issues: "{{ issues + ['Keycloak CR is not Ready in ' + keycloak_ns] }}"
      when: not keycloak_ready | bool

    # ------------------------------------------------------------------
    # 4. Verify OpenLDAP pod is Running
    # ------------------------------------------------------------------
    - name: Check OpenLDAP pod
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ keycloak_ns }}"
        label_selectors:
          - app=openldap
      register: ldap_pod_result
      failed_when: false

    - name: Evaluate OpenLDAP
      ansible.builtin.set_fact:
        ldap_running: >-
          {{ ldap_pod_result.resources | default([])
             | selectattr('status.phase', 'defined')
             | selectattr('status.phase', 'equalto', 'Running')
             | list | length > 0 }}

    - name: Report OpenLDAP
      ansible.builtin.debug:
        msg: >-
          OpenLDAP pod: {{ 'RUNNING' if ldap_running | bool else 'NOT RUNNING – needs manual attention' }}

    - name: Track OpenLDAP issue
      ansible.builtin.set_fact:
        issues: "{{ issues + ['OpenLDAP pod is not Running in ' + keycloak_ns] }}"
      when: not ldap_running | bool

    # ------------------------------------------------------------------
    # 5. Verify OAuth CR has masworld-keycloak provider
    # ------------------------------------------------------------------
    - name: Check OAuth CR
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: OAuth
        name: cluster
      register: oauth_result
      failed_when: false

    - name: Evaluate OAuth provider
      ansible.builtin.set_fact:
        oauth_has_keycloak: >-
          {{ oauth_result.resources | default([])
             | map(attribute='spec.identityProviders', default=[]) | flatten
             | selectattr('name', 'equalto', 'masworld-keycloak')
             | list | length > 0 }}

    - name: Report OAuth
      ansible.builtin.debug:
        msg: >-
          OAuth masworld-keycloak provider:
          {{ 'CONFIGURED' if oauth_has_keycloak | bool else 'NOT FOUND – needs manual attention' }}

    - name: Track OAuth issue
      ansible.builtin.set_fact:
        issues: "{{ issues + ['OAuth CR missing masworld-keycloak identity provider'] }}"
      when: not oauth_has_keycloak | bool

    # ------------------------------------------------------------------
    # 6. Verify OIDC client secret exists
    # ------------------------------------------------------------------
    - name: Check OIDC client secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: keycloak-oidc-client-secret
        namespace: openshift-config
      register: oidc_secret_result
      failed_when: false

    - name: Evaluate OIDC secret
      ansible.builtin.set_fact:
        oidc_secret_exists: "{{ oidc_secret_result.resources | default([]) | length > 0 }}"

    - name: Report OIDC secret
      ansible.builtin.debug:
        msg: >-
          OIDC client secret:
          {{ 'EXISTS' if oidc_secret_exists | bool else 'NOT FOUND – needs manual attention' }}

    - name: Track OIDC secret issue
      ansible.builtin.set_fact:
        issues: "{{ issues + ['OIDC client secret keycloak-oidc-client-secret missing from openshift-config'] }}"
      when: not oidc_secret_exists | bool

    # ------------------------------------------------------------------
    # 7. Final output
    # ------------------------------------------------------------------
    - name: Reset complete – all OK
      ansible.builtin.debug:
        msg: |
          ============================================================
          IDENTITY PROVIDER INTEGRATION – RESET COMPLETE
          ============================================================
          Removed:
            - OpenShift groups (mas-admins, mas-users)
            - GroupSync CR (ldap-groupsync)
            - LDAP bind password secret
            - Group Sync Operator (Subscription, CSVs, OperatorGroup)

          NOT touched:
            - Keycloak / OpenLDAP
            - OAuth configuration
            - OIDC client secret
            - MAS namespaces
          ============================================================
          All infrastructure components verified OK.
          The student can re-run the Identity Provider Integration
          exercise from the beginning.
      when: issues | length == 0

    - name: Reset complete – issues found
      ansible.builtin.debug:
        msg: |
          ============================================================
          IDENTITY PROVIDER INTEGRATION – RESET COMPLETE (with issues)
          ============================================================
          Removed:
            - OpenShift groups (mas-admins, mas-users)
            - GroupSync CR (ldap-groupsync)
            - LDAP bind password secret
            - Group Sync Operator (Subscription, CSVs, OperatorGroup)

          Issues needing manual attention:
          {% for issue in issues %}
            - {{ issue }}
          {% endfor %}
          ============================================================
      when: issues | length > 0
