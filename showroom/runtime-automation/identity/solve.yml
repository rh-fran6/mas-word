---
# Identity exercise – solve
# Executes all identity verification commands and displays results.
- name: Solve identity exercise
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    seat_padded: "{{ '%02d' | format(seat_number | int) }}"
    student_ns: "student-{{ seat_padded }}"
    student_user: "user{{ seat_padded }}"
    keycloak_ns: masworld-keycloak

  tasks:
    # ------------------------------------------------------------------
    # 1. Show OAuth identity providers (names and types)
    # ------------------------------------------------------------------
    - name: Get OAuth CR
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: OAuth
        name: cluster
      register: oauth_result
      failed_when: false

    - name: Show OAuth identity providers
      ansible.builtin.debug:
        msg: |
          === OAuth Identity Providers ===
          {% for idp in oauth_result.resources[0].spec.identityProviders | default([]) %}
          - Name: {{ idp.name }}, Type: {{ idp.type }}
          {% endfor %}
      when: oauth_result.resources | default([]) | length > 0

    # ------------------------------------------------------------------
    # 2. Show Keycloak CR status
    # ------------------------------------------------------------------
    - name: Get Keycloak CR
      kubernetes.core.k8s_info:
        api_version: k8s.keycloak.org/v2alpha1
        kind: Keycloak
        namespace: "{{ keycloak_ns }}"
      register: keycloak_result
      failed_when: false

    - name: Show Keycloak CR status
      ansible.builtin.debug:
        msg: |
          === Keycloak CR Status ===
          {% for kc in keycloak_result.resources | default([]) %}
          Name: {{ kc.metadata.name }}
          Conditions:
          {% for cond in kc.status.conditions | default([]) %}
            - {{ cond.type }}: {{ cond.status }} ({{ cond.message | default('') }})
          {% endfor %}
          {% endfor %}

    # ------------------------------------------------------------------
    # 3. Show Keycloak route URL
    # ------------------------------------------------------------------
    - name: Get Keycloak route
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        namespace: "{{ keycloak_ns }}"
      register: kc_route_result
      failed_when: false

    - name: Show Keycloak route URL
      ansible.builtin.debug:
        msg: |
          === Keycloak Route ===
          {% for route in kc_route_result.resources | default([]) %}
          - {{ route.metadata.name }}: https://{{ route.spec.host }}
          {% endfor %}

    # ------------------------------------------------------------------
    # 4. Show KeycloakRealmImport realm name
    # ------------------------------------------------------------------
    - name: Get KeycloakRealmImport
      kubernetes.core.k8s_info:
        api_version: k8s.keycloak.org/v2alpha1
        kind: KeycloakRealmImport
        name: masworld-realm
        namespace: "{{ keycloak_ns }}"
      register: realm_result
      failed_when: false

    - name: Show KeycloakRealmImport realm name
      ansible.builtin.debug:
        msg: |
          === KeycloakRealmImport ===
          Resource name: {{ realm_result.resources[0].metadata.name | default('not found') }}
          Realm: {{ realm_result.resources[0].spec.realm.realm | default('not found') }}
      when: realm_result.resources | default([]) | length > 0

    # ------------------------------------------------------------------
    # 5. Show LDAP federation provider name
    # ------------------------------------------------------------------
    - name: Show LDAP federation provider
      ansible.builtin.debug:
        msg: |
          === LDAP Federation ===
          {% set components = realm_result.resources[0].spec.realm.components | default({}) %}
          {% for key, value in components.items() %}
          {% if 'ldap' in key | lower %}
          Component key: {{ key }}
          {% for provider in value %}
          Provider name: {{ provider.name | default('unnamed') }}
          {% endfor %}
          {% endif %}
          {% endfor %}
      when: realm_result.resources | default([]) | length > 0
      failed_when: false

    # ------------------------------------------------------------------
    # 6. Show OpenLDAP pod status
    # ------------------------------------------------------------------
    - name: Get OpenLDAP pod
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ keycloak_ns }}"
        label_selectors:
          - app=openldap
      register: ldap_pod_result
      failed_when: false

    - name: Show OpenLDAP pod status
      ansible.builtin.debug:
        msg: |
          === OpenLDAP Pod Status ===
          {% for pod in ldap_pod_result.resources | default([]) %}
          - {{ pod.metadata.name }}: {{ pod.status.phase | default('Unknown') }}
          {% endfor %}
          {% if ldap_pod_result.resources | default([]) | length == 0 %}
          No OpenLDAP pods found in {{ keycloak_ns }}
          {% endif %}

    # ------------------------------------------------------------------
    # 7. Show OIDC provider configuration (issuer URL)
    # ------------------------------------------------------------------
    - name: Show OIDC provider issuer URL
      ansible.builtin.debug:
        msg: |
          === OIDC Provider Configuration ===
          {% set idps = oauth_result.resources[0].spec.identityProviders | default([]) %}
          {% for idp in idps %}
          {% if idp.type == 'OpenID' %}
          Name: {{ idp.name }}
          Issuer: {{ idp.openID.issuer | default('not configured') }}
          Client ID: {{ idp.openID.clientID | default('not configured') }}
          Claims mapping:
            preferredUsername: {{ idp.openID.claims.preferredUsername | default([]) | join(', ') }}
            name: {{ idp.openID.claims.name | default([]) | join(', ') }}
            email: {{ idp.openID.claims.email | default([]) | join(', ') }}
          {% endif %}
          {% endfor %}
      when: oauth_result.resources | default([]) | length > 0

    # ------------------------------------------------------------------
    # 8. Show OIDC client secret existence (NOT the value)
    # ------------------------------------------------------------------
    - name: Check OIDC client secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: keycloak-oidc-client-secret
        namespace: openshift-config
      register: oidc_secret_result
      failed_when: false

    - name: Show OIDC client secret existence
      ansible.builtin.debug:
        msg: |
          === OIDC Client Secret ===
          Secret keycloak-oidc-client-secret in openshift-config:
          {{ 'EXISTS' if oidc_secret_result.resources | default([]) | length > 0 else 'NOT FOUND' }}
          {% if oidc_secret_result.resources | default([]) | length > 0 %}
          Keys present: {{ oidc_secret_result.resources[0].data.keys() | list | join(', ') }}
          (Values are not displayed for security)
          {% endif %}

    # ------------------------------------------------------------------
    # 9. Show current users and identities (first 10)
    # ------------------------------------------------------------------
    - name: Get users
      ansible.builtin.command:
        cmd: oc get users --no-headers -o custom-columns=NAME:.metadata.name,IDENTITIES:.identities
      register: users_result
      failed_when: false

    - name: Show first 10 users and identities
      ansible.builtin.debug:
        msg: |
          === Users and Identities (first 10) ===
          {{ users_result.stdout_lines[:10] | default(['No users found']) | join('\n') }}
          {% if users_result.stdout_lines | default([]) | length > 10 %}
          ... and {{ users_result.stdout_lines | length - 10 }} more
          {% endif %}

    # ------------------------------------------------------------------
    # 10. Show student RBAC checks
    # ------------------------------------------------------------------
    - name: Check if student can create pods in namespace
      ansible.builtin.command:
        cmd: >-
          oc auth can-i create pods
          --namespace {{ student_ns }}
          --as {{ student_user }}
      register: can_create_pods
      failed_when: false

    - name: Check if student can create clusterroles
      ansible.builtin.command:
        cmd: >-
          oc auth can-i create clusterroles
          --as {{ student_user }}
      register: can_create_clusterroles
      failed_when: false

    - name: Show student RBAC results
      ansible.builtin.debug:
        msg: |
          === Student RBAC ({{ student_user }}) ===
          Can create pods in {{ student_ns }}    : {{ can_create_pods.stdout | default('unknown') }}
          Can create clusterroles (cluster-wide) : {{ can_create_clusterroles.stdout | default('unknown') }}

          Expected: pods=yes, clusterroles=no

    # ------------------------------------------------------------------
    # Summary
    # ------------------------------------------------------------------
    - name: Exercise summary
      ansible.builtin.debug:
        msg: |
          ============================================================
          IDENTITY EXERCISE – SOLVE COMPLETE (seat {{ seat_padded }})
          ============================================================
          All identity verification commands have been executed.
          Review the output above to understand the identity
          infrastructure configuration.
          ============================================================
