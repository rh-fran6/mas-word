---
# Identity exercise – solve
# Executes all identity verification commands and performs group sync.
- name: Solve identity exercise
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    seat_padded: "{{ '%02d' | format(seat_number | int) }}"
    student_ns: "student-{{ seat_padded }}"
    lab_username: "lab-seat-{{ seat_padded }}"
    keycloak_ns: masworld-keycloak

  tasks:
    # ------------------------------------------------------------------
    # 1. Show OAuth identity providers
    # ------------------------------------------------------------------
    - name: Get OAuth CR
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: OAuth
        name: cluster
      register: oauth_result
      failed_when: false

    - name: Show OAuth identity providers
      ansible.builtin.debug:
        msg: |
          === OAuth Identity Providers ===
          {% for idp in oauth_result.resources[0].spec.identityProviders | default([]) %}
          - Name: {{ idp.name }}, Type: {{ idp.type }}
          {% endfor %}
      when: oauth_result.resources | default([]) | length > 0

    # ------------------------------------------------------------------
    # 2. Show Keycloak CR status
    # ------------------------------------------------------------------
    - name: Get Keycloak CR
      kubernetes.core.k8s_info:
        api_version: k8s.keycloak.org/v2alpha1
        kind: Keycloak
        namespace: "{{ keycloak_ns }}"
      register: keycloak_result
      failed_when: false

    - name: Show Keycloak CR status
      ansible.builtin.debug:
        msg: |
          === Keycloak CR Status ===
          {% for kc in keycloak_result.resources | default([]) %}
          Name: {{ kc.metadata.name }}
          Conditions:
          {% for cond in kc.status.conditions | default([]) %}
            - {{ cond.type }}: {{ cond.status }} ({{ cond.message | default('') }})
          {% endfor %}
          {% endfor %}

    # ------------------------------------------------------------------
    # 3. Show Keycloak route URL
    # ------------------------------------------------------------------
    - name: Get Keycloak route
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        namespace: "{{ keycloak_ns }}"
      register: kc_route_result
      failed_when: false

    - name: Show Keycloak route URL
      ansible.builtin.debug:
        msg: |
          === Keycloak Route ===
          {% for route in kc_route_result.resources | default([]) %}
          - {{ route.metadata.name }}: https://{{ route.spec.host }}
          {% endfor %}

    # ------------------------------------------------------------------
    # 4. Show KeycloakRealmImport realm name
    # ------------------------------------------------------------------
    - name: Get KeycloakRealmImport
      kubernetes.core.k8s_info:
        api_version: k8s.keycloak.org/v2alpha1
        kind: KeycloakRealmImport
        name: masworld-realm
        namespace: "{{ keycloak_ns }}"
      register: realm_result
      failed_when: false

    - name: Show KeycloakRealmImport realm name
      ansible.builtin.debug:
        msg: |
          === KeycloakRealmImport ===
          Resource name: {{ realm_result.resources[0].metadata.name | default('not found') }}
          Realm: {{ realm_result.resources[0].spec.realm.realm | default('not found') }}
      when: realm_result.resources | default([]) | length > 0

    # ------------------------------------------------------------------
    # 5. Show LDAP federation provider name
    # ------------------------------------------------------------------
    - name: Show LDAP federation provider
      ansible.builtin.debug:
        msg: |
          === LDAP Federation ===
          {% set components = realm_result.resources[0].spec.realm.components | default({}) %}
          {% for key, value in components.items() %}
          {% if 'ldap' in key | lower %}
          Component key: {{ key }}
          {% for provider in value %}
          Provider name: {{ provider.name | default('unnamed') }}
          {% endfor %}
          {% endif %}
          {% endfor %}
      when: realm_result.resources | default([]) | length > 0
      failed_when: false

    # ------------------------------------------------------------------
    # 6. Show OpenLDAP pod status
    # ------------------------------------------------------------------
    - name: Get OpenLDAP pod
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ keycloak_ns }}"
        label_selectors:
          - app=openldap
      register: ldap_pod_result
      failed_when: false

    - name: Show OpenLDAP pod status
      ansible.builtin.debug:
        msg: |
          === OpenLDAP Pod Status ===
          {% for pod in ldap_pod_result.resources | default([]) %}
          - {{ pod.metadata.name }}: {{ pod.status.phase | default('Unknown') }}
          {% endfor %}
          {% if ldap_pod_result.resources | default([]) | length == 0 %}
          No OpenLDAP pods found in {{ keycloak_ns }}
          {% endif %}

    # ------------------------------------------------------------------
    # 7. Perform OpenShift group sync from LDAP
    # ------------------------------------------------------------------
    - name: Get LDAP bind password
      ansible.builtin.command:
        cmd: oc get secret openldap-admin-secret -n {{ keycloak_ns }} -o jsonpath='{.data.password}'
      register: ldap_bind_pass_b64
      failed_when: false

    - name: Write LDAP bind password to temp file
      ansible.builtin.copy:
        content: "{{ ldap_bind_pass_b64.stdout | b64decode }}"
        dest: /tmp/ldap-bind-password
        mode: "0600"
      no_log: true
      when: ldap_bind_pass_b64.stdout | default('') | length > 0

    - name: Write LDAP group sync config
      ansible.builtin.copy:
        content: |
          kind: LDAPSyncConfig
          apiVersion: v1
          url: ldap://openldap.{{ keycloak_ns }}.svc:3389
          insecure: true
          bindDN: "cn=Directory Manager"
          bindPassword:  # pragma: allowlist secret
            file: /tmp/ldap-bind-password
          groupUIDNameMapping:
            "cn=mas-admins,ou=groups,dc=masworld,dc=example,dc=com": mas-admins
            "cn=mas-users,ou=groups,dc=masworld,dc=example,dc=com": mas-users
          rfc2307:
            groupsQuery:
              baseDN: "ou=groups,dc=masworld,dc=example,dc=com"
              scope: sub
              derefAliases: never
              filter: (objectClass=groupOfNames)
            groupUIDAttribute: dn
            groupNameAttributes:
              - cn
            groupMembershipAttributes:
              - member
            usersQuery:
              baseDN: "ou=users,dc=masworld,dc=example,dc=com"
              scope: sub
              derefAliases: never
            userUIDAttribute: dn
            userNameAttributes:
              - uid
        dest: /tmp/ldap-group-sync.yaml
        mode: "0644"

    - name: Run oc adm groups sync
      ansible.builtin.command:
        cmd: oc adm groups sync --sync-config=/tmp/ldap-group-sync.yaml --confirm
      register: group_sync_result
      failed_when: false

    - name: Show group sync result
      ansible.builtin.debug:
        msg: |
          === OpenShift Group Sync ===
          {{ group_sync_result.stdout | default('No output') }}
          {{ group_sync_result.stderr | default('') }}

    - name: Clean up temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/ldap-group-sync.yaml
        - /tmp/ldap-bind-password

    # ------------------------------------------------------------------
    # 8. Show groups
    # ------------------------------------------------------------------
    - name: Get OpenShift groups
      ansible.builtin.command:
        cmd: oc get groups --no-headers
      register: groups_result
      failed_when: false

    - name: Show groups
      ansible.builtin.debug:
        msg: |
          === OpenShift Groups ===
          {{ groups_result.stdout | default('No groups found') }}

    # ------------------------------------------------------------------
    # 9. Show RBAC checks for lab user
    # ------------------------------------------------------------------
    - name: Check if lab user can create pods in namespace
      ansible.builtin.command:
        cmd: >-
          oc auth can-i create pods
          --namespace {{ student_ns }}
          --as {{ lab_username }}
      register: can_create_pods
      failed_when: false

    - name: Check if lab user can create clusterroles
      ansible.builtin.command:
        cmd: >-
          oc auth can-i create clusterroles
          --as {{ lab_username }}
      register: can_create_clusterroles
      failed_when: false

    - name: Show RBAC results
      ansible.builtin.debug:
        msg: |
          === Lab User RBAC ({{ lab_username }}) ===
          Can create pods in {{ student_ns }}    : {{ can_create_pods.stdout | default('unknown') }}
          Can create clusterroles (cluster-wide) : {{ can_create_clusterroles.stdout | default('unknown') }}

          Expected: pods=yes, clusterroles=no

    # ------------------------------------------------------------------
    # Summary
    # ------------------------------------------------------------------
    - name: Exercise summary
      ansible.builtin.debug:
        msg: |
          ============================================================
          IDENTITY EXERCISE – SOLVE COMPLETE (seat {{ seat_padded }})
          ============================================================
          All identity verification commands have been executed.
          OpenShift group sync has been performed.
          Review the output above to understand the identity
          infrastructure configuration.
          ============================================================
