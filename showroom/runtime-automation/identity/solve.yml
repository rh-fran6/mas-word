---
# Identity exercise – solve
# Executes all identity verification commands and performs group sync.
- name: Solve identity exercise
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    seat_padded: "{{ '%02d' | format(seat_number | int) }}"
    student_ns: "student-{{ seat_padded }}"
    lab_username: "lab-seat-{{ seat_padded }}"
    keycloak_ns: masworld-keycloak

  tasks:
    # ------------------------------------------------------------------
    # 1. Show OAuth identity providers
    # ------------------------------------------------------------------
    - name: Get OAuth CR
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: OAuth
        name: cluster
      register: oauth_result
      failed_when: false

    - name: Show OAuth identity providers
      ansible.builtin.debug:
        msg: |
          === OAuth Identity Providers ===
          {% for idp in oauth_result.resources[0].spec.identityProviders | default([]) %}
          - Name: {{ idp.name }}, Type: {{ idp.type }}
          {% endfor %}
      when: oauth_result.resources | default([]) | length > 0

    # ------------------------------------------------------------------
    # 2. Show Keycloak CR status
    # ------------------------------------------------------------------
    - name: Get Keycloak CR
      kubernetes.core.k8s_info:
        api_version: k8s.keycloak.org/v2alpha1
        kind: Keycloak
        namespace: "{{ keycloak_ns }}"
      register: keycloak_result
      failed_when: false

    - name: Show Keycloak CR status
      ansible.builtin.debug:
        msg: |
          === Keycloak CR Status ===
          {% for kc in keycloak_result.resources | default([]) %}
          Name: {{ kc.metadata.name }}
          Conditions:
          {% for cond in kc.status.conditions | default([]) %}
            - {{ cond.type }}: {{ cond.status }} ({{ cond.message | default('') }})
          {% endfor %}
          {% endfor %}

    # ------------------------------------------------------------------
    # 3. Show Keycloak route URL
    # ------------------------------------------------------------------
    - name: Get Keycloak route
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        namespace: "{{ keycloak_ns }}"
      register: kc_route_result
      failed_when: false

    - name: Show Keycloak route URL
      ansible.builtin.debug:
        msg: |
          === Keycloak Route ===
          {% for route in kc_route_result.resources | default([]) %}
          - {{ route.metadata.name }}: https://{{ route.spec.host }}
          {% endfor %}

    # ------------------------------------------------------------------
    # 4. Show KeycloakRealmImport realm name
    # ------------------------------------------------------------------
    - name: Get KeycloakRealmImport
      kubernetes.core.k8s_info:
        api_version: k8s.keycloak.org/v2alpha1
        kind: KeycloakRealmImport
        name: masworld-realm
        namespace: "{{ keycloak_ns }}"
      register: realm_result
      failed_when: false

    - name: Show KeycloakRealmImport realm name
      ansible.builtin.debug:
        msg: |
          === KeycloakRealmImport ===
          Resource name: {{ realm_result.resources[0].metadata.name | default('not found') }}
          Realm: {{ realm_result.resources[0].spec.realm.realm | default('not found') }}
      when: realm_result.resources | default([]) | length > 0

    # ------------------------------------------------------------------
    # 5. Show LDAP federation provider name
    # ------------------------------------------------------------------
    - name: Show LDAP federation provider
      ansible.builtin.debug:
        msg: |
          === LDAP Federation ===
          {% set components = realm_result.resources[0].spec.realm.components | default({}) %}
          {% for key, value in components.items() %}
          {% if 'ldap' in key | lower %}
          Component key: {{ key }}
          {% for provider in value %}
          Provider name: {{ provider.name | default('unnamed') }}
          {% endfor %}
          {% endif %}
          {% endfor %}
      when: realm_result.resources | default([]) | length > 0
      failed_when: false

    # ------------------------------------------------------------------
    # 6. Show OpenLDAP pod status
    # ------------------------------------------------------------------
    - name: Get OpenLDAP pod
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ keycloak_ns }}"
        label_selectors:
          - app=openldap
      register: ldap_pod_result
      failed_when: false

    - name: Show OpenLDAP pod status
      ansible.builtin.debug:
        msg: |
          === OpenLDAP Pod Status ===
          {% for pod in ldap_pod_result.resources | default([]) %}
          - {{ pod.metadata.name }}: {{ pod.status.phase | default('Unknown') }}
          {% endfor %}
          {% if ldap_pod_result.resources | default([]) | length == 0 %}
          No OpenLDAP pods found in {{ keycloak_ns }}
          {% endif %}

    # ------------------------------------------------------------------
    # 7. Install Group Sync Operator
    # ------------------------------------------------------------------
    - name: Create group-sync-operator namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: group-sync-operator

    - name: Create Group Sync Operator OperatorGroup
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: group-sync-operator
            namespace: group-sync-operator
          spec:
            targetNamespaces:
              - group-sync-operator

    - name: Create Group Sync Operator Subscription
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: group-sync-operator
            namespace: group-sync-operator
          spec:
            channel: alpha
            name: group-sync-operator
            source: community-operators
            sourceNamespace: openshift-marketplace
            installPlanApproval: Automatic

    - name: Wait for Group Sync Operator CSV
      ansible.builtin.pause:
        seconds: 60

    # ------------------------------------------------------------------
    # 8. Create LDAP bind password secret and GroupSync CR
    # ------------------------------------------------------------------
    - name: Get LDAP bind password
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: openldap-admin-secret
        namespace: "{{ keycloak_ns }}"
      register: ldap_secret
      failed_when: false

    - name: Create LDAP bind password secret for Group Sync Operator
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ldap-bind-password
            namespace: group-sync-operator
          type: Opaque
          data:
            password: "{{ ldap_secret.resources[0].data.password }}"
      when: ldap_secret.resources | default([]) | length > 0
      no_log: true

    - name: Create GroupSync CR
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: redhatcop.redhat.io/v1alpha1
          kind: GroupSync
          metadata:
            name: ldap-groupsync
            namespace: group-sync-operator
          spec:
            providers:
              - name: ldap-masworld
                ldap:
                  url: "ldap://openldap.{{ keycloak_ns }}.svc:3389"
                  insecure: true
                  credentialsSecret:
                    name: ldap-bind-password
                    namespace: group-sync-operator
                    key: password
                  rfc2307:
                    groupsQuery:
                      baseDN: "ou=groups,dc=masworld,dc=example,dc=com"
                      scope: sub
                      derefAliases: never
                      filter: (objectClass=groupOfNames)
                    groupUIDAttribute: dn
                    groupNameAttributes:
                      - cn
                    groupMembershipAttributes:
                      - member
                    usersQuery:
                      baseDN: "ou=users,dc=masworld,dc=example,dc=com"
                      scope: sub
                      derefAliases: never
                    userUIDAttribute: dn
                    userNameAttributes:
                      - uid
            schedule: "*/5 * * * *"

    - name: Wait for group sync to complete
      ansible.builtin.pause:
        seconds: 30

    # ------------------------------------------------------------------
    # 9. Verify groups
    # ------------------------------------------------------------------
    - name: Get OpenShift groups
      kubernetes.core.k8s_info:
        api_version: user.openshift.io/v1
        kind: Group
      register: groups_result
      failed_when: false

    - name: Show groups
      ansible.builtin.debug:
        msg: |
          === OpenShift Groups ===
          {% for group in groups_result.resources | default([]) %}
          - {{ group.metadata.name }}: {{ group.users | default([]) | join(', ') }}
          {% endfor %}
          {% if groups_result.resources | default([]) | length == 0 %}
          No groups found — sync may still be in progress.
          {% endif %}

    # ------------------------------------------------------------------
    # Summary
    # ------------------------------------------------------------------
    - name: Exercise summary
      ansible.builtin.debug:
        msg: |
          ============================================================
          IDENTITY PROVIDER INTEGRATION – SOLVE COMPLETE (seat {{ seat_padded }})
          ============================================================
          Completed:
            - OAuth identity providers verified
            - Keycloak CR status checked
            - Keycloak route URL retrieved
            - KeycloakRealmImport and LDAP federation verified
            - OpenLDAP pod status checked
            - Group Sync Operator installed
            - LDAP bind password secret created
            - GroupSync CR created (scheduled every 5 minutes)
            - OpenShift groups verified
          ============================================================
