profile: production

project_dir: mas-world-2026-automation

exclude_paths:
  - .claude/
  - .venv/
  - molecule/
  - mas-world-2026-showroom/runtime-automation/
  - mas-world-2026-agnosticv/
  - mas-world-2026-automation/playbooks/_*.yml

skip_list:
  - yaml[line-length]
  - name[missing]
  - jinja[spacing]
  - var-naming[no-role-prefix]
  - galaxy[no-changelog]
  - galaxy[tags]
  - galaxy[no-runtime]

warn_list:
  - no-changed-when
  - command-instead-of-module
  - ignore-errors
  - key-order[task]

mock_roles:
  - config_validation
  - cluster_preflight
  - event_metadata
  - acm_registration
  - mas_prerequisites
  - mas_core
  - maximo_manage
  - logging_operator
  - loki_stack
  - log_forwarding
  - identity_demo
  - mas_edge
  - student_accounts
  - sample_workloads
  - showroom
  - event_readiness
  - environment_report

use_default_rules: true
offline: true
