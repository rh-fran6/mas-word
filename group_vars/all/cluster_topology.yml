---
# Naming prefix for all clusters in this fleet
cluster_prefix: "lab"

# Per-category sizing defaults.
# Cluster inventory is driven by secrets/cluster-credentials.yml —
# each key there is matched to a category here for instance sizing.
cluster_categories:
  facilitator:
    instance_type: "m6a.4xlarge"
    initial_replicas: 2
    autoscaling:
      enabled: true
      min_replicas: 2
      max_replicas: 4
      machinepool_name: "autoscale-workers"

  hub:
    instance_type: "m5.2xlarge"
    initial_replicas: 2
    autoscaling:
      enabled: true
      min_replicas: 2
      max_replicas: 6
      machinepool_name: "autoscale-workers"

  seat:
    instance_type: "m6a.4xlarge"
    initial_replicas: 2
    autoscaling:
      enabled: true
      min_replicas: 2
      max_replicas: 4
      machinepool_name: "autoscale-workers"
