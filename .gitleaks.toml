title = "MAS World 2026 Gitleaks Config"

[allowlist]
  paths = [
    '''\.example$''',
    '''\.md$''',
    '''docs/''',
  ]

[[rules]]
  id = "aws-access-key"
  description = "AWS Access Key"
  regex = '''AKIA[0-9A-Z]{16}'''
  tags = ["aws", "credentials"]

[[rules]]
  id = "generic-secret"
  description = "Generic secret assignment"
  regex = '''(?i)(password|secret|token|key)\s*[:=]\s*['"][^\s'"]{8,}['"]'''
  tags = ["generic", "credentials"]
  [rules.allowlist]
    regexes = [
      '''PLACEHOLDER''',
      '''UNSET''',
      '''secret://''',
      '''\{\{.*\}\}''',
    ]

[[rules]]
  id = "private-key"
  description = "Private key header"
  regex = '''-----BEGIN (RSA |EC |DSA )?PRIVATE KEY-----'''
  tags = ["key", "credentials"]

[[rules]]
  id = "ibm-entitlement"
  description = "IBM Entitlement Key pattern"
  regex = '''eyJ[A-Za-z0-9_-]{20,}\.eyJ[A-Za-z0-9_-]{20,}'''
  tags = ["ibm", "credentials"]
