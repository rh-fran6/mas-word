title = "MAS World 2026 Gitleaks Config"

[allowlist]
  description = "Global allowlist — paths already in .gitignore and known false positives"
  paths = [
    '''secrets/''',
    '''collections/''',
    '''__pycache__/''',
    '''\.cache/''',
    '''\.claude/''',
    '''\.example$''',
  ]
  regexTarget = "match"
  regexes = [
    '''PLACEHOLDER''',
    '''REPLACE_ME''',
    '''UNSET''',
    '''YOUR_.*''',
    '''changeme''',
    '''secret://''',
    '''\{\{.*\}\}''',
  ]
