---
# MAS World 2026 -- AgnosticV Variable Schema
#
# Defines the expected types, constraints, defaults, and descriptions
# for all variables used in the AgnosticV catalog. This schema is
# used for validation and documentation.
#
# Consistent with the Pydantic models in:
#   mas-world-2026-automation/cli/config/schema.py

schema:
  version: "1.0.0"
  description: "Variable schema for MAS World 2026 AgnosticV catalog"

  variables:

    # -------------------------------------------------------------------------
    # Event metadata
    # -------------------------------------------------------------------------
    event_id:
      type: string
      required: true
      default: "mas-world-2026"
      description: "Unique event identifier"

    event_name:
      type: string
      required: true
      default: "MAS World 2026"
      description: "Human-readable event name"

    event_date:
      type: string
      required: true
      default: "2026-08-17"
      description: "Event date in ISO 8601 format"
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"

    event_timezone:
      type: string
      required: true
      default: "America/Chicago"
      description: "Event timezone (IANA identifier)"

    # -------------------------------------------------------------------------
    # Fleet sizing
    # -------------------------------------------------------------------------
    fleet_attendee_count:
      type: integer
      required: true
      default: 1
      minimum: 0
      maximum: 200
      description: "Number of attendee clusters"

    fleet_spare_count:
      type: integer
      required: true
      default: 0
      minimum: 0
      maximum: 50
      description: "Number of spare clusters held in reserve"

    fleet_facilitator_count:
      type: integer
      required: true
      default: 1
      minimum: 0
      maximum: 5
      description: "Number of facilitator clusters"

    fleet_require_exact_counts:
      type: boolean
      required: false
      default: false
      description: "Fail if inventory does not match configured counts exactly"

    fleet_max_concurrent_clusters:
      type: integer
      required: false
      default: 5
      minimum: 1
      maximum: 50
      description: "Maximum clusters configured in parallel"

    fleet_per_cluster_timeout_minutes:
      type: integer
      required: false
      default: 240
      minimum: 30
      description: "Per-cluster configuration timeout in minutes"

    fleet_retry_count:
      type: integer
      required: false
      default: 3
      minimum: 0
      description: "Number of retries for transient failures"

    fleet_retry_backoff_base_seconds:
      type: integer
      required: false
      default: 30
      minimum: 1
      description: "Base seconds for exponential backoff between retries"

    # -------------------------------------------------------------------------
    # Seat assignment
    # -------------------------------------------------------------------------
    seat_number:
      type: integer
      required: true
      minimum: 1
      maximum: 99
      description: "Attendee seat number"

    fleet_first_seat_number:
      type: integer
      required: false
      default: 1
      minimum: 1
      description: "First seat number in the sequence"

    fleet_seat_number_padding:
      type: integer
      required: false
      default: 2
      minimum: 1
      maximum: 4
      description: "Zero-padding width for seat numbers"

    fleet_automatically_assign_spares:
      type: boolean
      required: false
      default: false
      description: "Automatically assign spare clusters on failure"

    # -------------------------------------------------------------------------
    # Cluster connection
    # -------------------------------------------------------------------------
    cluster_api_url:
      type: string
      required: true
      description: "OpenShift API URL for the target cluster"
      pattern: "^https://api\\..+:\\d+$"

    cluster_admin_secret_ref:
      type: string
      required: true
      secret: true
      description: "Secret reference for cluster admin credentials"
      pattern: "^secret://[\\w-]+/[\\w-]+(/[\\w-]+)*$"

    environment:
      type: string
      required: false
      default: "event"
      enum:
        - development
        - rehearsal
        - event
      description: "Target environment for variable resolution"

    # -------------------------------------------------------------------------
    # OpenShift version constraints
    # -------------------------------------------------------------------------
    ocp_version_min:
      type: string
      required: true
      default: "4.18"
      description: "Minimum supported OpenShift version"
      pattern: "^4\\.\\d+$"

    ocp_version_max:
      type: string
      required: true
      default: "4.22"
      description: "Maximum supported OpenShift version"
      pattern: "^4\\.\\d+$"

    # -------------------------------------------------------------------------
    # MAS configuration
    # -------------------------------------------------------------------------
    mas_version:
      type: string
      required: true
      default: "9.1.x"
      description: "IBM MAS version (pinned)"

    mas_channel:
      type: string
      required: true
      default: "9.1.x"
      description: "MAS operator subscription channel (pinned)"

    mas_catalog_tag:
      type: string
      required: true
      default: "v9-260625-amd64"
      description: "IBM operator catalog image tag (pinned)"

    mas_catalog_image:
      type: string
      required: true
      default: "icr.io/cpopen/ibm-maximo-operator-catalog:v9-260625-amd64"
      description: "Full IBM operator catalog image reference"

    mas_catalog_source:
      type: string
      required: false
      default: "ibm-operator-catalog"
      description: "Name of the CatalogSource resource"

    mas_install_core:
      type: boolean
      required: false
      default: true
      description: "Install MAS Core operator and Suite CR"

    mas_install_manage:
      type: boolean
      required: false
      default: true
      description: "Install and activate Maximo Manage"

    # -------------------------------------------------------------------------
    # MAS dependency versions
    # -------------------------------------------------------------------------
    mongodb_version:
      type: string
      required: false
      default: "7.0"
      description: "MongoDB version for MAS (pinned)"

    sls_channel:
      type: string
      required: false
      default: "3.x"
      description: "IBM Suite License Service operator channel (pinned)"

    db2_version:
      type: string
      required: false
      default: "11.5"
      description: "IBM Db2 version for Maximo Manage database (pinned)"

    gitops_channel:
      type: string
      required: false
      default: "gitops-1.21"
      description: "OpenShift GitOps operator channel (pinned)"

    # -------------------------------------------------------------------------
    # Logging configuration
    # -------------------------------------------------------------------------
    logging_channel:
      type: string
      required: true
      default: "stable-6.6"
      description: "OpenShift Logging Operator subscription channel (pinned)"

    logging_collector:
      type: string
      required: false
      default: "vector"
      enum:
        - vector
      description: "Log collector implementation"

    logging_collect_application:
      type: boolean
      required: false
      default: true
      description: "Collect application container logs"

    logging_collect_infrastructure:
      type: boolean
      required: false
      default: true
      description: "Collect infrastructure component logs"

    logging_collect_audit:
      type: boolean
      required: false
      default: true
      description: "Collect Kubernetes and OpenShift audit logs"

    # -------------------------------------------------------------------------
    # Loki configuration
    # -------------------------------------------------------------------------
    loki_channel:
      type: string
      required: true
      default: "stable-6.6"
      description: "Loki Operator subscription channel (pinned)"

    loki_api_version:
      type: string
      required: false
      default: "loki.grafana.com/v1"
      description: "LokiStack API version"

    loki_size:
      type: string
      required: false
      default: "1x.extra-small"
      description: "LokiStack size profile"
      enum:
        - "1x.extra-small"
        - "1x.small"
        - "1x.medium"

    loki_object_storage_mode:
      type: string
      required: true
      default: "bucket-per-cluster"
      enum:
        - bucket-per-cluster
        - shared-bucket
      description: "S3 isolation model for Loki object storage"

    loki_retention_days:
      type: integer
      required: false
      default: 7
      minimum: 1
      maximum: 30
      description: "Log retention period in days"

    # -------------------------------------------------------------------------
    # AWS configuration
    # -------------------------------------------------------------------------
    aws_default_region:
      type: string
      required: true
      default: "us-east-2"
      description: "AWS region for S3 and other services"

    aws_s3_bucket_prefix:
      type: string
      required: true
      default: "mas-world-2026"
      description: "Prefix for S3 bucket names"

    aws_s3_encryption:
      type: string
      required: false
      default: "AES256"
      enum:
        - AES256
        - aws:kms
      description: "S3 server-side encryption algorithm"

    aws_s3_lifecycle_expiration_days:
      type: integer
      required: false
      default: 30
      minimum: 1
      description: "S3 object lifecycle expiration in days"

    # -------------------------------------------------------------------------
    # ACM configuration
    # -------------------------------------------------------------------------
    acm_version:
      type: string
      required: false
      default: "2.16"
      description: "ACM version on the hub cluster"

    acm_registration_enabled:
      type: boolean
      required: false
      default: true
      description: "Register cluster with ACM hub"

    # -------------------------------------------------------------------------
    # Identity configuration
    # -------------------------------------------------------------------------
    keycloak_deployment_mode:
      type: string
      required: false
      default: "per-cluster"
      enum:
        - per-cluster
        - shared
        - external
        - disabled
      description: "Keycloak deployment topology"

    keycloak_realm_name:
      type: string
      required: false
      default: "mas-world"
      description: "Keycloak realm name"

    # -------------------------------------------------------------------------
    # MAS Edge
    # -------------------------------------------------------------------------
    mas_edge_enabled:
      type: boolean
      required: false
      default: false
      description: "Install MAS Edge components"

    # -------------------------------------------------------------------------
    # Showroom configuration
    # -------------------------------------------------------------------------
    showroom_enabled:
      type: boolean
      required: false
      default: true
      description: "Deploy Showroom workshop interface"

    showroom_template:
      type: string
      required: false
      default: "nookbag"
      description: "Showroom template name"

    showroom_theme_version:
      type: string
      required: true
      default: "v2.0.3"
      description: "Showroom theme version (pinned)"

    showroom_title:
      type: string
      required: false
      default: "MAS World 2026 -- Maximo on OpenShift Workshop"
      description: "Workshop title displayed in Showroom"

    showroom_content_repo:
      type: string
      required: true
      default: "https://github.com/rhpds/mas-world-2026-showroom.git"
      description: "Git repository for Showroom content"

    showroom_content_ref:
      type: string
      required: true
      default: "main"
      description: "Git ref for Showroom content (pinned branch or tag)"

    # -------------------------------------------------------------------------
    # Student credential configuration
    # -------------------------------------------------------------------------
    student_credential_profile:
      type: string
      required: false
      default: "attendee-default"
      description: "Name of the credential profile to apply"

    student_username_template:
      type: string
      required: true
      default: "user{{ seat_number | pad(2) }}"
      description: "Jinja2 template for generating student usernames"

    student_display_name_template:
      type: string
      required: false
      default: "MAS World Attendee {{ seat_number }}"
      description: "Jinja2 template for student display names"

    student_authentication_provider:
      type: string
      required: false
      default: "htpasswd"
      enum:
        - htpasswd
        - ldap
        - oidc
      description: "Authentication provider for student accounts"

    student_password_mode:
      type: string
      required: true
      default: "generated"
      enum:
        - generated
        - secret-ref
        - external-idp
        - disabled
        - deterministic
      description: "How student passwords are created or resolved"

    student_password_length:
      type: integer
      required: false
      default: 18
      minimum: 12
      maximum: 64
      description: "Length of generated student passwords"

    student_password_secret_ref_template:
      type: string
      required: true
      secret: true
      default: "secret://mas-world/students/seat-{{ seat_number | pad(2) }}"
      description: "Secret reference template for student passwords"

    student_rotate_before_event:
      type: boolean
      required: false
      default: true
      description: "Rotate student passwords before the event"

    student_expire_after_event:
      type: boolean
      required: false
      default: true
      description: "Expire student passwords after the event"

    student_allow_shared_password:
      type: boolean
      required: false
      default: false
      description: "Allow shared passwords across students (dev only)"

    student_cluster_role:
      type: string
      required: false
      default: "basic-user"
      description: "Cluster role assigned to student accounts"

    student_namespace_template:
      type: string
      required: false
      default: "student-{{ seat_number | pad(2) }}"
      description: "Jinja2 template for student namespace names"

    student_namespace_role:
      type: string
      required: false
      default: "admin"
      description: "Role granted to the student in their namespace"

    student_allow_cluster_admin:
      type: boolean
      required: false
      default: false
      description: "Grant cluster-admin to student accounts (must be false)"

    student_allow_acm_access:
      type: boolean
      required: false
      default: false
      description: "Grant ACM access to student accounts (must be false)"

    student_allow_other_student_namespaces:
      type: boolean
      required: false
      default: false
      description: "Allow students to access other students' namespaces"

    student_allow_protected_secret_read:
      type: boolean
      required: false
      default: false
      description: "Allow students to read protected secrets"

    # -------------------------------------------------------------------------
    # Secret provider
    # -------------------------------------------------------------------------
    secret_provider:
      type: string
      required: true
      default: "env"
      enum:
        - env
        - k8s
        - aws-sm
        - vault
      description: "Secret provider type"

    secret_provider_config:
      type: object
      required: false
      default: {}
      description: "Provider-specific configuration"

    # -------------------------------------------------------------------------
    # Credential references (secret:// URIs only)
    # -------------------------------------------------------------------------
    ibm_entitlement_key_ref:
      type: string
      required: true
      secret: true
      default: "secret://mas-world/ibm/entitlement-key"
      description: "Secret reference for IBM entitlement key"
      pattern: "^secret://[\\w-]+/[\\w-]+(/[\\w-]+)*$"

    ibm_license_ref:
      type: string
      required: true
      secret: true
      default: "secret://mas-world/ibm/license"
      description: "Secret reference for IBM MAS license"
      pattern: "^secret://[\\w-]+/[\\w-]+(/[\\w-]+)*$"

    aws_credentials_ref:
      type: string
      required: true
      secret: true
      default: "secret://mas-world/aws/credentials"
      description: "Secret reference for AWS credentials"
      pattern: "^secret://[\\w-]+/[\\w-]+(/[\\w-]+)*$"

    acm_hub_kubeconfig_ref:
      type: string
      required: false
      secret: true
      default: "secret://mas-world/acm/hub-kubeconfig"
      description: "Secret reference for ACM hub kubeconfig"
      pattern: "^secret://[\\w-]+/[\\w-]+(/[\\w-]+)*$"

    container_registry_pull_secret_ref:
      type: string
      required: true
      secret: true
      default: "secret://mas-world/registry/pull-secret"
      description: "Secret reference for container registry pull secret"
      pattern: "^secret://[\\w-]+/[\\w-]+(/[\\w-]+)*$"

    # -------------------------------------------------------------------------
    # Diagnostic and logging settings
    # -------------------------------------------------------------------------
    logging_log_level:
      type: string
      required: false
      default: "info"
      enum:
        - debug
        - info
        - warning
        - error
      description: "Automation log verbosity"

    logging_structured:
      type: boolean
      required: false
      default: true
      description: "Emit structured JSON logs"

    logging_per_cluster_log_dir:
      type: string
      required: false
      default: "logs/clusters"
      description: "Directory for per-cluster log files"

    logging_redact_secrets:
      type: boolean
      required: false
      default: true
      description: "Redact secret values in log output"
