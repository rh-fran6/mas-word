[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mas-world-2026"
version = "0.1.0"
description = "MAS World 2026 fleet automation and management CLI"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "click>=8.1,<9",
    "pydantic>=2.5,<3",
    "pyyaml>=6.0,<7",
    "jinja2>=3.1,<4",
    "boto3>=1.34,<2",
    "kubernetes>=29.0,<31",
    "qrcode>=7.4,<8",
    "rich>=13.7,<14",
    "jsonschema>=4.21,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "pytest-mock>=3.14,<4",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "ansible-lint>=24.2,<25",
    "yamllint>=1.35,<2",
    "molecule>=24.2,<27",
]
vault = [
    "hvac>=2.1,<3",
]

[project.scripts]
mas-world = "cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "plugins*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "SIM"]
ignore = [
    "S101",  # allow assert in tests
    "S603",  # subprocess calls use controlled internal commands (ansible-playbook)
    "S105",  # false positives on test fixtures and secret-reference field names
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "SIM105", "SIM115"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
