---
- name: Include build_definitions
  ansible.builtin.include_tasks: build_definitions.yml

- name: Gather API URLs for all clusters
  ansible.builtin.shell: |
    set -o pipefail
    rosa describe cluster --cluster={{ item.name }} --output json
  args:
    executable: /bin/bash
  environment:
    AWS_ACCESS_KEY_ID: "{{ item.aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ item.aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ item.aws_region }}"
  loop: "{{ cluster_definitions }}"
  loop_control:
    label: "{{ item.name }}"
  register: cluster_describe_results
  changed_when: false
  no_log: true

- name: Build API URL map
  ansible.builtin.set_fact:
    cluster_api_urls: >-
      {{ cluster_api_urls | default({}) | combine({
        item.item.name: (item.stdout | from_json).api.url | default('')
      }) }}
  loop: "{{ cluster_describe_results.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  no_log: true

- name: Load existing cluster credentials file
  ansible.builtin.slurp:
    src: "{{ playbook_dir }}/../secrets/cluster-credentials.yml"
  register: existing_creds_raw
  no_log: true

- name: Parse existing credentials
  ansible.builtin.set_fact:
    existing_creds: "{{ existing_creds_raw.content | b64decode | from_yaml }}"
  no_log: true

- name: Merge new credentials into existing
  ansible.builtin.set_fact:
    updated_cluster_credentials: >-
      {{ existing_creds.cluster_credentials | combine({
        item.name: existing_creds.cluster_credentials[item.name] | default({}) | combine(
          _merge_fields | dict2items | rejectattr('value', 'equalto', '') | list | items2dict
        )
      }) }}
  vars:
    _merge_fields:
      api_url: "{{ cluster_api_urls[item.name] | default('') }}"
      admin_password: "{{ cluster_admin_credentials[item.name] | default(existing_creds.cluster_credentials[item.name].admin_password | default('')) }}"
  loop: "{{ cluster_definitions }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Write updated cluster credentials file
  ansible.builtin.copy:
    content: |
      ---
      # Single source of truth for ALL per-cluster credentials.
      # Auto-updated by 'make provision' after cluster creation.
      #
      # Fields:
      #   aws_access_key_id / aws_secret_access_key / aws_region — AWS account credentials
      #   api_url       — OpenShift API URL (populated after provisioning)
      #   admin_password — cluster-admin password (populated after provisioning)
      #   subnet_ids    — optional if using 'make setup-infra' to create VPCs automatically
      {{ {'cluster_credentials': updated_cluster_credentials} | to_nice_yaml(indent=2) }}
    dest: "{{ playbook_dir }}/../secrets/cluster-credentials.yml"
    mode: "0600"
  no_log: true

- name: Credential save complete
  ansible.builtin.debug:
    msg: >-
      Updated secrets/cluster-credentials.yml with api_url and admin_password
      for {{ cluster_definitions | length }} clusters.
