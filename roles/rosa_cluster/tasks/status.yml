---
- name: Include build_definitions
  ansible.builtin.include_tasks: build_definitions.yml

- name: Get cluster status
  ansible.builtin.shell: |
    set -o pipefail
    rosa describe cluster --cluster={{ _rosa_managed_ids[item.name] | default(item.name) }} --output json 2>/dev/null \
      | python3 -c "
    import sys, json
    d = json.load(sys.stdin)
    state = d.get('status', {}).get('state', 'unknown')
    api = d.get('api', {}).get('url', 'n/a')
    console = d.get('console', {}).get('url', 'n/a')
    version = d.get('openshift_version', 'n/a')
    print(f'{state}|{api}|{console}|{version}')
    " || echo "not_found|||"
  args:
    executable: /bin/bash
  environment:
    OCM_CONFIG: "/tmp/rosa-cluster-ocm-configs/{{ item.name }}.json"
    AWS_ACCESS_KEY_ID: "{{ item.aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ item.aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ item.aws_region }}"
  loop: "{{ cluster_definitions }}"
  loop_control:
    label: "{{ item.name }}"
  register: status_results
  changed_when: false
  failed_when: false
  no_log: true

- name: Display fleet status
  vars:
    _raw: "{{ item.stdout | default('unknown|||', true) }}"
    _state: "{{ _raw.split('|') | first }}"
    _api: "{{ _raw | regex_replace('^[^|]*\\|([^|]*)\\|.*$', '\\1') }}"
    _console: "{{ _raw | regex_replace('^[^|]*\\|[^|]*\\|([^|]*)\\|.*$', '\\1') }}"
    _version: "{{ _raw.split('|') | last }}"
  ansible.builtin.debug:
    msg: "{{ item.item.name }} ({{ item.item.category }}): state={{ _state }}, api={{ _api }}, console={{ _console }}, version={{ _version }}"
  loop: "{{ status_results.results }}"
  loop_control:
    label: "{{ item.item.name }}"
