---
- name: "Generate admin password for {{ admin_check.item.name }}"
  ansible.builtin.set_fact:
    _admin_pw: "{{ lookup('password', '/dev/null length=' ~ rosa_admin_password_length ~ ' chars=' ~ rosa_admin_password_chars) }}"
  when: "'There is no admin on cluster' in (admin_check.stderr | default(''))"
  no_log: true

- name: "Create cluster-admin on {{ admin_check.item.name }}"
  ansible.builtin.shell: |
    set -o pipefail
    rosa create admin \
      --cluster={{ admin_check.item.name }} \
      --password={{ _admin_pw }} \
      --yes 2>&1
  args:
    executable: /bin/bash
  environment:
    AWS_ACCESS_KEY_ID: "{{ admin_check.item.aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ admin_check.item.aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ admin_check.item.aws_region }}"
  when: "'There is no admin on cluster' in (admin_check.stderr | default(''))"
  register: admin_create_result
  no_log: true

- name: "Record admin password for {{ admin_check.item.name }}"
  ansible.builtin.set_fact:
    cluster_admin_credentials: >-
      {{ cluster_admin_credentials | combine({
        admin_check.item.name: _admin_pw
      }) }}
  when: admin_create_result is not skipped
  no_log: true

- name: "Admin already exists on {{ admin_check.item.name }}"
  ansible.builtin.debug:
    msg: "cluster-admin already exists on {{ admin_check.item.name }}, skipping creation"
  when: admin_create_result is skipped
