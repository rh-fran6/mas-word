---
# Maximo Manage role defaults
masworld_manage_enabled: true

# Manage subscription channel
masworld_manage_channel: "9.2.x"

# Database type for Manage
masworld_manage_db_type: "db2"

# Manage components to activate
masworld_manage_components:
  - base

# MAS instance and workspace (should match mas_core)
masworld_mas_instance_id: "inst1"
masworld_mas_workspace_id: "masworld"

# Manage activation readiness polling (Manage takes 60-90 minutes)
masworld_manage_ready_retries: 90
masworld_manage_ready_delay: 60
