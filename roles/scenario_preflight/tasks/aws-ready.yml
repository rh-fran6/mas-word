---
# Scenario 2: AWS Ready — AWS networking exists, provision ROSA + app
# Required inputs: AWS access keys, ROSA token, infra_state or subnet_ids in credentials

- name: "AWS-READY PREFLIGHT — Phase 1: CLI Tools"
  ansible.builtin.debug:
    msg: "Checking required CLI tools..."

- name: Verify rosa CLI is installed
  ansible.builtin.command: rosa version
  register: _ar_rosa_version
  changed_when: false
  failed_when: _ar_rosa_version.rc != 0

- name: Verify aws CLI is installed
  ansible.builtin.command: aws --version
  register: _ar_aws_version
  changed_when: false
  failed_when: _ar_aws_version.rc != 0

- name: Display CLI versions
  ansible.builtin.debug:
    msg: >-
      CLI tools OK — rosa {{ _ar_rosa_version.stdout_lines[0] | default('?') }},
      {{ _ar_aws_version.stdout_lines[0] | default('?') }}

- name: "AWS-READY PREFLIGHT — Phase 2: Credentials & Configuration"
  ansible.builtin.debug:
    msg: "Validating credentials and configuration..."

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - cluster_prefix is defined and cluster_prefix | length > 0
      - cluster_categories is defined and cluster_categories | length > 0
      - cluster_credentials is defined
      - rosa_token is defined
    fail_msg: >
      Required variables missing. Need: cluster_prefix, cluster_categories,
      cluster_credentials, rosa_token

- name: Validate exactly one facilitator in credentials
  ansible.builtin.assert:
    that:
      - cluster_categories.facilitator is defined
      - cluster_credentials | dict2items
        | selectattr('key', 'match', '^' ~ cluster_prefix ~ '-facilitator-')
        | list | length == 1
    fail_msg: "Exactly one facilitator cluster must exist in cluster-credentials.yml"

- name: Validate minimum replicas per category
  ansible.builtin.assert:
    that:
      - item.value.initial_replicas | int >= 2
    fail_msg: "Category '{{ item.key }}' must have at least 2 initial replicas (ROSA HCP minimum)"
  loop: "{{ cluster_categories | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Build cluster definitions for preflight
  ansible.builtin.set_fact:
    cluster_definitions: >-
      {{ cluster_categories | build_cluster_list(cluster_prefix, cluster_credentials, infra_state | default({})) }}
  no_log: true

- name: "AWS-READY PREFLIGHT — Phase 3: ROSA Authentication"
  ansible.builtin.debug:
    msg: "Validating ROSA login..."

- name: Log in to ROSA
  ansible.builtin.command: rosa login --token={{ rosa_token }}
  register: _ar_rosa_login
  retries: 3
  delay: 10
  until: _ar_rosa_login is not failed
  changed_when: false
  no_log: true
  environment:
    OCM_TOKEN: "{{ rosa_token }}"

- name: Verify ROSA login
  ansible.builtin.command: rosa whoami
  register: _ar_whoami
  retries: 3
  delay: 10
  until: _ar_whoami is not failed
  changed_when: false
  no_log: true

- name: Confirm ROSA login
  ansible.builtin.debug:
    msg: "ROSA login verified successfully."

- name: "AWS-READY PREFLIGHT — Phase 4: AWS Credential Validation"
  ansible.builtin.debug:
    msg: "Validating AWS credentials for {{ cluster_definitions | length }} accounts..."

- name: Validate AWS credentials per account
  ansible.builtin.shell: |
    set -o pipefail
    aws sts get-caller-identity --output json
  args:
    executable: /bin/bash
  environment:
    AWS_ACCESS_KEY_ID: "{{ item.aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ item.aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ item.aws_region }}"
  loop: "{{ cluster_definitions }}"
  loop_control:
    label: "{{ item.name }}"
  register: _ar_aws_identity
  changed_when: false
  no_log: true

- name: Display validated AWS accounts
  ansible.builtin.debug:
    msg: >-
      {{ item.item.name }}: AWS credentials valid
      (account {{ (item.stdout | from_json).Account | regex_replace('^(.{4}).*(.{4})$', '\\1****\\2') }},
      region {{ item.item.aws_region }})
  loop: "{{ _ar_aws_identity.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: "AWS-READY PREFLIGHT — Phase 5: AWS Infrastructure Validation"
  ansible.builtin.debug:
    msg: "Validating existing AWS infrastructure..."

- name: Check VPC exists per account
  ansible.builtin.shell: |
    set -o pipefail
    aws ec2 describe-vpcs \
      --filters "Name=tag:Project,Values={{ aws_infra_tags.Project | default('rosa-hcp-multi-build') }}" \
                "Name=tag:Cluster,Values={{ item.name }}" \
      --query "Vpcs[0].VpcId" --output text 2>/dev/null
  args:
    executable: /bin/bash
  environment:
    AWS_ACCESS_KEY_ID: "{{ item.aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ item.aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ item.aws_region }}"
  loop: "{{ cluster_definitions }}"
  loop_control:
    label: "{{ item.name }}"
  register: _ar_vpc_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Display VPC status
  ansible.builtin.debug:
    msg: >-
      {{ item.item.name }}: VPC
      {{ 'found' if item.stdout | default('') | trim not in ['None', ''] else 'MISSING' }}
  loop: "{{ _ar_vpc_check.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Fail if any VPC is missing
  ansible.builtin.fail:
    msg: >
      AWS infrastructure incomplete — VPC missing for:
      {{ _ar_vpc_check.results | selectattr('stdout', 'in', ['None', '']) | map(attribute='item.name') | list | join(', ') }}.
      Use scenario 'greenfield' to create infrastructure first, or verify infra_state.yml is populated.
  when: _ar_vpc_check.results | selectattr('stdout', 'in', ['None', '']) | list | length > 0

- name: Check NAT Gateway per account
  ansible.builtin.shell: |
    set -o pipefail
    aws ec2 describe-nat-gateways \
      --filter "Name=tag:Project,Values={{ aws_infra_tags.Project | default('rosa-hcp-multi-build') }}" \
               "Name=tag:Cluster,Values={{ item.name }}" \
               "Name=state,Values=available" \
      --query "NatGateways[0].State" --output text 2>/dev/null
  args:
    executable: /bin/bash
  environment:
    AWS_ACCESS_KEY_ID: "{{ item.aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ item.aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ item.aws_region }}"
  loop: "{{ cluster_definitions }}"
  loop_control:
    label: "{{ item.name }}"
  register: _ar_nat_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Display NAT Gateway status
  ansible.builtin.debug:
    msg: >-
      {{ item.item.name }}: NAT Gateway
      {{ 'available' if item.stdout | default('') | trim == 'available' else 'WARNING — not available' }}
  loop: "{{ _ar_nat_check.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Validate subnet IDs are available
  ansible.builtin.assert:
    that:
      - item.subnet_ids | default('') | length > 0
    fail_msg: >
      No subnet_ids for {{ item.name }}. Either populate subnet_ids in
      cluster-credentials.yml or ensure infra_state.yml has entries for this cluster.
  loop: "{{ cluster_definitions }}"
  loop_control:
    label: "{{ item.name }}"

- name: Count subnets per cluster
  ansible.builtin.debug:
    msg: "{{ item.name }}: {{ item.subnet_ids.split(',') | length }} subnets configured"
  loop: "{{ cluster_definitions }}"
  loop_control:
    label: "{{ item.name }}"

- name: "AWS-READY PREFLIGHT — Phase 6: ROSA Quota Check"
  ansible.builtin.debug:
    msg: "Checking ROSA quotas (advisory)..."

- name: Check ROSA quota per account
  ansible.builtin.command: rosa verify quota
  environment:
    AWS_ACCESS_KEY_ID: "{{ item.aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ item.aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ item.aws_region }}"
  loop: "{{ cluster_definitions }}"
  loop_control:
    label: "{{ item.name }}"
  register: _ar_quota_check
  failed_when: false
  changed_when: false
  no_log: true

- name: Display ROSA quota results
  ansible.builtin.debug:
    msg: >-
      {{ item.item.name }}: ROSA quota
      {{ 'OK' if item.rc == 0 else 'WARNING — quota check failed (non-blocking)' }}
  loop: "{{ _ar_quota_check.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: "AWS-READY PREFLIGHT — Phase 7: Phase 2 Field Validation"
  ansible.builtin.debug:
    msg: "Validating Phase 2 required fields (purpose, seat_number)..."

- name: Validate Phase 2 fields
  ansible.builtin.include_tasks: _validate-phase2-fields.yml

- name: "AWS-READY PREFLIGHT — Summary"
  ansible.builtin.debug:
    msg: |
      ══════════════════════════════════════════════════════════════
        AWS-READY PREFLIGHT PASSED
      ══════════════════════════════════════════════════════════════
        Fleet: {{ cluster_definitions | length }} clusters
        Infrastructure: AWS VPCs and subnets validated
        Prefix: {{ cluster_prefix }}

        Pipeline: Verify Infra → ROSA Enrollment → Cluster Provision
                  → Workshop Machinepool → Demo Application
      ══════════════════════════════════════════════════════════════
