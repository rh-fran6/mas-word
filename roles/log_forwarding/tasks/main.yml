---
# log_forwarding/tasks/main.yml
# Configures ClusterLogForwarder to send logs to LokiStack.
# Sets fact: log_forwarding_ready (true/false)

- name: Configure log forwarding
  block:
    # --- Build Pipeline List ---
    - name: Build enabled input refs list
      ansible.builtin.set_fact:
        _clf_input_refs: >-
          {{
            ((['application'] if masworld_log_forwarding_collect_application | bool else []) +
             (['infrastructure'] if masworld_log_forwarding_collect_infrastructure | bool else []) +
             (['audit'] if masworld_log_forwarding_collect_audit | bool else []))
          }}

    - name: Fail if no log types are enabled
      ansible.builtin.fail:
        msg: "At least one log type (application, infrastructure, audit) must be enabled for log forwarding"
      when: _clf_input_refs | length == 0

    # --- Create ClusterLogForwarder CR ---
    - name: Create ClusterLogForwarder resource
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: observability.openshift.io/v1
          kind: ClusterLogForwarder
          metadata:
            name: "{{ masworld_log_forwarding_clf_name }}"
            namespace: "{{ masworld_log_forwarding_namespace }}"
            labels:
              masworld.ibm.com/component: "log-forwarding"
              app.kubernetes.io/managed-by: "ansible"
          spec:
            serviceAccount:
              name: "{{ masworld_log_forwarding_service_account }}"
            outputs:
              - name: loki-output
                type: lokiStack
                lokiStack:
                  target:
                    name: "{{ masworld_log_forwarding_loki_target }}"
                    namespace: "{{ masworld_log_forwarding_namespace }}"
                  authentication:
                    token:
                      from: serviceAccount
            pipelines:
              - name: all-logs-to-loki
                inputRefs: "{{ _clf_input_refs }}"
                outputRefs:
                  - loki-output

    # --- Wait for CLF to Report Ready ---
    - name: Wait for ClusterLogForwarder to be ready
      kubernetes.core.k8s_info:
        api_version: observability.openshift.io/v1
        kind: ClusterLogForwarder
        name: "{{ masworld_log_forwarding_clf_name }}"
        namespace: "{{ masworld_log_forwarding_namespace }}"
      register: _clf_status
      until: >-
        _clf_status.resources | length > 0 and
        _clf_status.resources[0].status is defined and
        _clf_status.resources[0].status.conditions is defined and
        _clf_status.resources[0].status.conditions
          | selectattr('type', 'equalto', 'Ready')
          | selectattr('status', 'equalto', 'True')
          | list | length > 0
      retries: "{{ masworld_log_forwarding_readiness_retries }}"
      delay: "{{ masworld_log_forwarding_readiness_delay }}"

    # --- Set Success Facts ---
    - name: Set log_forwarding_ready fact
      ansible.builtin.set_fact:
        log_forwarding_ready: true
        log_forwarding_status: "ready"
        log_forwarding_info:
          clf_name: "{{ masworld_log_forwarding_clf_name }}"
          loki_target: "{{ masworld_log_forwarding_loki_target }}"
          log_types: "{{ _clf_input_refs }}"

    - name: Report log forwarding ready
      ansible.builtin.debug:
        msg: >-
          ClusterLogForwarder '{{ masworld_log_forwarding_clf_name }}' is ready —
          forwarding {{ _clf_input_refs | join(', ') }} logs to LokiStack '{{ masworld_log_forwarding_loki_target }}'

  rescue:
    - name: Set log forwarding failed
      ansible.builtin.set_fact:
        log_forwarding_ready: false
        log_forwarding_status: "failed"
        log_forwarding_error: "{{ ansible_failed_result.msg | default('Unknown log forwarding error') }}"

    - name: Report log forwarding failure
      ansible.builtin.fail:
        msg: >-
          Log forwarding configuration failed:
          {{ log_forwarding_error }}
