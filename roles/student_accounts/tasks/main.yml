---
# Student Accounts: create per-seat accounts with RBAC
- name: Create student accounts
  block:
    # ── Resolve Seat-Specific Values ────────────────────────────────────
    - name: Resolve student username
      ansible.builtin.set_fact:
        _masworld_student_username: "user{{ masworld_seat_number | pad(2) }}"

    - name: Resolve student namespace
      ansible.builtin.set_fact:
        _masworld_student_namespace: "student-{{ masworld_seat_number | pad(2) }}"

    # ── Generate Student Password ───────────────────────────────────────
    - name: Generate student password
      ansible.builtin.set_fact:
        _masworld_student_password: >-
          {{ lookup('ansible.builtin.password',
                    '/dev/null length=' + (masworld_student_password_length | string)
                    + ' chars=ascii_letters,digits') }}
      no_log: true
      when: not (masworld_student_allow_shared_password | bool)

    - name: Use shared password if allowed
      ansible.builtin.set_fact:
        _masworld_student_password: >-
          {{ lookup('ansible.builtin.password',
                    '/tmp/.masworld_shared_password length=' + (masworld_student_password_length | string)
                    + ' chars=ascii_letters,digits') }}
      no_log: true
      when: masworld_student_allow_shared_password | bool

    # ── Create htpasswd Entry ───────────────────────────────────────────
    - name: Generate htpasswd hash for student
      ansible.builtin.command:
        cmd: >-
          htpasswd -nbB {{ _masworld_student_username }} {{ _masworld_student_password }}
      register: _masworld_htpasswd_entry
      changed_when: false
      no_log: true

    # ── Ensure htpasswd secret exists ───────────────────────────────────
    - name: Check if htpasswd secret already exists
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ masworld_htpasswd_secret_name }}"
        namespace: "{{ masworld_htpasswd_secret_namespace }}"
      register: _masworld_existing_htpasswd_secret

    - name: Read existing htpasswd data
      ansible.builtin.set_fact:
        _masworld_existing_htpasswd: >-
          {{ (_masworld_existing_htpasswd_secret.resources[0].data.htpasswd | default(''))
             | b64decode | default('') }}
      when: _masworld_existing_htpasswd_secret.resources | length > 0
      no_log: true

    - name: Initialize empty htpasswd if secret does not exist
      ansible.builtin.set_fact:
        _masworld_existing_htpasswd: ""
      when: _masworld_existing_htpasswd_secret.resources | length == 0

    - name: Remove existing entry for this user if present
      ansible.builtin.set_fact:
        _masworld_cleaned_htpasswd: >-
          {{ _masworld_existing_htpasswd | regex_replace('^' + _masworld_student_username + ':.*\n?', '', multiline=True) }}
      no_log: true

    - name: Append new htpasswd entry
      ansible.builtin.set_fact:
        _masworld_updated_htpasswd: >-
          {{ (_masworld_cleaned_htpasswd | trim + '\n' + _masworld_htpasswd_entry.stdout | trim) | trim }}
      no_log: true

    - name: Create or update htpasswd secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ masworld_htpasswd_secret_name }}"
            namespace: "{{ masworld_htpasswd_secret_namespace }}"
          type: Opaque
          stringData:
            htpasswd: "{{ _masworld_updated_htpasswd }}"
      no_log: true

    # ── Patch OAuth CR ──────────────────────────────────────────────────
    - name: Read current OAuth CR
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: OAuth
        name: "{{ masworld_oauth_cr_name }}"
      register: _masworld_oauth_cr

    - name: Check if htpasswd IdP already configured
      ansible.builtin.set_fact:
        _masworld_htpasswd_idp_exists: >-
          {{ _masworld_oauth_cr.resources[0].spec.identityProviders | default([])
             | selectattr('name', 'equalto', masworld_htpasswd_idp_name)
             | list | length > 0 }}

    - name: Patch OAuth CR to add htpasswd identity provider
      kubernetes.core.k8s:
        state: present
        merge_type: merge
        definition:
          apiVersion: config.openshift.io/v1
          kind: OAuth
          metadata:
            name: "{{ masworld_oauth_cr_name }}"
          spec:
            identityProviders: >-
              {{ (_masworld_oauth_cr.resources[0].spec.identityProviders | default([])) + [{
                   'name': masworld_htpasswd_idp_name,
                   'mappingMethod': 'claim',
                   'type': 'HTPasswd',
                   'htpasswd': {
                     'fileData': {
                       'name': masworld_htpasswd_secret_name
                     }
                   }
                 }]
              }}
      when: not (_masworld_htpasswd_idp_exists | bool)

    # ── Create Student Namespace ────────────────────────────────────────
    - name: Create student namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ _masworld_student_namespace }}"
            labels:
              masworld.redhat.com/component: student
              masworld.redhat.com/seat-number: "{{ masworld_seat_number | string }}"

    # ── Create RoleBinding in Student Namespace ─────────────────────────
    - name: Create RoleBinding for student in their namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: "{{ _masworld_student_username }}-admin"
            namespace: "{{ _masworld_student_namespace }}"
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: admin
          subjects:
            - apiGroup: rbac.authorization.k8s.io
              kind: User
              name: "{{ _masworld_student_username }}"

    # ── Create ClusterRoleBinding ───────────────────────────────────────
    - name: Create ClusterRoleBinding for basic-user
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: "{{ _masworld_student_username }}-{{ masworld_student_cluster_role }}"
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: "{{ masworld_student_cluster_role }}"
          subjects:
            - apiGroup: rbac.authorization.k8s.io
              kind: User
              name: "{{ _masworld_student_username }}"

    # ── Validate Namespace Isolation ────────────────────────────────────
    - name: Verify student cannot access other namespaces (validation)
      kubernetes.core.k8s_info:
        api_version: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        label_selectors: []
      register: _masworld_crb_check

    - name: Assert student has no cluster-admin binding
      ansible.builtin.assert:
        that:
          - _masworld_crb_check.resources
            | selectattr('roleRef.name', 'equalto', 'cluster-admin')
            | map(attribute='subjects')
            | flatten
            | selectattr('name', 'defined')
            | selectattr('name', 'equalto', _masworld_student_username)
            | list | length == 0
        fail_msg: >-
          Student {{ _masworld_student_username }} has cluster-admin binding — this is a security violation.
        quiet: true

    # ── Set Success Facts ───────────────────────────────────────────────
    - name: Set student accounts created facts
      ansible.builtin.set_fact:
        student_accounts_created: true
        student_credentials: >-
          {{ (student_credentials | default([])) + [{
               'seat_number': masworld_seat_number | int,
               'username': _masworld_student_username,
               'namespace': _masworld_student_namespace,
               'password': _masworld_student_password
             }]
          }}
      no_log: true

    - name: Report student account created
      ansible.builtin.debug:
        msg: "Student account {{ _masworld_student_username }} created with namespace {{ _masworld_student_namespace }}."

  rescue:
    - name: Set student accounts failed facts
      ansible.builtin.set_fact:
        student_accounts_created: false
        student_credentials: []

    - name: Report student accounts failure
      ansible.builtin.fail:
        msg: >-
          Student account creation failed for seat {{ masworld_seat_number }}:
          {{ ansible_failed_result.msg | default('unknown error') }}.
