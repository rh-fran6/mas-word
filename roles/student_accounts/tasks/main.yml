---
# Student Accounts: create per-seat accounts with RBAC
- name: Create student accounts
  block:
    # ── Resolve Seat-Specific Values ────────────────────────────────────
    - name: Resolve student username
      ansible.builtin.set_fact:
        _masworld_student_username: "user{{ masworld_seat_number | pad(2) }}"

    - name: Resolve student namespace
      ansible.builtin.set_fact:
        _masworld_student_namespace: "student-{{ masworld_seat_number | pad(2) }}"

    # ── Generate Student Password ───────────────────────────────────────
    - name: Generate student password
      ansible.builtin.set_fact:
        _masworld_student_password: >-
          {{ lookup('ansible.builtin.password',
                    '/dev/null length=' + (masworld_student_password_length | string)
                    + ' chars=ascii_letters,digits') }}
      no_log: true
      when: not (masworld_student_allow_shared_password | bool)

    - name: Use shared password if allowed
      ansible.builtin.set_fact:
        _masworld_student_password: >-
          {{ lookup('ansible.builtin.password',
                    '/tmp/.masworld_shared_password length=' + (masworld_student_password_length | string)
                    + ' chars=ascii_letters,digits') }}
      no_log: true
      when: masworld_student_allow_shared_password | bool

    # ── Create htpasswd Entry ───────────────────────────────────────────
    - name: Generate htpasswd hash for student
      ansible.builtin.command:
        cmd: >-
          htpasswd -nbB {{ _masworld_student_username }} {{ _masworld_student_password }}
      register: _masworld_htpasswd_entry
      changed_when: false
      no_log: true

    # ── Ensure htpasswd secret exists ───────────────────────────────────
    - name: Check if htpasswd secret already exists
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ masworld_htpasswd_secret_name }}"
        namespace: "{{ masworld_htpasswd_secret_namespace }}"
      register: _masworld_existing_htpasswd_secret

    - name: Read existing htpasswd data
      ansible.builtin.set_fact:
        _masworld_existing_htpasswd: >-
          {{ (_masworld_existing_htpasswd_secret.resources[0].data.htpasswd | default(''))
             | b64decode | default('') }}
      when: _masworld_existing_htpasswd_secret.resources | length > 0
      no_log: true

    - name: Initialize empty htpasswd if secret does not exist
      ansible.builtin.set_fact:
        _masworld_existing_htpasswd: ""
      when: _masworld_existing_htpasswd_secret.resources | length == 0

    - name: Remove existing entry for this user if present
      ansible.builtin.set_fact:
        _masworld_cleaned_htpasswd: >-
          {{ _masworld_existing_htpasswd | regex_replace('^' + _masworld_student_username + ':.*\n?', '', multiline=True) }}
      no_log: true

    - name: Append new htpasswd entry
      ansible.builtin.set_fact:
        _masworld_updated_htpasswd: >-
          {{ (_masworld_cleaned_htpasswd | trim + '\n' + _masworld_htpasswd_entry.stdout | trim) | trim }}
      no_log: true

    - name: Create or update htpasswd secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ masworld_htpasswd_secret_name }}"
            namespace: "{{ masworld_htpasswd_secret_namespace }}"
          type: Opaque
          stringData:
            htpasswd: "{{ _masworld_updated_htpasswd }}"
      no_log: true

    # ── Detect ROSA Hosted Control Plane ──────────────────────────────
    - name: Check cluster control plane topology
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: Infrastructure
        name: cluster
      register: _masworld_sa_infra_cr

    - name: Set HCP detection flag for student accounts
      ansible.builtin.set_fact:
        _masworld_sa_is_hcp: >-
          {{ (_masworld_sa_infra_cr.resources | default([{}]) | first)
             .status.controlPlaneTopology | default('') == 'External' }}

    # ── ROSA HCP path: add htpasswd IDP via rosa CLI ──────────────────
    - name: Add htpasswd IDP via ROSA CLI (HCP clusters)
      when: _masworld_sa_is_hcp | bool
      block:
        - name: Extract ROSA cluster name from API URL
          ansible.builtin.set_fact:
            _masworld_sa_rosa_cluster_name: >-
              {{ masworld_cluster_api_url | regex_search('api\.([^.]+)\.', '\1') | first }}

        - name: Get ROSA token from bastion host
          ansible.builtin.command:
            cmd: >-
              sshpass -p '{{ cluster.bastion_password }}'
              ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o BatchMode=no
              {{ cluster.bastion_username }}@{{ cluster.bastion_host }}
              'rosa token'
          register: _masworld_sa_rosa_token
          retries: 3
          delay: 10
          until: _masworld_sa_rosa_token.rc == 0 and (_masworld_sa_rosa_token.stdout | default('') | trim | length > 0)
          changed_when: false
          no_log: true

        - name: Login to ROSA for student accounts
          ansible.builtin.command:
            cmd: "rosa login --token={{ _masworld_sa_rosa_token.stdout | trim }}"
          environment:
            OCM_CONFIG: "/tmp/rosa-ocm-sa-{{ masworld_cluster_id | default(cluster.id) }}.json"
          register: _masworld_sa_rosa_login
          retries: 3
          delay: 10
          until: _masworld_sa_rosa_login is not failed
          changed_when: false
          no_log: true

        - name: List existing ROSA identity providers
          ansible.builtin.command:
            cmd: "rosa list idp --cluster={{ _masworld_sa_rosa_cluster_name }} --output=json"
          environment:
            OCM_CONFIG: "/tmp/rosa-ocm-sa-{{ masworld_cluster_id | default(cluster.id) }}.json"
            AWS_ACCESS_KEY_ID: "{{ cluster.aws_access_key_id }}"
            AWS_SECRET_ACCESS_KEY: "{{ cluster.aws_secret_access_key }}"
            AWS_DEFAULT_REGION: "{{ cluster.aws_region | default('us-east-2') }}"
          register: _masworld_sa_rosa_idps
          retries: 3
          delay: 10
          until: _masworld_sa_rosa_idps is not failed
          changed_when: false
          no_log: true

        - name: Check if htpasswd IDP already exists in ROSA
          ansible.builtin.set_fact:
            _masworld_sa_rosa_htpasswd_exists: >-
              {{ (_masworld_sa_rosa_idps.stdout | default('[]') | from_json)
                 | selectattr('name', 'equalto', masworld_htpasswd_idp_name)
                 | list | length > 0 }}

        - name: Create htpasswd identity provider via ROSA
          ansible.builtin.command:
            cmd: >-
              rosa create idp
              --cluster={{ _masworld_sa_rosa_cluster_name }}
              --type=htpasswd
              --name={{ masworld_htpasswd_idp_name }}
              --username={{ _masworld_student_username }}
              --password={{ _masworld_student_password }}
              --yes
          environment:
            OCM_CONFIG: "/tmp/rosa-ocm-sa-{{ masworld_cluster_id | default(cluster.id) }}.json"
            AWS_ACCESS_KEY_ID: "{{ cluster.aws_access_key_id }}"
            AWS_SECRET_ACCESS_KEY: "{{ cluster.aws_secret_access_key }}"
            AWS_DEFAULT_REGION: "{{ cluster.aws_region | default('us-east-2') }}"
          register: _masworld_sa_rosa_htpasswd_create
          retries: 3
          delay: 15
          until: _masworld_sa_rosa_htpasswd_create is not failed
          when: not (_masworld_sa_rosa_htpasswd_exists | bool)
          no_log: true

        - name: Display ROSA htpasswd IDP result
          ansible.builtin.debug:
            msg: >-
              {{ 'htpasswd IDP already exists — skipped'
                 if (_masworld_sa_rosa_htpasswd_exists | bool)
                 else 'Created htpasswd IDP with user ' ~ _masworld_student_username ~ ' via ROSA CLI' }}

    # ── Non-HCP path: patch OAuth CR directly ──────────────────────────
    - name: Add htpasswd IDP via OAuth CR (non-HCP clusters)
      when: not (_masworld_sa_is_hcp | bool)
      block:
        - name: Read current OAuth CR
          kubernetes.core.k8s_info:
            api_version: config.openshift.io/v1
            kind: OAuth
            name: "{{ masworld_oauth_cr_name }}"
          register: _masworld_oauth_cr

        - name: Check if htpasswd IdP already configured
          ansible.builtin.set_fact:
            _masworld_htpasswd_idp_exists: >-
              {{ _masworld_oauth_cr.resources[0].spec.identityProviders | default([])
                 | selectattr('name', 'equalto', masworld_htpasswd_idp_name)
                 | list | length > 0 }}

        - name: Patch OAuth CR to add htpasswd identity provider
          kubernetes.core.k8s:
            state: present
            merge_type: merge
            definition:
              apiVersion: config.openshift.io/v1
              kind: OAuth
              metadata:
                name: "{{ masworld_oauth_cr_name }}"
              spec:
                identityProviders: >-
                  {{ (_masworld_oauth_cr.resources[0].spec.identityProviders | default([])) + [{
                       'name': masworld_htpasswd_idp_name,
                       'mappingMethod': 'claim',
                       'type': 'HTPasswd',
                       'htpasswd': {
                         'fileData': {
                           'name': masworld_htpasswd_secret_name
                         }
                       }
                     }]
                  }}
          when: not (_masworld_htpasswd_idp_exists | bool)

    # ── Create Student Namespace ────────────────────────────────────────
    - name: Create student namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ _masworld_student_namespace }}"
            labels:
              masworld.redhat.com/component: student
              masworld.redhat.com/seat-number: "{{ masworld_seat_number | string }}"

    # ── Create RoleBinding in Student Namespace ─────────────────────────
    - name: Create RoleBinding for student in their namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: "{{ _masworld_student_username }}-admin"
            namespace: "{{ _masworld_student_namespace }}"
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: admin
          subjects:
            - apiGroup: rbac.authorization.k8s.io
              kind: User
              name: "{{ _masworld_student_username }}"

    # ── Create ClusterRoleBinding ───────────────────────────────────────
    - name: Create ClusterRoleBinding for basic-user
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: "{{ _masworld_student_username }}-{{ masworld_student_cluster_role }}"
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: "{{ masworld_student_cluster_role }}"
          subjects:
            - apiGroup: rbac.authorization.k8s.io
              kind: User
              name: "{{ _masworld_student_username }}"

    # ── Exercise RBAC: match lab user permissions ─────────────────────
    - name: Create ClusterRoleBinding for lab operator ClusterRole
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: "{{ _masworld_student_username }}-{{ masworld_lab_clusterrole_name | default('masworld-lab-operator') }}"
            labels:
              masworld.redhat.com/component: student-accounts
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: "{{ masworld_lab_clusterrole_name | default('masworld-lab-operator') }}"
          subjects:
            - apiGroup: rbac.authorization.k8s.io
              kind: User
              name: "{{ _masworld_student_username }}"

    - name: Create RoleBindings for student in operator namespaces
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: "{{ _masworld_student_username }}-ns-admin"
            namespace: "{{ item }}"
            labels:
              masworld.redhat.com/component: student-accounts
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: "{{ masworld_lab_clusterrole_name | default('masworld-lab-operator') }}-ns-admin"
          subjects:
            - apiGroup: rbac.authorization.k8s.io
              kind: User
              name: "{{ _masworld_student_username }}"
      loop:
        - openshift-logging
        - openshift-operators
        - openshift-operators-redhat
        - group-sync-operator
        - "mas-{{ masworld_mas_instance_id | default('inst1') }}-manage"
        - "{{ masworld_keycloak_namespace | default('masworld-keycloak') }}"
      failed_when: false

    # ── Validate Namespace Isolation ────────────────────────────────────
    - name: Verify student cannot access other namespaces (validation)
      kubernetes.core.k8s_info:
        api_version: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        label_selectors: []
      register: _masworld_crb_check

    - name: Assert student has no cluster-admin binding
      ansible.builtin.assert:
        that:
          - _masworld_crb_check.resources
            | selectattr('roleRef.name', 'equalto', 'cluster-admin')
            | map(attribute='subjects')
            | flatten
            | selectattr('name', 'defined')
            | selectattr('name', 'equalto', _masworld_student_username)
            | list | length == 0
        fail_msg: >-
          Student {{ _masworld_student_username }} has cluster-admin binding — this is a security violation.
        quiet: true

    # ── Set Success Facts ───────────────────────────────────────────────
    - name: Set student accounts created facts
      ansible.builtin.set_fact:
        student_accounts_created: true
        student_credentials: >-
          {{ (student_credentials | default([])) + [{
               'seat_number': masworld_seat_number | int,
               'username': _masworld_student_username,
               'namespace': _masworld_student_namespace,
               'password': _masworld_student_password
             }]
          }}
      no_log: true

    - name: Report student account created
      ansible.builtin.debug:
        msg: "Student account {{ _masworld_student_username }} created with namespace {{ _masworld_student_namespace }}."

  rescue:
    - name: Set student accounts failed facts
      ansible.builtin.set_fact:
        student_accounts_created: false
        student_credentials: []

    - name: Report student accounts failure
      ansible.builtin.fail:
        msg: >-
          Student account creation failed for seat {{ masworld_seat_number }}:
          {{ ansible_failed_result.msg | default('unknown error') }}.
