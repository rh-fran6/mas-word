---
# cluster_preflight defaults
# Minimum cluster requirements for MAS World 2026 workshop.

# Minimum number of schedulable worker nodes
masworld_preflight_min_workers: 3

# Minimum total allocatable CPU cores across all workers
masworld_preflight_min_cpu: 16

# Minimum total allocatable memory in GiB across all workers
masworld_preflight_min_memory_gi: 64

# Required StorageClass for persistent volumes
masworld_preflight_required_storage_class: "gp3-csi"

# Whether to verify connectivity to the IBM container registry
masworld_preflight_check_ibm_registry: true

# IBM container registry hostname
masworld_preflight_ibm_registry_host: "cp.icr.io"

# Timeout in seconds for registry connectivity check
masworld_preflight_registry_timeout: 30

# Timeout in seconds for API reachability check
masworld_preflight_api_timeout: 30

# Timeout in seconds for operator readiness
masworld_preflight_operator_timeout: 60
