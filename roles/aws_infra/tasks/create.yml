---
- name: Include build_definitions
  ansible.builtin.include_tasks: build_definitions.yml

- name: Initialize infrastructure state collector
  ansible.builtin.set_fact:
    infra_state_collector: {}

- name: Create AWS infrastructure per account
  ansible.builtin.include_tasks: create_account_infra.yml
  loop: "{{ cluster_definitions }}"
  loop_control:
    loop_var: cluster_item
    label: "{{ cluster_item.name }}"

- name: Write infrastructure state file
  ansible.builtin.copy:
    content: |
      ---
      # Auto-generated by 'make setup-infra'. Do not edit manually.
      # Re-run 'make setup-infra' to regenerate.
      {{ {'infra_state': infra_state_collector} | to_nice_yaml(indent=2) }}
    dest: "{{ aws_infra_state_file }}"
    mode: "0644"

- name: Infrastructure provisioning complete
  ansible.builtin.debug:
    msg: >-
      Created infrastructure for {{ cluster_definitions | length }} accounts.
      State saved to {{ aws_infra_state_file }}.
