---
# acm_hub: Install ACM operator and deploy MultiClusterHub on the hub cluster.
# Idempotent: checks for existing MultiClusterHub before acting.
# Should only run against the hub cluster (purpose == 'hub').

- name: ACM Hub — Resolve operator channel from components config
  ansible.builtin.set_fact:
    _acm_channel: >-
      {{ 'release-' ~ masworld_components.components.acm.version
         if (masworld_components is defined and
             masworld_components.components is defined and
             masworld_components.components.acm is defined and
             masworld_components.components.acm.version is defined)
         else masworld_acm_operator_channel }}

- name: ACM Hub — Display subscription parameters
  ansible.builtin.debug:
    msg: >-
      ACM operator: channel={{ _acm_channel }},
      source={{ masworld_acm_operator_source }},
      namespace={{ masworld_acm_namespace }}

- name: ACM Hub — Install and configure
  block:
    - name: Check if MultiClusterHub already exists
      kubernetes.core.k8s_info:
        api_version: operator.open-cluster-management.io/v1
        kind: MultiClusterHub
        namespace: "{{ masworld_acm_namespace }}"
      register: _acm_mch_existing
      ignore_errors: true

    - name: Install ACM operator
      when: _acm_mch_existing.resources | default([]) | length == 0
      block:
        - name: Create open-cluster-management namespace
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: "{{ masworld_acm_namespace }}"

        - name: Create OperatorGroup for ACM
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: operators.coreos.com/v1
              kind: OperatorGroup
              metadata:
                name: open-cluster-management
                namespace: "{{ masworld_acm_namespace }}"
              spec:
                targetNamespaces:
                  - "{{ masworld_acm_namespace }}"

        - name: Create ACM operator Subscription
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: operators.coreos.com/v1alpha1
              kind: Subscription
              metadata:
                name: advanced-cluster-management
                namespace: "{{ masworld_acm_namespace }}"
              spec:
                channel: "{{ _acm_channel }}"
                installPlanApproval: Automatic
                name: advanced-cluster-management
                source: "{{ masworld_acm_operator_source }}"
                sourceNamespace: "{{ masworld_acm_operator_source_namespace }}"

        - name: Check Subscription health before waiting for operator
          kubernetes.core.k8s_info:
            api_version: operators.coreos.com/v1alpha1
            kind: Subscription
            name: advanced-cluster-management
            namespace: "{{ masworld_acm_namespace }}"
          register: _acm_sub_check
          retries: 10
          delay: 15
          until:
            - _acm_sub_check.resources | length > 0
            - _acm_sub_check.resources[0].status is defined
            - _acm_sub_check.resources[0].status.installedCSV is defined
              or (_acm_sub_check.resources[0].status.conditions | default([])
                  | selectattr('type', 'equalto', 'CatalogSourcesUnhealthy')
                  | selectattr('status', 'equalto', 'True') | list | length > 0)

        - name: Fail early if CatalogSource is unhealthy
          ansible.builtin.fail:
            msg: >-
              ACM Subscription failed — CatalogSource '{{ masworld_acm_operator_source }}'
              in '{{ masworld_acm_operator_source_namespace }}' may not contain the
              'advanced-cluster-management' package or channel '{{ _acm_channel }}'.
              Subscription status: {{ _acm_sub_check.resources[0].status | default({}) | to_nice_yaml }}
          when:
            - _acm_sub_check.resources | length > 0
            - _acm_sub_check.resources[0].status.installedCSV is not defined
            - (_acm_sub_check.resources[0].status.conditions | default([])
               | selectattr('type', 'equalto', 'CatalogSourcesUnhealthy')
               | selectattr('status', 'equalto', 'True') | list | length > 0)

        - name: Capture installed CSV name
          ansible.builtin.set_fact:
            _acm_installed_csv: "{{ _acm_sub_check.resources[0].status.installedCSV }}"
          when:
            - _acm_sub_check.resources | length > 0
            - _acm_sub_check.resources[0].status.installedCSV is defined

        - name: Display installed CSV
          ansible.builtin.debug:
            msg: "ACM Subscription resolved: {{ _acm_installed_csv | default('pending') }}"

        - name: Wait for ACM ClusterServiceVersion to succeed
          kubernetes.core.k8s_info:
            api_version: operators.coreos.com/v1alpha1
            kind: ClusterServiceVersion
            name: "{{ _acm_installed_csv }}"
            namespace: "{{ masworld_acm_namespace }}"
          register: _acm_csv_status
          until:
            - _acm_csv_status.resources | length > 0
            - _acm_csv_status.resources[0].status.phase | default('') == 'Succeeded'
          retries: 40
          delay: 15
          when: _acm_installed_csv is defined

    - name: Create MultiClusterHub
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operator.open-cluster-management.io/v1
          kind: MultiClusterHub
          metadata:
            name: multiclusterhub
            namespace: "{{ masworld_acm_namespace }}"
          spec:
            availabilityConfig: High

    - name: Wait for MultiClusterHub to be Running
      kubernetes.core.k8s_info:
        api_version: operator.open-cluster-management.io/v1
        kind: MultiClusterHub
        name: multiclusterhub
        namespace: "{{ masworld_acm_namespace }}"
      register: _acm_mch_status
      until:
        - _acm_mch_status.resources | length > 0
        - _acm_mch_status.resources[0].status.phase | default('') == 'Running'
      retries: "{{ masworld_acm_hub_ready_retries }}"
      delay: "{{ masworld_acm_hub_ready_delay }}"

    - name: Set ACM hub ready fact
      ansible.builtin.set_fact:
        acm_hub_ready: true

    - name: Report ACM hub success
      ansible.builtin.debug:
        msg: "ACM MultiClusterHub is Running in {{ masworld_acm_namespace }}"

  rescue:
    - name: Diagnose ACM Subscription state
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: Subscription
        name: advanced-cluster-management
        namespace: "{{ masworld_acm_namespace }}"
      register: _acm_sub_diag
      ignore_errors: true

    - name: Diagnose InstallPlan state
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: InstallPlan
        namespace: "{{ masworld_acm_namespace }}"
      register: _acm_ip_diag
      ignore_errors: true

    - name: Display diagnostic information
      ansible.builtin.debug:
        msg: |
          ACM Hub installation failed. Diagnostics:

          Subscription status:
          {{ (_acm_sub_diag.resources[0].status | default({}) | to_nice_yaml) if (_acm_sub_diag.resources | default([]) | length > 0) else 'No subscription found' }}

          InstallPlan count: {{ _acm_ip_diag.resources | default([]) | length }}
          {% for ip in _acm_ip_diag.resources | default([]) %}
          InstallPlan {{ ip.metadata.name }}: phase={{ ip.status.phase | default('unknown') }}
          {% endfor %}

          Configuration used:
            channel: {{ _acm_channel }}
            source: {{ masworld_acm_operator_source }}
            sourceNamespace: {{ masworld_acm_operator_source_namespace }}

          Common causes:
            - CatalogSource does not contain the package (must be 'redhat-operators')
            - Channel does not exist for target OCP version
            - InstallPlan approval stuck or failed
            - Cluster pull-secret missing Red Hat registry credentials

    - name: Set ACM hub failure fact
      ansible.builtin.set_fact:
        acm_hub_ready: false

    - name: Re-raise failure (strict mode)
      ansible.builtin.fail:
        msg: >-
          ACM hub installation failed: {{ ansible_failed_result.msg | default('unknown error') }}.
          Check MultiClusterHub status in namespace {{ masworld_acm_namespace }}.
      when: masworld_acm_hub_strict | default(true) | bool
