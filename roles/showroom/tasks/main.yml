---
# Showroom: deploy workshop guide via Helm
- name: Deploy Showroom
  block:
    # ── Create Showroom Namespace ───────────────────────────────────────
    - name: Create Showroom namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ masworld_showroom_namespace }}"
            labels:
              masworld.redhat.com/component: showroom

    # ── Gather Cluster-Specific Variables ───────────────────────────────
    - name: Get OpenShift console URL
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: Console
        name: cluster
      register: _masworld_console_cr

    - name: Set console URL fact
      ansible.builtin.set_fact:
        _masworld_console_url: >-
          {{ _masworld_console_cr.resources[0].status.consoleURL | default('') }}

    - name: Get cluster ingress domain
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: Ingress
        name: cluster
      register: _masworld_ingress_cr

    - name: Set cluster domain fact
      ansible.builtin.set_fact:
        _masworld_cluster_domain: >-
          {{ _masworld_ingress_cr.resources[0].spec.domain | default('') }}

    - name: Get cluster API URL
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: Infrastructure
        name: cluster
      register: _masworld_infra_cr

    - name: Set API URL fact
      ansible.builtin.set_fact:
        _masworld_api_url: >-
          {{ _masworld_infra_cr.resources[0].status.apiServerURL | default('') }}

    # ── Resolve MAS and Manage URLs ───────────────────────────────────
    - name: Get MAS home route
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        namespace: "mas-{{ masworld_mas_instance_id }}-core"
        name: "{{ masworld_mas_instance_id }}-{{ masworld_mas_workspace_id | default('masworld') }}-home"
      register: _masworld_mas_home_route
      failed_when: false

    - name: Set MAS URL fact
      ansible.builtin.set_fact:
        _masworld_mas_url: >-
          {{ 'https://' ~ _masworld_mas_home_route.resources[0].spec.host
             if (_masworld_mas_home_route.resources | default([]) | length > 0)
             else 'https://' ~ (masworld_mas_workspace_id | default('masworld')) ~ '.home.' ~ masworld_mas_instance_id ~ '.' ~ _masworld_cluster_domain }}

    - name: Get Manage route
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        namespace: "mas-{{ masworld_mas_instance_id }}-manage"
        name: "{{ masworld_mas_instance_id }}-manage-{{ masworld_mas_workspace_id | default('masworld') }}"
      register: _masworld_manage_route
      failed_when: false

    - name: Set Manage URL fact
      ansible.builtin.set_fact:
        _masworld_manage_url: >-
          {{ 'https://' ~ _masworld_manage_route.resources[0].spec.host
             if (_masworld_manage_route.resources | default([]) | length > 0)
             else 'https://' ~ (masworld_mas_workspace_id | default('masworld')) ~ '.manage.' ~ masworld_mas_instance_id ~ '.' ~ _masworld_cluster_domain }}

    # ── Gather Lab Credentials ─────────────────────────────────────────
    - name: Read S3 credentials ConfigMap
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        name: masworld-lab-s3-credentials
        namespace: "{{ masworld_showroom_namespace }}"
      register: _masworld_s3_creds_cm
      failed_when: false

    - name: Set S3 credential facts for Showroom
      ansible.builtin.set_fact:
        _masworld_s3_bucket_name: "{{ _masworld_s3_creds_cm.resources[0].data.bucket_name | default('') }}"
        _masworld_s3_access_key: "{{ _masworld_s3_creds_cm.resources[0].data.aws_access_key_id | default('') }}"
        _masworld_s3_secret_key: "{{ _masworld_s3_creds_cm.resources[0].data.aws_secret_access_key | default('') }}"
        _masworld_s3_region: "{{ _masworld_s3_creds_cm.resources[0].data.aws_region | default('') }}"
      when: _masworld_s3_creds_cm.resources | default([]) | length > 0
      no_log: true

    - name: Set empty S3 facts when ConfigMap not found
      ansible.builtin.set_fact:
        _masworld_s3_bucket_name: ""
        _masworld_s3_access_key: ""
        _masworld_s3_secret_key: ""
        _masworld_s3_region: ""
      when: _masworld_s3_creds_cm.resources | default([]) | length == 0

    - name: Read lab-credentials Secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: masworld-lab-credentials
        namespace: "{{ masworld_showroom_namespace }}"
      register: _masworld_lab_creds_secret
      failed_when: false

    - name: Set lab password fact for Showroom
      ansible.builtin.set_fact:
        _masworld_lab_password: >-
          {{ (_masworld_lab_creds_secret.resources[0].data.password | default(''))
             | b64decode }}
      when: _masworld_lab_creds_secret.resources | default([]) | length > 0
      no_log: true

    - name: Set empty lab password when Secret not found
      ansible.builtin.set_fact:
        _masworld_lab_password: ""
      when: _masworld_lab_creds_secret.resources | default([]) | length == 0

    # ── Deploy Showroom via local Helm chart ──────────────────────────────
    - name: Create chart copies directory
      ansible.builtin.file:
        path: "{{ masworld_showroom_chart_local_dir }}/.copies"
        state: directory
        mode: "0755"

    - name: Copy Helm chart for this cluster
      ansible.builtin.copy:
        src: "{{ masworld_showroom_chart_local_dir }}/{{ masworld_showroom_chart_name }}-{{ masworld_showroom_chart_version | regex_replace('^v', '') }}.tgz"
        dest: "{{ masworld_showroom_chart_local_dir }}/.copies/{{ masworld_showroom_chart_name }}-{{ masworld_cluster_id | default(inventory_hostname) }}.tgz"
        remote_src: true
        mode: "0644"

    - name: Check existing Showroom Helm release status
      ansible.builtin.command:
        cmd: >-
          helm status showroom
          --namespace {{ masworld_showroom_namespace }}
          --output json
          --burst-limit 300 --qps 50
      environment:
        KUBECONFIG: "/tmp/kubeconfig-{{ masworld_cluster_id | default(inventory_hostname) }}"
      register: _masworld_showroom_status_check
      changed_when: false
      failed_when: false
      no_log: true

    - name: Set release status fact
      ansible.builtin.set_fact:
        _masworld_showroom_release_status: >-
          {{ (_masworld_showroom_status_check.stdout | default('{}') | from_json).info.status | default('') }}
      when: _masworld_showroom_status_check.rc == 0

    - name: Uninstall stale Showroom release
      ansible.builtin.command:
        cmd: >-
          helm uninstall showroom
          --namespace {{ masworld_showroom_namespace }}
          --wait --timeout 120s
          --burst-limit 300 --qps 50
      environment:
        KUBECONFIG: "/tmp/kubeconfig-{{ masworld_cluster_id | default(inventory_hostname) }}"
      when: _masworld_showroom_release_status | default('') in ['failed', 'pending-upgrade', 'pending-install']
      failed_when: false

    - name: Delete orphaned terminal PVC from previous failed release
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: PersistentVolumeClaim
        name: showroom-terminal-lab-user-home
        namespace: "{{ masworld_showroom_namespace }}"
        wait: true
        wait_timeout: 60
      when: _masworld_showroom_release_status | default('') in ['failed', 'pending-upgrade', 'pending-install']
      failed_when: false

    - name: Stagger Helm deploy to avoid rate limiting
      ansible.builtin.wait_for:
        timeout: "{{ (masworld_seat_number | default(0) | int) * 15 }}"
      changed_when: false

    - name: Write Showroom Helm values file
      ansible.builtin.copy:
        content: |
          deployer:
            domain: "{{ _masworld_cluster_domain }}"
          guid: "{{ masworld_seat_number }}"
          user: "{{ masworld_student_username }}"
          content:
            repoUrl: "{{ masworld_showroom_content_repo }}"
            repoRef: "{{ masworld_showroom_content_ref }}"
            antoraPlaybook: "{{ masworld_showroom_antora_playbook }}"
            user_data: |
              openshift_console_url: {{ _masworld_console_url }}
              openshift_cluster_ingress_domain: {{ _masworld_cluster_domain }}
              openshift_api_url: {{ _masworld_api_url | default(masworld_cluster_api_url | default('')) }}
              mas_url: {{ _masworld_mas_url }}
              manage_url: {{ _masworld_manage_url }}
              seat_number: {{ masworld_seat_number }}
              user: {{ masworld_student_username }}
              student_username: {{ masworld_student_username }}
              mas_instance_id: {{ masworld_mas_instance_id }}
              s3_bucket_name: {{ _masworld_s3_bucket_name | default('') }}
              s3_aws_access_key_id: {{ _masworld_s3_access_key | default('') }}
              s3_aws_secret_access_key: {{ _masworld_s3_secret_key | default('') }}
              s3_aws_region: {{ _masworld_s3_region | default('') }}
              lab_username: {{ masworld_lab_username_prefix | default('lab-seat-') }}{{ '%02d' | format(masworld_seat_number | int) }}
              lab_password: {{ _masworld_lab_password | default('') }}
              s3_region: {{ _masworld_s3_region | default('') }}
              s3_access_key_id: {{ _masworld_s3_access_key | default('') }}
              s3_secret_access_key: {{ _masworld_s3_secret_key | default('') }}
          terminal:
            setup: "false"
            storage:
              setup: "false"
          wetty:
            setup: "false"
        dest: "/tmp/showroom-values-{{ masworld_cluster_id | default(inventory_hostname) }}.yaml"
        mode: "0600"
      no_log: true

    - name: Deploy Showroom via Helm chart
      ansible.builtin.command:
        cmd: >-
          helm upgrade --install showroom
          {{ masworld_showroom_chart_local_dir }}/.copies/{{ masworld_showroom_chart_name }}-{{ masworld_cluster_id | default(inventory_hostname) }}.tgz
          --namespace {{ masworld_showroom_namespace }}
          --values /tmp/showroom-values-{{ masworld_cluster_id | default(inventory_hostname) }}.yaml
          --wait --timeout 300s
          --burst-limit 300 --qps 50
      environment:
        KUBECONFIG: "/tmp/kubeconfig-{{ masworld_cluster_id | default(inventory_hostname) }}"
      register: _masworld_showroom_helm
      retries: 5
      delay: 60
      until: _masworld_showroom_helm is not failed

    - name: Remove Showroom values file
      ansible.builtin.file:
        path: "/tmp/showroom-values-{{ masworld_cluster_id | default(inventory_hostname) }}.yaml"
        state: absent

    - name: Remove per-cluster chart copy
      ansible.builtin.file:
        path: "{{ masworld_showroom_chart_local_dir }}/.copies/{{ masworld_showroom_chart_name }}-{{ masworld_cluster_id | default(inventory_hostname) }}.tgz"
        state: absent

    # ── Wait for Showroom Pod Ready ─────────────────────────────────────
    - name: Wait for Showroom pod to be ready
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ masworld_showroom_namespace }}"
        label_selectors:
          - "app.kubernetes.io/name=showroom"
      register: _masworld_showroom_pods
      until:
        - _masworld_showroom_pods.resources | length > 0
        - _masworld_showroom_pods.resources
          | selectattr('status.phase', 'equalto', 'Running')
          | list | length > 0
      retries: "{{ masworld_showroom_ready_retries }}"
      delay: "{{ masworld_showroom_ready_delay }}"

    # ── Get Showroom Route URL ──────────────────────────────────────────
    - name: Get Showroom route
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        namespace: "{{ masworld_showroom_namespace }}"
        label_selectors:
          - "app.kubernetes.io/name=showroom"
      register: _masworld_showroom_route

    - name: Set Showroom URL from route
      ansible.builtin.set_fact:
        showroom_url: >-
          https://{{ (_masworld_showroom_route.resources | first).spec.host }}
      when: _masworld_showroom_route.resources | length > 0

    - name: Set fallback Showroom URL
      ansible.builtin.set_fact:
        showroom_url: "https://showroom.{{ _masworld_cluster_domain }}"
      when: _masworld_showroom_route.resources | length == 0

    # ── Set Success Facts ───────────────────────────────────────────────
    - name: Set Showroom ready facts
      ansible.builtin.set_fact:
        showroom_ready: true

    - name: Report Showroom success
      ansible.builtin.debug:
        msg: "Showroom deployed successfully. URL: {{ showroom_url }}"

  rescue:
    - name: Remove per-cluster chart copy on failure
      ansible.builtin.file:
        path: "{{ masworld_showroom_chart_local_dir }}/.copies/{{ masworld_showroom_chart_name }}-{{ masworld_cluster_id | default(inventory_hostname) }}.tgz"
        state: absent
      ignore_errors: true

    - name: Set Showroom failed facts
      ansible.builtin.set_fact:
        showroom_ready: false
        showroom_url: ""

    - name: Report Showroom failure
      ansible.builtin.fail:
        msg: >-
          Showroom deployment failed: {{ ansible_failed_result.msg | default('unknown error') }}.
          Check Helm release 'showroom' in namespace {{ masworld_showroom_namespace }}.
