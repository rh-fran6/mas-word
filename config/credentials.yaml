---
# Credential REFERENCES only — no secret values in this file.
#
# IBM secrets use the secret:// scheme, resolved from secrets/masworld-secrets.yml.
# Per-cluster credentials (AWS keys, admin passwords) are in secrets/cluster-credentials.yml.
ibm:
  entitlement_key_ref: "secret://mas-world/ibm/entitlement-key"
  license_ref: "secret://mas-world/ibm/license"

container_registry:
  pull_secret_ref: "secret://mas-world/registry/pull-secret"
