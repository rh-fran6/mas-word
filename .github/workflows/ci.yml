name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-validate:
    name: Lint and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: lint-pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: lint-pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          ansible-galaxy install -r requirements.yml --force

      - name: Run yamllint
        run: yamllint -c .yamllint.yml .

      - name: Run ansible-lint
        run: ansible-lint playbooks/ roles/

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run shellcheck
        run: |
          shfiles=$(find . -name '*.sh' -not -path './.git/*' -not -path './.venv/*' -not -path './.claude/*' -not -path './collections/*')
          if [ -n "$shfiles" ]; then
            echo "$shfiles" | xargs shellcheck
          else
            echo "No shell scripts found, skipping."
          fi

      - name: Validate config YAML syntax
        run: |
          python -c "
          import yaml, sys, pathlib
          errors = 0
          for f in pathlib.Path('config').rglob('*.yaml'):
              try:
                  yaml.safe_load(f.read_text())
                  print(f'  OK: {f}')
              except yaml.YAMLError as e:
                  print(f'FAIL: {f}: {e}', file=sys.stderr)
                  errors += 1
          sys.exit(1 if errors else 0)
          "

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: test-pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: test-pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          ansible-galaxy install -r requirements.yml --force

      - name: Run syntax checks
        run: bash tests/test_syntax.sh

      - name: Run unit tests
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results.xml
          retention-days: 14

  validate-manifests:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Validate ACM manifests
        run: |
          yamls=$(find acm -name '*.yaml' -o -name '*.yml' 2>/dev/null)
          if [ -n "$yamls" ]; then
            echo "$yamls" | xargs kubeconform \
              -strict \
              -ignore-missing-schemas \
              -summary
          else
            echo "No YAML manifests found in acm/, skipping."
          fi

  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      showroom: ${{ steps.filter.outputs.showroom }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Path filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            showroom:
              - 'showroom/**'
            docs:
              - '**/*.md'

  validate-showroom:
    name: Validate Showroom Content
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.showroom == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Antora
        run: npm install -g @antora/cli@3.1 @antora/site-generator-default@3.1

      - name: Build Antora site
        run: antora --fetch site.yml
        working-directory: showroom

      - name: Validate nav.adoc references
        run: |
          cd showroom/content/modules/ROOT
          nav_refs=$(grep -oP 'xref:\K[^[]+' nav.adoc | sort)
          actual_pages=$(ls pages/*.adoc 2>/dev/null | sed 's|pages/||' | sort)

          missing=0
          for ref in $nav_refs; do
            if [ ! -f "pages/$ref" ]; then
              echo "ERROR: nav.adoc references '$ref' but pages/$ref does not exist"
              missing=1
            fi
          done

          exit $missing

  docs-links:
    name: Check Documentation Links
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for broken relative links in Markdown
        run: |
          errors=0
          while IFS= read -r mdfile; do
            dir=$(dirname "$mdfile")
            grep -oP '\[([^\]]*)\]\(\K([^)]+)' "$mdfile" 2>/dev/null | \
              grep -v '^http' | grep -v '^mailto:' | grep -v '^#' | \
              while IFS= read -r link; do
                target="${link%%#*}"
                if [ -n "$target" ] && [ ! -e "$dir/$target" ]; then
                  echo "BROKEN LINK in $mdfile: $link"
                  echo 1 > /tmp/link_error
                fi
              done
          done < <(find . -name '*.md' -not -path './.git/*' -not -path './.venv/*' -not -path './.claude/*' -not -path './collections/*' -not -path './node_modules/*')

          if [ -f /tmp/link_error ]; then
            echo "Broken relative links detected."
            exit 1
          else
            echo "All relative links valid."
          fi
