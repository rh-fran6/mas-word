name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Linting and static validation
  # ---------------------------------------------------------------------------
  lint-and-validate:
    name: Lint and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: lint-pip-${{ runner.os }}-${{ hashFiles('mas-world-2026-automation/pyproject.toml') }}
          restore-keys: lint-pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yamllint ruff shellcheck-py
          pip install "ansible-core>=2.17.0,<2.18.0" "ansible-lint>=24.2,<25"
          pip install -e mas-world-2026-automation[dev]

      - name: Run yamllint
        run: yamllint -c .yamllint.yml .

      - name: Run ansible-lint
        run: ansible-lint -c .ansible-lint.yml
        working-directory: mas-world-2026-automation

      - name: Run ruff check
        run: ruff check mas-world-2026-automation/

      - name: Run ruff format check
        run: ruff format --check mas-world-2026-automation/

      - name: Run shellcheck
        run: |
          shfiles=$(find . -name '*.sh' -not -path './.git/*' -not -path './.venv/*' -not -path './.claude/*')
          if [ -n "$shfiles" ]; then
            echo "$shfiles" | xargs shellcheck
          else
            echo "No shell scripts found, skipping."
          fi

      - name: Validate config YAML syntax
        run: |
          python -c "
          import yaml, sys, pathlib
          errors = 0
          for f in pathlib.Path('mas-world-2026-automation/config').rglob('*.yaml'):
              try:
                  yaml.safe_load(f.read_text())
                  print(f'  OK: {f}')
              except yaml.YAMLError as e:
                  print(f'FAIL: {f}: {e}', file=sys.stderr)
                  errors += 1
          sys.exit(1 if errors else 0)
          "

  # ---------------------------------------------------------------------------
  # Job 2: Secret scanning
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ---------------------------------------------------------------------------
  # Job 3: Unit tests
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mas-world-2026-automation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: test-pip-${{ runner.os }}-${{ hashFiles('mas-world-2026-automation/pyproject.toml') }}
          restore-keys: test-pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: mas-world-2026-automation/test-results.xml
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 4: Validate Kubernetes manifests
  # ---------------------------------------------------------------------------
  validate-manifests:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Validate ACM manifests
        run: |
          yamls=$(find mas-world-2026-acm -name '*.yaml' -o -name '*.yml' 2>/dev/null)
          if [ -n "$yamls" ]; then
            echo "$yamls" | xargs kubeconform \
              -strict \
              -ignore-missing-schemas \
              -summary
          else
            echo "No YAML manifests found in mas-world-2026-acm/, skipping."
          fi

  # ---------------------------------------------------------------------------
  # Job 5: Validate Showroom (Antora) content
  # ---------------------------------------------------------------------------
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      showroom: ${{ steps.filter.outputs.showroom }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Path filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            showroom:
              - 'mas-world-2026-showroom/**'
            docs:
              - '**/*.md'

  validate-showroom:
    name: Validate Showroom Content
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.showroom == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Antora
        run: npm install -g @antora/cli@3.1 @antora/site-generator-default@3.1

      - name: Build Antora site
        run: antora --fetch site.yml
        working-directory: mas-world-2026-showroom

      - name: Validate nav.adoc references
        run: |
          cd mas-world-2026-showroom/content/modules/ROOT
          # Extract page references from nav.adoc
          nav_refs=$(grep -oP 'xref:\K[^[]+' nav.adoc | sort)
          # List actual pages
          actual_pages=$(ls pages/*.adoc 2>/dev/null | sed 's|pages/||' | sort)

          echo "Pages referenced in nav.adoc:"
          echo "$nav_refs"
          echo ""
          echo "Actual pages on disk:"
          echo "$actual_pages"
          echo ""

          # Check for pages in nav that don't exist
          missing=0
          for ref in $nav_refs; do
            if [ ! -f "pages/$ref" ]; then
              echo "ERROR: nav.adoc references '$ref' but pages/$ref does not exist"
              missing=1
            fi
          done

          # Warn about pages not in nav (informational, not a failure)
          for page in $actual_pages; do
            if ! echo "$nav_refs" | grep -qx "$page"; then
              echo "WARNING: pages/$page exists but is not in nav.adoc"
            fi
          done

          exit $missing

  # ---------------------------------------------------------------------------
  # Job 6: Check documentation links
  # ---------------------------------------------------------------------------
  docs-links:
    name: Check Documentation Links
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for broken relative links in Markdown
        run: |
          errors=0
          # Find all Markdown files
          while IFS= read -r mdfile; do
            dir=$(dirname "$mdfile")
            # Extract relative links: [text](path) but not http/https/mailto/# links
            grep -oP '\[([^\]]*)\]\(\K([^)]+)' "$mdfile" 2>/dev/null | \
              grep -v '^http' | grep -v '^mailto:' | grep -v '^#' | \
              while IFS= read -r link; do
                # Strip anchor fragments
                target="${link%%#*}"
                if [ -n "$target" ] && [ ! -e "$dir/$target" ]; then
                  echo "BROKEN LINK in $mdfile: $link"
                  # Signal error via temp file since we're in a subshell
                  echo 1 > /tmp/link_error
                fi
              done
          done < <(find . -name '*.md' -not -path './.git/*' -not -path './.venv/*' -not -path './.claude/*' -not -path './node_modules/*')

          if [ -f /tmp/link_error ]; then
            echo ""
            echo "Broken relative links detected. Please fix them."
            exit 1
          else
            echo "All relative links in Markdown files are valid."
          fi
