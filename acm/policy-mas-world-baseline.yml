---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-mas-world-baseline
  namespace: mas-world-2026-policies
  labels:
    event: mas-world-2026
    managed-by: masworld-automation
  annotations:
    policy.open-cluster-management.io/standards: MAS World 2026
    policy.open-cluster-management.io/categories: Workshop Baseline
    policy.open-cluster-management.io/controls: Environment Readiness
spec:
  disabled: false
  remediationAction: inform
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: verify-mas-namespace
        spec:
          remediationAction: inform
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: mas-inst1-core

    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: verify-logging-operator
        spec:
          remediationAction: inform
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: cluster-logging
                  namespace: openshift-logging
                spec:
                  channel: stable-6.6

    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: verify-lokistack
        spec:
          remediationAction: inform
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: loki.grafana.com/v1
                kind: LokiStack
                metadata:
                  name: masworld-loki
                  namespace: openshift-logging

    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: verify-cluster-log-forwarder
        spec:
          remediationAction: inform
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: observability.openshift.io/v1
                kind: ClusterLogForwarder
                metadata:
                  name: masworld-log-forwarder
                  namespace: openshift-logging

    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: enforce-event-marker
        spec:
          remediationAction: enforce
          severity: low
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: masworld-event-marker
                  namespace: masworld-system
                data:
                  event: mas-world-2026
                  date: "2026-08-17"
                  managed-by: masworld-automation
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-policy-mas-world-baseline
  namespace: mas-world-2026-policies
  labels:
    event: mas-world-2026
placementRef:
  name: mas-world-2026-all-clusters
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-mas-world-baseline
    apiGroup: policy.open-cluster-management.io
    kind: Policy
