---
# MAS World 2026 -- Teardown Workload
#
# Executed when a catalog order is deprovisioned or after the event.
# Removes event-specific resources, revokes credentials, and cleans
# up cloud resources.
#
# This workload does NOT delete the OpenShift cluster. Cluster
# deletion is handled by the external provisioning system.

workload:
  name: mas-world-teardown
  display_name: "MAS World 2026 Teardown"
  description: >-
    Remove event-specific configuration, revoke credentials, clean up
    S3 buckets, unregister from ACM, and remove Showroom. Does not
    delete the cluster itself.
  version: "1.0.0"
  idempotent: true
  resume_on_failure: true

  collection:
    namespace: masworld
    name: automation
    version: "0.1.0"
    source: "https://github.com/rhpds/mas-world-2026.git"
    requirements_file: requirements.yml

  # Teardown roles -- executed in reverse dependency order
  roles:
    - name: showroom
      description: "Remove Showroom deployment"
      required: false
      action: teardown
      skip_on_failure: true

    - name: student_accounts
      description: "Disable and remove student accounts and RBAC"
      required: true
      action: teardown
      skip_on_failure: false

    - name: sample_workloads
      description: "Remove sample workloads and exercise data"
      required: false
      action: teardown
      skip_on_failure: true

    - name: identity_demo
      description: "Remove Keycloak resources and OAuth configuration"
      required: false
      action: teardown
      skip_on_failure: true

    - name: log_forwarding
      description: "Remove ClusterLogForwarder"
      required: false
      action: teardown
      skip_on_failure: true

    - name: loki_stack
      description: "Remove LokiStack and object-storage secrets"
      required: false
      action: teardown
      skip_on_failure: true

    - name: logging_operator
      description: "Remove OpenShift Logging Operator subscription"
      required: false
      action: teardown
      skip_on_failure: true

    - name: acm_registration
      description: "Unregister cluster from ACM hub"
      required: false
      action: teardown
      skip_on_failure: true
      when: "{{ acm_registration_enabled | default(false) }}"

    - name: event_metadata
      description: "Remove event labels and namespace markers"
      required: false
      action: teardown
      skip_on_failure: true

  # Post-teardown actions
  post_actions:
    - description: "Revoke AWS IAM credentials for S3 access"
      type: aws_credential_revocation
      when: "{{ loki_object_storage_mode is defined }}"

    - description: "Delete S3 bucket for this cluster"
      type: s3_bucket_cleanup
      bucket_name: "{{ aws_s3_bucket_prefix }}-seat-{{ seat_number | pad(2) }}-loki"
      when: "{{ loki_object_storage_mode == 'bucket-per-cluster' }}"

    - description: "Invalidate student password in secret provider"
      type: secret_revocation
      secret_ref: "{{ student_password_secret_ref_template }}"

    - description: "Mark cluster as decommissioned in fleet inventory"
      type: inventory_update
      status: decommissioned

  required_variables:
    - seat_number
    - cluster_api_url
    - cluster_admin_secret_ref
    - aws_s3_bucket_prefix
    - aws_default_region
    - student_password_secret_ref_template

  optional_variables:
    - acm_registration_enabled
    - loki_object_storage_mode
