---
# MAS World 2026 Workshop -- Main Catalog Item
#
# Status: MANUAL_FALLBACK_SKILL_UNAVAILABLE
# The /agnosticv:catalog-builder skill was evaluated but does not natively
# support the existing-cluster integration model. This catalog was built
# manually following RHDP AgnosticV conventions.
#
# This catalog item defines the post-provisioning configuration for
# MAS World 2026 attendee clusters. It does NOT provision clusters.
# Clusters must be provisioned externally and registered with RHDP
# before this catalog item is ordered.

catalog_item:
  name: mas-world-2026-workshop
  display_name: "MAS World 2026 Workshop"
  description: >-
    Post-provisioning configuration for MAS World 2026 attendee clusters.
    Installs MAS Core, Maximo Manage, OpenShift Logging with Loki,
    identity provider integration, student accounts, and Showroom.
  category: Workshops
  provider: Red Hat
  icon: openshift
  tags:
    - maximo
    - openshift
    - acm
    - logging
    - workshop
    - mas-world-2026
  version: "1.0.0"
  maintainers:
    - name: Francis Anyaegbu
      email: fanyaegb@redhat.com

  # Lifecycle
  lifecycle:
    default_runtime_hours: 12
    maximum_runtime_hours: 48
    allow_extension: true

  # Platform requirements
  # Clusters are NOT provisioned by this catalog item.
  # See docs/existing-cluster-workflow.md for the integration model.
  platform:
    type: existing
    provider: aws
    ocp_version: "4.21"
    architecture: amd64
    minimum_workers: 3
    minimum_worker_vcpu: 16
    minimum_worker_memory_gi: 64

  # Variable includes -- loaded in order, later files override earlier
  includes:
    - ../vars/common.yml
    - ../vars/event.yml

  # Parameters exposed to the RHDP order form
  parameters:
    - name: seat_number
      display_name: "Seat Number"
      description: "Attendee seat number (1-50)"
      type: integer
      required: true
      min: 1
      max: 99

    - name: cluster_api_url
      display_name: "Cluster API URL"
      description: "OpenShift API URL for the pre-provisioned cluster"
      type: string
      required: true
      validation: "^https://api\\..+:\\d+$"

    - name: cluster_admin_secret_ref
      display_name: "Admin Credential Reference"
      description: "Secret reference for cluster administrative credentials"
      type: string
      required: true
      secret: true
      validation: "^secret://[\\w-]+/[\\w-]+(/[\\w-]+)*$"

    - name: environment
      display_name: "Environment"
      description: "Target environment for variable selection"
      type: string
      required: false
      default: event
      enum:
        - development
        - rehearsal
        - event

  # Workload references -- executed in order
  agnosticd_workloads:
    - name: mas-world-post-provision
      src: ../workloads/mas-world-post-provision.yml
      description: "Full post-provisioning configuration"

    - name: mas-world-showroom
      src: ../workloads/mas-world-showroom.yml
      description: "Showroom deployment and parameterization"

  # Teardown workload -- executed on deprovision
  agnosticd_teardown:
    - name: mas-world-teardown
      src: ../workloads/mas-world-teardown.yml
      description: "Environment teardown and credential revocation"

  # Access data returned to the user after deployment
  agnosticd_user_info:
    src: ../access-data/user-info-template.yml

  # Credential handling
  credentials:
    ibm_entitlement_key_ref: "secret://mas-world/ibm/entitlement-key"
    ibm_license_ref: "secret://mas-world/ibm/license"
    aws_access_key_id_ref: "secret://mas-world/AWS_ACCESS_KEY_ID"
    aws_secret_access_key_ref: "secret://mas-world/AWS_ACCESS_KEY_SECRET"
    # ACM hub credentials come from cluster inventory (hub_cluster_id)
    container_registry_pull_secret_ref: "secret://mas-world/registry/pull-secret"
