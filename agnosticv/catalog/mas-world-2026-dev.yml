---
# MAS World 2026 Workshop -- Development Variant
#
# Status: MANUAL_FALLBACK_SKILL_UNAVAILABLE
#
# Lightweight development variant for testing automation changes.
# Uses a single cluster with relaxed validation and shared passwords
# permitted for convenience.

catalog_item:
  name: mas-world-2026-dev
  display_name: "MAS World 2026 Workshop (Development)"
  description: >-
    Development variant of the MAS World 2026 workshop.
    Single-cluster configuration with relaxed constraints for
    iterating on automation and content.
  category: Workshops
  provider: Red Hat
  icon: openshift
  tags:
    - maximo
    - openshift
    - workshop
    - mas-world-2026
    - development
  version: "1.0.0"
  maintainers:
    - name: Francis Anyaegbu
      email: fanyaegb@redhat.com

  lifecycle:
    default_runtime_hours: 8
    maximum_runtime_hours: 24
    allow_extension: true

  platform:
    type: existing
    provider: aws
    ocp_version: "4.21"
    architecture: amd64
    minimum_workers: 3
    minimum_worker_vcpu: 16
    minimum_worker_memory_gi: 64

  # Variable includes -- development overrides applied last
  includes:
    - ../vars/common.yml
    - ../vars/development.yml

  parameters:
    - name: seat_number
      display_name: "Seat Number"
      description: "Attendee seat number"
      type: integer
      required: false
      default: 1
      min: 1
      max: 5

    - name: cluster_api_url
      display_name: "Cluster API URL"
      description: "OpenShift API URL for the pre-provisioned cluster"
      type: string
      required: true
      validation: "^https://api\\..+:\\d+$"

    - name: cluster_admin_secret_ref
      display_name: "Admin Credential Reference"
      description: "Secret reference for cluster administrative credentials"
      type: string
      required: true
      secret: true
      validation: "^secret://[\\w-]+/[\\w-]+(/[\\w-]+)*$"

    - name: environment
      display_name: "Environment"
      description: "Fixed to development"
      type: string
      required: false
      default: development
      enum:
        - development

  # Development overrides
  variable_overrides:
    fleet_attendee_count: 1
    fleet_spare_count: 0
    fleet_facilitator_count: 1
    fleet_require_exact_counts: false
    fleet_max_concurrent_clusters: 1
    student_allow_shared_password: true
    secret_provider: env
    logging_log_level: debug

  agnosticd_workloads:
    - name: mas-world-post-provision
      src: ../workloads/mas-world-post-provision.yml
      description: "Full post-provisioning configuration"

    - name: mas-world-showroom
      src: ../workloads/mas-world-showroom.yml
      description: "Showroom deployment and parameterization"

  agnosticd_teardown:
    - name: mas-world-teardown
      src: ../workloads/mas-world-teardown.yml
      description: "Environment teardown and credential revocation"

  agnosticd_user_info:
    src: ../access-data/user-info-template.yml

  credentials:
    ibm_entitlement_key_ref: "secret://mas-world/ibm/entitlement-key"
    ibm_license_ref: "secret://mas-world/ibm/license"
    aws_access_key_id_ref: "secret://mas-world/AWS_ACCESS_KEY_ID"
    aws_secret_access_key_ref: "secret://mas-world/AWS_ACCESS_KEY_SECRET"
    # ACM hub credentials come from cluster inventory (hub_cluster_id)
    container_registry_pull_secret_ref: "secret://mas-world/registry/pull-secret"
