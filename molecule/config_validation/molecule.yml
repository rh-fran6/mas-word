---
# Molecule scenario: config_validation
#
# Tests the config_validation role which validates YAML configuration
# keys, credential reference formats, and component flags.
#
# This scenario runs entirely locally — no Kubernetes cluster required.
# It exercises pure Ansible variable inspection logic.
dependency:
  name: galaxy
driver:
  name: default
platforms:
  - name: instance
    managed: false
    connection: local
provisioner:
  name: ansible
  inventory:
    host_vars:
      instance:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
  env:
    ANSIBLE_ROLES_PATH: ../../roles
    ANSIBLE_FILTER_PLUGINS: ../../plugins/filter
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
