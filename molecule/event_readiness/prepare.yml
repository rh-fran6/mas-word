---
# Prepare: create directories and fixtures for event_readiness tests.
- name: Prepare event_readiness test fixtures
  hosts: instance
  gather_facts: false
  tasks:
    - name: Create readiness report output directory
      ansible.builtin.file:
        path: /tmp/masworld-molecule-readiness
        state: directory
        mode: "0755"

    - name: Clean any previous test reports
      ansible.builtin.find:
        paths: /tmp/masworld-molecule-readiness
        patterns: "readiness-*.yml"
      register: _old_reports

    - name: Remove previous test reports
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _old_reports.files }}"
      when: _old_reports.files | length > 0
