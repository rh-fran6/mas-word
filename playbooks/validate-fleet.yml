---
- name: Validate entire MAS World 2026 fleet
  hosts: localhost
  gather_facts: false
  vars:
    masworld_config_dir: "{{ config_dir | default('config') }}"
    masworld_environment: "{{ env | default('development') }}"
    masworld_validation_results: []

  tasks:
    - name: Load cluster credentials
      ansible.builtin.include_vars:
        file: "../secrets/cluster-credentials.yml"
      no_log: true

    - name: Build enabled cluster list
      ansible.builtin.set_fact:
        masworld_enabled_clusters: "{{ cluster_credentials | to_cluster_list }}"
      no_log: true

    - name: Validate each cluster
      ansible.builtin.include_tasks: _validate-single-cluster.yml
      loop: "{{ masworld_enabled_clusters }}"
      loop_control:
        loop_var: cluster
        label: "{{ cluster.id }}"

    - name: Compute fleet summary
      ansible.builtin.set_fact:
        masworld_fleet_ready_count: "{{ masworld_validation_results | selectattr('readiness', 'equalto', 'READY') | list | length }}"
        masworld_fleet_warning_count: "{{ masworld_validation_results | selectattr('readiness', 'equalto', 'WARNING') | list | length }}"
        masworld_fleet_failed_count: "{{ masworld_validation_results | selectattr('readiness', 'equalto', 'FAILED') | list | length }}"

    - name: Display fleet validation summary
      ansible.builtin.debug:
        msg: >-
          Fleet validation complete:
          {{ masworld_fleet_ready_count }} READY,
          {{ masworld_fleet_warning_count }} WARNING,
          {{ masworld_fleet_failed_count }} FAILED
          out of {{ masworld_enabled_clusters | length }} clusters.

    - name: Fail if any clusters are FAILED
      ansible.builtin.fail:
        msg: "{{ masworld_fleet_failed_count }} cluster(s) FAILED validation. Review reports for details."
      when: masworld_fleet_failed_count | int > 0
