---
- name: Provision ROSA HCP Multi-Cluster Fleet
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../secrets/rosa-token.yml
    - ../secrets/cluster-credentials.yml

  pre_tasks:
    - name: Validate minimum Ansible version
      ansible.builtin.assert:
        that:
          - ansible_version.full is version('2.14', '>=')
        fail_msg: "Ansible 2.14+ is required. Found: {{ ansible_version.full }}"

    - name: Load OpenShift version from components config
      ansible.builtin.include_vars:
        file: "../config/components.yaml"
        name: masworld_components

    - name: Set rosa_version from components config
      ansible.builtin.set_fact:
        rosa_version: "{{ masworld_components.components.openshift.version }}"

  roles:
    - role: rosa_preflight

    - role: rosa_cluster
      vars:
        rosa_action: create

    - role: rosa_cluster
      vars:
        rosa_action: wait_ready

    - role: rosa_cluster
      vars:
        rosa_action: create_admin

    - role: rosa_cluster
      vars:
        rosa_action: save_credentials

    - role: rosa_cluster
      vars:
        rosa_action: machinepool

    - role: rosa_cluster
      vars:
        rosa_action: verify
