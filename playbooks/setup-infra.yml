---
- name: Set Up AWS Infrastructure and ROSA Account Enrollment
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../secrets/rosa-token.yml
    - ../secrets/cluster-credentials.yml

  pre_tasks:
    - name: Validate minimum Ansible version
      ansible.builtin.assert:
        that:
          - ansible_version.full is version('2.14', '>=')
        fail_msg: "Ansible 2.14+ is required. Found: {{ ansible_version.full }}"

  roles:
    - role: rosa_preflight

    - role: aws_infra
      vars:
        infra_action: create

    - role: rosa_account_setup

    - role: aws_infra
      vars:
        infra_action: verify
