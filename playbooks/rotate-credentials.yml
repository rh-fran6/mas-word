---
- name: Rotate student credentials
  hosts: "{{ target_cluster | default('localhost') }}"
  gather_facts: false
  vars:
    masworld_cluster_id: "{{ cluster_id | mandatory }}"
    masworld_seat_number: "{{ seat_number | default('') }}"
    masworld_rotate_all: "{{ rotate_all | default(false) | bool }}"

  tasks:
    - name: Display rotation target
      ansible.builtin.debug:
        msg: >-
          Rotating credentials on {{ masworld_cluster_id }},
          seat: {{ masworld_seat_number | default('all seats') }}

    - name: Rotate specific seat credential
      when: masworld_seat_number | length > 0
      block:
        - name: Generate new password for seat {{ masworld_seat_number }}
          ansible.builtin.set_fact:
            masworld_new_password: "{{ lookup('password', '/dev/null length=18 chars=ascii_letters,digits') }}"
          no_log: true

        - name: Update htpasswd secret for seat {{ masworld_seat_number }}
          ansible.builtin.include_role:
            name: student_accounts
          vars:
            masworld_student_rotate_seat: "{{ masworld_seat_number }}"
            masworld_student_new_password: "{{ masworld_new_password }}"

        - name: Store rotated credential in secret provider
          ansible.builtin.debug:
            msg: "Credential rotated for seat {{ masworld_seat_number }}"

    - name: Rotate all seat credentials
      when: masworld_rotate_all | bool and masworld_seat_number | length == 0
      block:
        - name: Include student accounts role in rotation mode
          ansible.builtin.include_role:
            name: student_accounts
          vars:
            masworld_student_rotate_all: true

    - name: Validate credentials after rotation
      ansible.builtin.include_role:
        name: event_readiness
      vars:
        masworld_readiness_checks:
          - student_access
