---
- name: Prepare a single cluster for MAS World 2026
  hosts: "{{ target_cluster | default('localhost') }}"
  gather_facts: false
  vars:
    masworld_cluster_id: "{{ masworld_cluster_id | default(cluster_id | default('')) }}"
    masworld_cluster_purpose: "{{ cluster_purpose | default('attendee') }}"
    masworld_preparation_stage: ""
    masworld_preparation_results: {}

  module_defaults:
    group/kubernetes.core.k8s:
      host: "{{ masworld_cluster_api_url | default(omit, true) }}"
      api_key: "{{ masworld_api_token | default(omit, true) }}"
      kubeconfig: "{{ masworld_kubeconfig | default(omit, true) }}"
      validate_certs: "{{ masworld_validate_certs | default(true) }}"

  pre_tasks:
    - name: Record preparation start
      ansible.builtin.set_fact:
        masworld_preparation_start: "{{ now(utc=true) }}"

    - name: Display cluster preparation target
      ansible.builtin.debug:
        msg: "Preparing cluster {{ masworld_cluster_id }} (purpose: {{ masworld_cluster_purpose }}, seat: {{ masworld_seat_number | default('unassigned') }})"

    - name: Load MAS World secrets if not already set
      when: masworld_ibm_entitlement_key is not defined or masworld_ibm_entitlement_key | length == 0
      block:
        - name: Load secrets file
          ansible.builtin.include_vars:
            file: "../secrets/masworld-secrets.yml"
            name: _masworld_raw_secrets
          no_log: true

        - name: Resolve IBM entitlement key
          ansible.builtin.set_fact:
            masworld_ibm_entitlement_key: >-
              {{ lookup('ansible.builtin.file',
                 playbook_dir + '/../secrets/' + _masworld_raw_secrets['ibm/entitlement-key'] | regex_replace('^file://', ''),
                 errors='ignore')
                 | default(_masworld_raw_secrets['ibm/entitlement-key'] | default(''), true) }}
          no_log: true

        - name: Resolve MAS license file
          ansible.builtin.set_fact:
            masworld_mas_license_file: >-
              {{ lookup('ansible.builtin.file',
                 playbook_dir + '/../secrets/' + _masworld_raw_secrets['ibm/license'] | regex_replace('^file://', ''),
                 errors='ignore')
                 | default('', true) }}
          no_log: true
          when: (_masworld_raw_secrets['ibm/license'] | default('')) is match('^file://')

    - name: Derive base_domain from API URL if not set
      ansible.builtin.set_fact:
        masworld_base_domain: "{{ masworld_cluster_api_url | regex_replace('^https?://api\\.', '') | regex_replace(':.*$', '') }}"
      when:
        - masworld_base_domain is not defined or masworld_base_domain | length == 0
        - masworld_cluster_api_url is defined
        - masworld_cluster_api_url | length > 0

    - name: Set cluster name from cluster_id if not set
      ansible.builtin.set_fact:
        masworld_cluster_name: "{{ masworld_cluster_id }}"
      when: masworld_cluster_name is not defined or masworld_cluster_name | length == 0

    - name: Set event_id default if not set
      ansible.builtin.set_fact:
        masworld_event_id: "mas-world-2026"
      when: masworld_event_id is not defined or masworld_event_id | length == 0

    - name: Resolve component profile from cluster purpose
      ansible.builtin.include_tasks: _resolve-cluster-profile.yml

    - name: Exchange username/password for OAuth token
      when:
        - masworld_admin_password is defined
        - masworld_admin_password | length > 0
        - masworld_api_token is not defined or masworld_api_token | length == 0
      block:
        - name: Discover OAuth server URL
          ansible.builtin.uri:
            url: "{{ masworld_cluster_api_url }}/.well-known/oauth-authorization-server"
            method: GET
            validate_certs: "{{ masworld_validate_certs | default(true) }}"
            status_code: [200]
          register: _oauth_metadata

        - name: Request OAuth token from cluster
          ansible.builtin.uri:
            url: "{{ _oauth_metadata.json.authorization_endpoint }}?response_type=token&client_id=openshift-challenging-client"
            method: GET
            user: "{{ masworld_admin_username | default('cluster-admin') }}"
            password: "{{ masworld_admin_password }}"
            force_basic_auth: true
            validate_certs: "{{ masworld_validate_certs | default(true) }}"
            follow_redirects: none
            status_code: [302]
          register: _oauth_response
          no_log: true

        - name: Extract bearer token from redirect
          ansible.builtin.set_fact:
            masworld_api_token: "{{ _oauth_response.location | regex_search('access_token=([^&]+)', '\\1') | first }}"
          no_log: true

        - name: Confirm authentication succeeded
          ansible.builtin.debug:
            msg: "OAuth token obtained for {{ masworld_admin_username | default('cluster-admin') }}"

    - name: Write kubeconfig for subprocess isolation
      ansible.builtin.copy:
        content: |
          apiVersion: v1
          kind: Config
          clusters:
          - name: {{ masworld_cluster_id }}
            cluster:
              server: {{ masworld_cluster_api_url }}
              insecure-skip-tls-verify: true
          contexts:
          - name: {{ masworld_cluster_id }}
            context:
              cluster: {{ masworld_cluster_id }}
              user: admin
          current-context: {{ masworld_cluster_id }}
          users:
          - name: admin
            user:
              token: {{ masworld_api_token }}
        dest: "{{ lookup('ansible.builtin.env', 'KUBECONFIG') | default('/tmp/masworld-kubeconfig-' + masworld_cluster_id, true) }}"
        mode: "0600"
      no_log: true
      when:
        - masworld_api_token is defined
        - masworld_api_token | length > 0

  roles:
    - role: efs_csi_driver
      tags: [efs, storage]
      when: masworld_efs_filesystem_id | default('') | length > 0

    - role: config_validation
      tags: [config, validate]

    - role: cluster_preflight
      tags: [preflight]

    - role: event_metadata
      tags: [metadata]

    - role: acm_hub
      tags: [acm, hub]
      when:
        - masworld_cluster_purpose | default('attendee') == 'hub'
        - masworld_acm_hub_enabled | default(true) | bool

    - role: acm_registration
      tags: [acm]
      when:
        - masworld_acm_enabled | default(false) | bool
        - masworld_cluster_purpose | default('attendee') != 'hub'

    - role: mas_prerequisites
      tags: [mas, prerequisites]
      when: masworld_mas_prerequisites_enabled | default(true) | bool

    - role: mas_core
      tags: [mas, core]
      when: masworld_mas_core_enabled | default(true) | bool

    - role: maximo_manage
      tags: [mas, manage]
      when: masworld_manage_enabled | default(true) | bool

    - role: logging_operator
      tags: [logging, operators]
      when: masworld_logging_enabled | default(true) | bool

    - role: loki_stack
      tags: [logging, loki]
      when: masworld_loki_enabled | default(true) | bool

    - role: log_forwarding
      tags: [logging, forwarding]
      when: masworld_log_forwarding_enabled | default(true) | bool

    - role: identity_demo
      tags: [identity]
      when: masworld_identity_enabled | default(true) | bool

    - role: mas_edge
      tags: [edge]
      when: masworld_mas_edge_enabled | default(false) | bool

    - role: student_accounts
      tags: [students]
      when: masworld_student_accounts_enabled | default(true) | bool

    - role: sample_workloads
      tags: [exercises, samples]
      when: masworld_sample_workloads_enabled | default(true) | bool

    - role: showroom
      tags: [showroom]
      when: masworld_showroom_enabled | default(true) | bool

    - role: event_readiness
      tags: [readiness, validate]

    - role: environment_report
      tags: [report]

  post_tasks:
    - name: Record preparation end
      ansible.builtin.set_fact:
        masworld_preparation_end: "{{ now(utc=true) }}"

    - name: Display preparation summary
      ansible.builtin.debug:
        msg: >-
          Cluster {{ masworld_cluster_id }} preparation complete.
          Result: {{ readiness_result | default('UNKNOWN') }}.
          Duration: {{ masworld_preparation_start }} to {{ masworld_preparation_end }}.
