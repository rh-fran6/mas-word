---
- name: Check ROSA HCP Cluster Fleet Status
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../secrets/cluster-credentials.yml

  pre_tasks:
    - name: Build cluster definitions
      ansible.builtin.set_fact:
        cluster_definitions: >-
          {{ cluster_categories | build_cluster_list(cluster_prefix, cluster_credentials, infra_state | default({})) }}
      no_log: true

  roles:
    - role: rosa_cluster
      vars:
        rosa_action: status
