---
# Scenario 1: Greenfield — full pipeline from fresh AWS accounts
# Called by deploy.yml after scenario_preflight passes

- name: "=== GREENFIELD Step 1/5: Create AWS Infrastructure ==="
  ansible.builtin.debug:
    msg: "Creating VPCs, subnets, NAT gateways for {{ cluster_definitions | length }} accounts..."

- name: Create AWS infrastructure
  ansible.builtin.include_role:
    name: aws_infra
  vars:
    infra_action: create

- name: "=== GREENFIELD Step 2/5: ROSA Account Enrollment ==="
  ansible.builtin.debug:
    msg: "Initializing ROSA, creating account roles and OIDC configs..."

- name: Setup ROSA accounts
  ansible.builtin.include_role:
    name: rosa_account_setup

- name: Verify AWS infrastructure
  ansible.builtin.include_role:
    name: aws_infra
  vars:
    infra_action: verify

- name: "=== GREENFIELD Step 3/5: Provision ROSA HCP Clusters ==="
  ansible.builtin.debug:
    msg: "Creating ROSA HCP clusters..."

- name: Create clusters
  ansible.builtin.include_role:
    name: rosa_cluster
  vars:
    rosa_action: create

- name: Wait for clusters to be ready
  ansible.builtin.include_role:
    name: rosa_cluster
  vars:
    rosa_action: wait_ready

- name: Create cluster admin users
  ansible.builtin.include_role:
    name: rosa_cluster
  vars:
    rosa_action: create_admin

- name: Save cluster credentials
  ansible.builtin.include_role:
    name: rosa_cluster
  vars:
    rosa_action: save_credentials

- name: "=== GREENFIELD Step 4/5: Configure Cluster Autoscaler ==="
  ansible.builtin.debug:
    msg: "Creating autoscaling machine pools..."

- name: Create topology-defined machine pools
  ansible.builtin.include_role:
    name: rosa_cluster
  vars:
    rosa_action: machinepool

- name: Create workshop machine pools
  ansible.builtin.include_role:
    name: rosa_cluster
  vars:
    rosa_action: workshop_machinepool
  when: workshop_machinepool_instance_type is defined

- name: Verify all clusters
  ansible.builtin.include_role:
    name: rosa_cluster
  vars:
    rosa_action: verify

- name: "=== GREENFIELD Step 5/5: Deploy Demo Application ==="
  ansible.builtin.debug:
    msg: "Preparing fleet for workshop..."

- name: Reload cluster credentials after provisioning
  ansible.builtin.include_vars:
    file: "../secrets/cluster-credentials.yml"
  no_log: true

- name: Build enabled cluster list for Phase 2
  ansible.builtin.set_fact:
    masworld_enabled_clusters: "{{ cluster_credentials | to_cluster_list }}"
  no_log: true

- name: Prepare each cluster
  ansible.builtin.include_tasks: _prepare-single-cluster.yml
  loop: "{{ masworld_enabled_clusters }}"
  loop_control:
    loop_var: cluster
    label: "{{ cluster.id }}"

- name: Validate each cluster
  ansible.builtin.include_tasks: _validate-single-cluster.yml
  loop: "{{ masworld_enabled_clusters }}"
  loop_control:
    loop_var: cluster
    label: "{{ cluster.id }}"

- name: "GREENFIELD deployment complete"
  ansible.builtin.debug:
    msg: |
      ══════════════════════════════════════════════════════════════
        GREENFIELD DEPLOYMENT COMPLETE
        {{ cluster_definitions | length }} clusters provisioned and prepared
      ══════════════════════════════════════════════════════════════
